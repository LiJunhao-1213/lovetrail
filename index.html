<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Love 轨迹 · 鲜红</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Love轨迹" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family:
          system-ui,
          -apple-system,
          "Helvetica Neue",
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        background: #f7f1ef;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 12px 12px 70px;
      }
      .app-container {
        max-width: 390px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 14px 14px;
        box-shadow: 0 2px 10px rgba(200, 50, 50, 0.06);
        border: 1px solid #f5dcd8;
      }
      .header-card {
        padding: 12px 14px 10px;
        background: #ffffff;
        border-bottom: 1px solid #f5dcd8;
        border-radius: 16px;
      }
      .app-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 22px;
        font-weight: 700;
        color: #e74c3c;
      }
      .app-title span {
        background: #fde8e4;
        padding: 2px 10px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 500;
        color: #e74c3c;
      }
      .subhead {
        font-size: 12px;
        color: #e08078;
        margin-top: 2px;
      }

      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid #f5dcd8;
        display: flex;
        justify-content: space-around;
        padding: 6px 8px env(safe-area-inset-bottom, 8px) 8px;
        max-width: 390px;
        margin: 0 auto;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        gap: 4px;
      }
      .tab-btn {
        background: none;
        border: none;
        padding: 6px 16px;
        border-radius: 40px;
        font-size: 13px;
        font-weight: 600;
        color: #d0a098;
        transition: all 0.15s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px;
        cursor: default;
        min-width: 56px;
      }
      .tab-btn .icon {
        font-size: 18px;
        line-height: 1.2;
      }
      .tab-btn .label {
        font-size: 10px;
        letter-spacing: 0.2px;
      }
      .tab-btn.active {
        color: #e74c3c;
        background: #fde8e4;
        box-shadow: 0 1px 4px rgba(200, 50, 50, 0.1);
      }
      .tab-btn:active {
        transform: scale(0.94);
        background: #fcd8d0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #fde8e4;
        border: none;
        border-radius: 30px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        color: #c0392b;
        transition: all 0.08s ease;
        cursor: default;
        border: 1px solid #f5dcd8;
        min-height: 40px;
      }
      .btn:active {
        background: #fcd8d0 !important;
        transform: scale(0.96);
      }
      .btn-primary {
        background: #fcd8d0;
        color: #a93226;
        border-color: #f5c8c0;
      }
      .btn-primary:active {
        background: #f5c8c0 !important;
      }
      .btn-small {
        padding: 6px 14px;
        font-size: 13px;
        background: #fde8e4;
        min-height: 32px;
      }

      .date-input-area {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .date-input-area input {
        flex: 1;
        border: 1px solid #f5dcd8;
        border-radius: 30px;
        padding: 8px 14px;
        font-size: 14px;
        background: #fefaf8;
        outline: none;
        color: #4a2a2a;
        min-height: 40px;
        min-width: 60px;
      }
      .date-input-area input:focus {
        border-color: #f0c8c0;
      }
      .date-input-area input[type="date"] {
        flex: 0 0 130px;
      }
      .date-btn-group {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
      }
      .date-btn-group .btn {
        flex: 1;
      }

      /* 旅行 - 添加按钮占一整行，与输入框等宽 */
      .trip-add-area {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 4px;
      }
      .trip-add-area .trip-inputs {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      .trip-add-area .trip-inputs input {
        flex: 1;
        border: 1px solid #f5dcd8;
        border-radius: 30px;
        padding: 8px 14px;
        font-size: 14px;
        background: #fefaf8;
        outline: none;
        color: #4a2a2a;
        min-height: 40px;
        min-width: 0;
      }
      .trip-add-area .trip-inputs input:focus {
        border-color: #f0c8c0;
      }
      .trip-add-area .trip-inputs input[type="date"] {
        flex: 0 0 120px;
      }
      .trip-add-area .btn {
        width: 100%;
        min-height: 40px;
        padding: 8px 20px;
        border-radius: 30px;
      }

      .list-container {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 260px;
        overflow-y: auto;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fefaf8;
        padding: 8px 14px;
        border-radius: 30px;
        font-size: 14px;
        border: 1px solid #f5dcd8;
        color: #4a2a2a;
        transition: background 0.1s;
      }
      .list-item:active {
        background: #fde8e4;
      }
      .list-item .delete-btn {
        background: none;
        border: none;
        font-size: 16px;
        color: #dbb0a8;
        padding: 0 4px;
        transition: 0.08s;
        cursor: default;
        line-height: 1;
      }
      .list-item .delete-btn:active {
        color: #c08078;
        transform: scale(0.9);
      }
      .empty-message {
        color: #dbb0a8;
        text-align: center;
        padding: 12px 0 6px;
        font-size: 13px;
      }

      .stat-summary {
        display: flex;
        justify-content: space-around;
        background: #fefaf8;
        border-radius: 30px;
        padding: 8px 4px;
        margin-top: 8px;
        border: 1px solid #f5dcd8;
      }
      .stat-item {
        text-align: center;
      }
      .stat-item .number {
        font-size: 18px;
        font-weight: 700;
        color: #e74c3c;
      }
      .stat-item .label {
        font-size: 10px;
        color: #e08078;
        margin-top: 0px;
      }

      .sort-area {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        margin: 2px 0 6px;
        align-items: center;
      }
      .sort-area select {
        border: none;
        background: #fde8e4;
        padding: 4px 12px;
        border-radius: 30px;
        font-size: 12px;
        color: #c0392b;
        outline: none;
        height: 28px;
      }

      /* Love */
      .love-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .love-field label {
        width: 50px;
        font-weight: 500;
        color: #c08078;
        font-size: 13px;
        flex-shrink: 0;
      }
      .love-field input {
        flex: 1;
        border: 1px solid #f5dcd8;
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 14px;
        background: #fefaf8;
        outline: none;
        color: #4a2a2a;
        min-height: 38px;
      }
      .love-field input:focus {
        border-color: #f0c8c0;
        background: #fff;
      }

      .love-field.hidden {
        display: none;
      }

      .name-card {
        background: #fefaf8;
        border-radius: 14px;
        padding: 14px 16px;
        text-align: center;
        border: 1px solid #f5dcd8;
        margin-bottom: 12px;
      }
      .name-card .names {
        font-size: 20px;
        font-weight: 700;
        color: #e74c3c;
        letter-spacing: 1px;
      }
      .name-card .heart {
        color: #e74c3c;
        margin: 0 8px;
        font-size: 22px;
      }
      .name-card .sub {
        font-size: 12px;
        color: #e08078;
        margin-top: 4px;
      }

      #saveLoveBtn {
        width: 100%;
        border-radius: 12px;
        padding: 12px;
        font-size: 15px;
        margin-top: 4px;
        background: #fcd8d0;
        border: 1px solid #f5c8c0;
        color: #a93226;
        min-height: 48px;
      }
      #saveLoveBtn:active {
        background: #f5c8c0 !important;
      }

      .anniversary-card {
        background: #fefaf8;
        border-radius: 14px;
        padding: 10px 14px;
        margin-bottom: 8px;
        border: 1px solid #f5dcd8;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .anniversary-card .info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .anniversary-card .date {
        font-size: 13px;
        color: #c08078;
      }
      .anniversary-card .event {
        font-size: 15px;
        font-weight: 500;
        color: #4a2a2a;
      }
      .anniversary-card .days {
        font-size: 12px;
        color: #e74c3c;
        margin-top: 2px;
      }
      .anniversary-card .del {
        background: none;
        border: none;
        font-size: 16px;
        color: #dbb0a8;
        padding: 0 8px;
        cursor: default;
      }
      .anniversary-card .del:active {
        color: #c08078;
        transform: scale(0.9);
      }

      .anniversary-add {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 0 4px;
      }
      .anniversary-add input[type="date"] {
        flex: 0 0 110px;
        border: 1px solid #f5dcd8;
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 13px;
        background: #fefaf8;
        outline: none;
        color: #4a2a2a;
        height: 36px;
      }
      .anniversary-add input[type="text"] {
        flex: 1;
        min-width: 0;
        border: 1px solid #f5dcd8;
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 13px;
        background: #fefaf8;
        outline: none;
        color: #4a2a2a;
        height: 36px;
      }
      .anniversary-add input[type="text"]::placeholder {
        font-size: 12px;
        color: #d0a098;
      }
      .anniversary-add .btn {
        flex-shrink: 0;
        min-height: 36px;
        padding: 0 16px;
        font-size: 14px;
        background: #fcd8d0;
        border-radius: 30px;
        border: 1px solid #f5c8c0;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 4px 0;
      }
      .overview-item {
        background: #fefaf8;
        border-radius: 14px;
        padding: 14px 8px;
        text-align: center;
        border: 1px solid #f5dcd8;
        cursor: default;
        transition: 0.1s;
      }
      .overview-item:active {
        background: #fde8e4;
        transform: scale(0.96);
      }
      .overview-item .num {
        font-size: 26px;
        font-weight: 700;
        color: #e74c3c;
      }
      .overview-item .lbl {
        font-size: 11px;
        color: #e08078;
        margin-top: 2px;
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      @supports (padding: max(0px)) {
        body {
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      @media (min-width: 430px) {
        .tab-bar {
          max-width: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="card header-card">
        <div class="app-title">❤️ Love 轨迹 <span>v1.0</span></div>
        <div class="subhead">记录每一次心动 · 珍藏地点</div>
      </div>

      <!-- ===== Tab1: 开房 ===== -->
      <div id="tab-date" class="tab-content active">
        <div class="card">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 4px;
            "
          >
            <span style="font-size: 18px">📅</span>
            <span style="font-weight: 600; font-size: 16px; color: #e74c3c"
              >开房日期</span
            >
            <span
              style="margin-left: auto; font-size: 12px; color: #e08078"
              id="dateCountLabel"
              >0 条</span
            >
          </div>
          <div class="date-input-area">
            <input type="date" id="newDateInput" />
            <input type="text" id="newDatePlace" placeholder="地点（可选）" />
          </div>
          <div class="date-btn-group">
            <button class="btn btn-primary" id="addDateBtn">➕ 添加</button>
            <button class="btn btn-primary" id="quickDateBtn">📆 今天</button>
          </div>
          <div class="list-container" id="dateListContainer">
            <div class="empty-message">还没有记录</div>
          </div>
          <div class="stat-summary">
            <div class="stat-item">
              <div class="number" id="totalDates">0</div>
              <div class="label">总记录</div>
            </div>
            <div class="stat-item">
              <div class="number" id="uniqueDateLocations">0</div>
              <div class="label">不同地点</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== Tab2: 旅行 ===== -->
      <div id="tab-trip" class="tab-content">
        <div class="card">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 2px;
            "
          >
            <span style="font-size: 18px">🗺️</span>
            <span style="font-weight: 600; font-size: 16px; color: #e74c3c"
              >旅行地点</span
            >
            <span
              style="margin-left: auto; font-size: 12px; color: #e08078"
              id="tripCountLabel"
              >0 条</span
            >
          </div>
          <!-- 旅行添加 - 按钮独占一行，与输入框等宽 -->
          <div class="trip-add-area">
            <div class="trip-inputs">
              <input
                type="text"
                id="newTripPlace"
                placeholder="地点名称"
                maxlength="30"
              />
              <input type="date" id="newTripDate" />
            </div>
            <button class="btn btn-primary" id="addTripBtn">➕ 添加</button>
          </div>
          <div class="sort-area">
            <label style="font-size: 11px; color: #e08078">排序：</label>
            <select id="tripSortOrder">
              <option value="desc">最新优先</option>
              <option value="asc">最早优先</option>
              <option value="name">按名称</option>
            </select>
          </div>
          <div class="list-container" id="tripListContainer">
            <div class="empty-message">还没有地点</div>
          </div>
          <div class="stat-summary">
            <div class="stat-item">
              <div class="number" id="totalTrips">0</div>
              <div class="label">总地点</div>
            </div>
            <div class="stat-item">
              <div class="number" id="uniqueTrips">0</div>
              <div class="label">不同城市</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== Tab3: 总览 ===== -->
      <div id="tab-overview" class="tab-content">
        <div class="card">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 6px;
            "
          >
            <span style="font-size: 18px">📊</span>
            <span style="font-weight: 600; font-size: 16px; color: #e74c3c"
              >统计总览</span
            >
            <span style="margin-left: auto; font-size: 11px; color: #e08078"
              >点击跳转</span
            >
          </div>
          <div class="overview-grid">
            <div class="overview-item" data-tab="tab-date">
              <div class="num" id="ovTotalDates">0</div>
              <div class="lbl">开房记录</div>
            </div>
            <div class="overview-item" data-tab="tab-trip">
              <div class="num" id="ovTotalTrips">0</div>
              <div class="lbl">旅行地点</div>
            </div>
            <div class="overview-item" data-tab="tab-trip">
              <div class="num" id="ovTotalCities">0</div>
              <div class="lbl">不同城市</div>
            </div>
            <div class="overview-item" data-tab="tab-love">
              <div class="num" id="ovLoveDays">-</div>
              <div class="lbl">恋爱天数</div>
            </div>
          </div>
          <div
            style="
              font-size: 12px;
              color: #dbb0a8;
              text-align: center;
              margin-top: 4px;
            "
          >
            点击卡片跳转到对应模块
          </div>
        </div>
      </div>

      <!-- ===== Tab4: Love ===== -->
      <div id="tab-love" class="tab-content">
        <div class="card">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              margin-bottom: 8px;
            "
          >
            <span style="font-size: 18px">💕</span>
            <span style="font-weight: 600; font-size: 16px; color: #e74c3c"
              >恋爱档案</span
            >
          </div>

          <div id="nameCard" class="name-card" style="display: none">
            <div class="names">
              <span id="displayMyName">我</span>
              <span class="heart">💗</span>
              <span id="displayHerName">她</span>
            </div>
            <div class="sub">❤️ 在一起</div>
          </div>

          <div class="love-field" id="myNameField">
            <label>我</label
            ><input type="text" id="loveMyName" placeholder="我的名字" />
          </div>
          <div class="love-field" id="herNameField">
            <label>她</label
            ><input type="text" id="loveHerName" placeholder="她的名字" />
          </div>
          <div class="love-field">
            <label>开始</label><input type="date" id="loveStartDate" />
          </div>

          <div
            style="
              font-weight: 500;
              font-size: 13px;
              color: #c08078;
              margin: 6px 0 4px;
            "
          >
            纪念日
          </div>
          <div class="anniversary-add">
            <input type="date" id="newAnniversaryDate" />
            <input
              type="text"
              id="newAnniversaryEvent"
              placeholder="一周年纪念日"
            />
            <button
              class="btn btn-small"
              id="addAnniversaryBtn"
              style="background: #fcd8d0"
            >
              ➕
            </button>
          </div>
          <div id="anniversaryContainer" style="margin-top: 4px"></div>

          <button class="btn btn-primary" id="saveLoveBtn">💾 保存档案</button>
          <div
            style="
              margin-top: 4px;
              font-size: 11px;
              color: #dbb0a8;
              text-align: center;
            "
          >
            数据自动保存在本地
          </div>
        </div>
      </div>

      <!-- 底部 Tab -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-date">
          <span class="icon">📅</span><span class="label">开房</span>
        </button>
        <button class="tab-btn" data-tab="tab-trip">
          <span class="icon">🗺️</span><span class="label">旅行</span>
        </button>
        <button class="tab-btn" data-tab="tab-overview">
          <span class="icon">📊</span><span class="label">总览</span>
        </button>
        <button class="tab-btn" data-tab="tab-love">
          <span class="icon">💕</span><span class="label">Love</span>
        </button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const STORAGE_KEY = "love_trail_v15";

        function getDefault() {
          return {
            dates: [],
            trips: [],
            love: { myName: "", herName: "", startDate: "", anniversaries: [] },
          };
        }

        function loadData() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const p = JSON.parse(raw);
              if (!p.dates) p.dates = [];
              if (!p.trips) p.trips = [];
              if (!p.love)
                p.love = {
                  myName: "",
                  herName: "",
                  startDate: "",
                  anniversaries: [],
                };
              if (!p.love.anniversaries) p.love.anniversaries = [];
              return p;
            }
          } catch (e) {}
          return getDefault();
        }

        function saveData() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        let appData = loadData();

        const tabBtns = document.querySelectorAll(".tab-btn");

        // 开房
        const dateList = document.getElementById("dateListContainer");
        const dateCountLabel = document.getElementById("dateCountLabel");
        const totalDates = document.getElementById("totalDates");
        const uniqueDateLocations = document.getElementById(
          "uniqueDateLocations",
        );
        const newDateInput = document.getElementById("newDateInput");
        const newDatePlace = document.getElementById("newDatePlace");
        const addDateBtn = document.getElementById("addDateBtn");
        const quickDateBtn = document.getElementById("quickDateBtn");

        // 旅行
        const tripList = document.getElementById("tripListContainer");
        const tripCountLabel = document.getElementById("tripCountLabel");
        const totalTrips = document.getElementById("totalTrips");
        const uniqueTrips = document.getElementById("uniqueTrips");
        const newTripPlace = document.getElementById("newTripPlace");
        const newTripDate = document.getElementById("newTripDate");
        const addTripBtn = document.getElementById("addTripBtn");
        const tripSortOrder = document.getElementById("tripSortOrder");

        // Love
        const loveMyName = document.getElementById("loveMyName");
        const loveHerName = document.getElementById("loveHerName");
        const loveStartDate = document.getElementById("loveStartDate");
        const saveLoveBtn = document.getElementById("saveLoveBtn");
        const anniversaryContainer = document.getElementById(
          "anniversaryContainer",
        );
        const newAnniversaryDate =
          document.getElementById("newAnniversaryDate");
        const newAnniversaryEvent = document.getElementById(
          "newAnniversaryEvent",
        );
        const addAnniversaryBtn = document.getElementById("addAnniversaryBtn");
        const nameCard = document.getElementById("nameCard");
        const displayMyName = document.getElementById("displayMyName");
        const displayHerName = document.getElementById("displayHerName");
        const myNameField = document.getElementById("myNameField");
        const herNameField = document.getElementById("herNameField");

        // 总览
        const ovTotalDates = document.getElementById("ovTotalDates");
        const ovTotalTrips = document.getElementById("ovTotalTrips");
        const ovTotalCities = document.getElementById("ovTotalCities");
        const ovLoveDays = document.getElementById("ovLoveDays");

        function getTodayStr() {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        }
        function formatDateDisplay(dateStr) {
          if (!dateStr) return "";
          const parts = dateStr.split("-");
          return `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
        }
        function calcLoveDays(startDate) {
          if (!startDate) return "-";
          const start = new Date(startDate);
          const now = new Date();
          const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
          return diff >= 0 ? diff + "天" : "-";
        }
        function calcDaysFrom(dateStr) {
          if (!dateStr) return "";
          const d = new Date(dateStr);
          const now = new Date();
          const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
          if (diff === 0) return "今天";
          if (diff > 0) return `已过 ${diff} 天`;
          return `还有 ${Math.abs(diff)} 天`;
        }

        // ===== 开房 =====
        function renderDates() {
          const d = appData.dates;
          if (!d || d.length === 0) {
            dateList.innerHTML = `<div class="empty-message">还没有记录</div>`;
          } else {
            const sorted = [...d].sort((a, b) => (a.date < b.date ? 1 : -1));
            let html = "";
            sorted.forEach((item, idx) => {
              const placePart = item.place ? ` · ${item.place}` : "";
              html += `<div class="list-item" data-idx="${idx}" data-type="date"><span>📆 ${formatDateDisplay(item.date)}${placePart}</span>
                    <button class="delete-btn" data-idx="${idx}" data-type="date">✕</button></div>`;
            });
            dateList.innerHTML = html;
            dateList
              .querySelectorAll('.list-item[data-type="date"]')
              .forEach((el) => {
                el.addEventListener("dblclick", function () {
                  const idx = parseInt(this.dataset.idx);
                  const item = appData.dates[idx];
                  if (!item) return;
                  const newPlace = prompt(
                    "修改地点（留空则清除）:",
                    item.place || "",
                  );
                  if (newPlace === null) return;
                  item.place = newPlace.trim() || "";
                  saveData();
                  renderAll();
                });
                let timer = null;
                el.addEventListener("touchstart", function (e) {
                  timer = setTimeout(() => {
                    const idx = parseInt(this.dataset.idx);
                    const item = appData.dates[idx];
                    if (!item) return;
                    const newPlace = prompt(
                      "修改地点（留空则清除）:",
                      item.place || "",
                    );
                    if (newPlace === null) return;
                    item.place = newPlace.trim() || "";
                    saveData();
                    renderAll();
                  }, 600);
                });
                el.addEventListener("touchend", function () {
                  clearTimeout(timer);
                });
                el.addEventListener("touchmove", function () {
                  clearTimeout(timer);
                });
              });
            dateList
              .querySelectorAll('.delete-btn[data-type="date"]')
              .forEach((btn) => {
                btn.addEventListener("click", function (e) {
                  e.stopPropagation();
                  const idx = parseInt(this.dataset.idx);
                  appData.dates.splice(idx, 1);
                  saveData();
                  renderAll();
                });
              });
          }
          const total = d.length;
          dateCountLabel.textContent = `${total} 条`;
          totalDates.textContent = total;
          const places = new Set(
            d.filter((x) => x.place).map((x) => x.place.trim()),
          );
          uniqueDateLocations.textContent = places.size;
        }

        function addDate(date, place) {
          if (!date) {
            alert("请选择日期");
            return false;
          }
          place = (place || "").trim();
          if (
            appData.dates.some(
              (x) => x.date === date && (x.place || "") === place,
            )
          ) {
            alert("该日期已存在");
            return false;
          }
          appData.dates.push({ date, place });
          saveData();
          renderAll();
          return true;
        }

        // ===== 旅行 =====
        function renderTrips() {
          const d = appData.trips;
          if (!d || d.length === 0) {
            tripList.innerHTML = `<div class="empty-message">还没有地点</div>`;
          } else {
            const order = tripSortOrder.value;
            let sorted = [...d];
            if (order === "desc")
              sorted.sort((a, b) => (a.date < b.date ? 1 : -1));
            else if (order === "asc")
              sorted.sort((a, b) => (a.date > b.date ? 1 : -1));
            else if (order === "name")
              sorted.sort((a, b) => a.name.localeCompare(b.name));

            let html = "";
            sorted.forEach((item, idx) => {
              html += `<div class="list-item" data-idx="${idx}" data-type="trip"><span>📍 ${item.name} · ${formatDateDisplay(item.date)}</span>
                    <button class="delete-btn" data-idx="${idx}" data-type="trip">✕</button></div>`;
            });
            tripList.innerHTML = html;
            tripList
              .querySelectorAll('.list-item[data-type="trip"]')
              .forEach((el) => {
                el.addEventListener("dblclick", function () {
                  const idx = parseInt(this.dataset.idx);
                  const item = appData.trips[idx];
                  if (!item) return;
                  const newName = prompt("修改地点名称:", item.name);
                  if (newName === null) return;
                  const newDate = prompt("修改日期 (YYYY-MM-DD):", item.date);
                  if (newDate === null) return;
                  if (newName.trim()) item.name = newName.trim();
                  if (newDate) item.date = newDate;
                  saveData();
                  renderAll();
                });
                let timer = null;
                el.addEventListener("touchstart", function (e) {
                  timer = setTimeout(() => {
                    const idx = parseInt(this.dataset.idx);
                    const item = appData.trips[idx];
                    if (!item) return;
                    const newName = prompt("修改地点名称:", item.name);
                    if (newName === null) return;
                    const newDate = prompt("修改日期 (YYYY-MM-DD):", item.date);
                    if (newDate === null) return;
                    if (newName.trim()) item.name = newName.trim();
                    if (newDate) item.date = newDate;
                    saveData();
                    renderAll();
                  }, 600);
                });
                el.addEventListener("touchend", function () {
                  clearTimeout(timer);
                });
                el.addEventListener("touchmove", function () {
                  clearTimeout(timer);
                });
              });
            tripList
              .querySelectorAll('.delete-btn[data-type="trip"]')
              .forEach((btn) => {
                btn.addEventListener("click", function (e) {
                  e.stopPropagation();
                  const idx = parseInt(this.dataset.idx);
                  appData.trips.splice(idx, 1);
                  saveData();
                  renderAll();
                });
              });
          }
          const total = d.length;
          tripCountLabel.textContent = `${total} 条`;
          totalTrips.textContent = total;
          const cities = new Set(d.map((x) => x.name.trim()));
          uniqueTrips.textContent = cities.size;
        }

        function addTrip(name, date) {
          name = name.trim();
          if (!name) {
            alert("请输入地点名称");
            return false;
          }
          if (!date) {
            alert("请选择日期");
            return false;
          }
          if (appData.trips.some((x) => x.name === name && x.date === date)) {
            alert("该地点已在当天记录");
            return false;
          }
          appData.trips.push({ name, date });
          saveData();
          renderAll();
          return true;
        }

        // ===== Love =====
        function renderAnniversaries() {
          const list = appData.love.anniversaries || [];
          if (list.length === 0) {
            anniversaryContainer.innerHTML = `<div style="font-size:13px; color:#dbb0a8; padding:4px 0;">暂无纪念日</div>`;
            return;
          }
          let html = "";
          list.forEach((item, idx) => {
            const days = calcDaysFrom(item.date);
            html += `
                <div class="anniversary-card">
                    <div class="info">
                        <div class="date">${formatDateDisplay(item.date)}</div>
                        <div class="event">${item.event || "纪念日"}</div>
                        <div class="days">${days}</div>
                    </div>
                    <button class="del" data-idx="${idx}">✕</button>
                </div>
            `;
          });
          anniversaryContainer.innerHTML = html;
          anniversaryContainer.querySelectorAll(".del").forEach((btn) => {
            btn.addEventListener("click", function () {
              const idx = parseInt(this.dataset.idx);
              appData.love.anniversaries.splice(idx, 1);
              saveData();
              renderAll();
            });
          });
        }

        function updateNameCard() {
          const my = appData.love.myName.trim();
          const her = appData.love.herName.trim();
          if (my && her) {
            nameCard.style.display = "block";
            displayMyName.textContent = my;
            displayHerName.textContent = her;
            myNameField.classList.add("hidden");
            herNameField.classList.add("hidden");
          } else {
            nameCard.style.display = "none";
            myNameField.classList.remove("hidden");
            herNameField.classList.remove("hidden");
          }
        }

        function loadLoveData() {
          const l = appData.love;
          loveMyName.value = l.myName || "";
          loveHerName.value = l.herName || "";
          loveStartDate.value = l.startDate || "";
          renderAnniversaries();
          updateNameCard();
          newAnniversaryDate.value = getTodayStr();
          newAnniversaryEvent.value = "";
        }

        function saveLove() {
          appData.love.myName = loveMyName.value.trim();
          appData.love.herName = loveHerName.value.trim();
          appData.love.startDate = loveStartDate.value;
          saveData();
          renderAll();
          alert("💕 恋爱档案已保存");
        }

        function addAnniversary() {
          const date = newAnniversaryDate.value;
          const event = newAnniversaryEvent.value.trim();
          if (!date) {
            alert("请选择日期");
            return;
          }
          if (!event) {
            alert("请填写纪念日事件");
            return;
          }
          if (!appData.love.anniversaries) appData.love.anniversaries = [];
          appData.love.anniversaries.push({ date, event });
          saveData();
          renderAll();
          newAnniversaryDate.value = getTodayStr();
          newAnniversaryEvent.value = "";
        }

        // ===== 总览 =====
        function renderOverview() {
          ovTotalDates.textContent = appData.dates.length;
          ovTotalTrips.textContent = appData.trips.length;
          const cities = new Set(appData.trips.map((x) => x.name.trim()));
          ovTotalCities.textContent = cities.size;
          ovLoveDays.textContent = calcLoveDays(appData.love.startDate);
        }

        // ===== 全部渲染 =====
        function renderAll() {
          const active = document.querySelector(".tab-content.active");
          if (active) {
            const id = active.id;
            if (id === "tab-date") renderDates();
            else if (id === "tab-trip") renderTrips();
            else if (id === "tab-love") loadLoveData();
            else if (id === "tab-overview") renderOverview();
          }
          renderOverview();
        }

        // ===== Tab切换 =====
        function switchTab(tabId) {
          document
            .querySelectorAll(".tab-content")
            .forEach((el) => el.classList.remove("active"));
          const target = document.getElementById(tabId);
          if (target) target.classList.add("active");

          tabBtns.forEach((btn) => {
            btn.classList.remove("active");
            if (btn.dataset.tab === tabId) btn.classList.add("active");
          });

          if (tabId === "tab-date") renderDates();
          else if (tabId === "tab-trip") renderTrips();
          else if (tabId === "tab-love") loadLoveData();
          else if (tabId === "tab-overview") renderOverview();
        }

        // ===== 事件绑定 =====
        tabBtns.forEach((btn) => {
          btn.addEventListener("click", function () {
            switchTab(this.dataset.tab);
          });
        });

        addDateBtn.addEventListener("click", function () {
          if (addDate(newDateInput.value, newDatePlace.value)) {
            newDateInput.value = "";
            newDatePlace.value = "";
          }
        });
        quickDateBtn.addEventListener("click", function () {
          if (addDate(getTodayStr(), newDatePlace.value)) {
            newDateInput.value = "";
            newDatePlace.value = "";
          }
        });
        newDateInput.value = getTodayStr();

        addTripBtn.addEventListener("click", function () {
          if (addTrip(newTripPlace.value, newTripDate.value)) {
            newTripPlace.value = "";
            newTripDate.value = "";
          }
        });
        newTripDate.value = getTodayStr();
        tripSortOrder.addEventListener("change", renderTrips);

        saveLoveBtn.addEventListener("click", saveLove);
        addAnniversaryBtn.addEventListener("click", addAnniversary);

        document.querySelectorAll(".overview-item").forEach((el) => {
          el.addEventListener("click", function () {
            const tabId = this.dataset.tab;
            if (tabId) switchTab(tabId);
          });
        });

        // ===== 启动 =====
        switchTab("tab-date");
        console.log("❤️ Love 轨迹 v15", appData);
      })();
    </script>
  </body>
</html>
