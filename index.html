<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Love·轨迹</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      /* ========== 样式 ========== */
      :root {
        --primary: #ff6b8a;
        --primary-light: #ff8aa8;
        --primary-dark: #e55a7a;
        --bg: #f8f8fc;
        --card-bg: #ffffff;
        --text: #1c1c1e;
        --text-secondary: #000000;
        --border: #e5e5ea;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        --radius: 8px;
        --nav-height: 60px;
        --tab-height: 64px;
        --safe-bottom: 20px;
        --font:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          Arial, sans-serif;
        --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      input,
      select,
      textarea,
      button {
        font-family: inherit;
        font-size: inherit;
        outline: none;
        border: none;
      }
      button {
        cursor: pointer;
        background: none;
        touch-action: manipulation;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      img,
      video {
        display: block;
        max-width: 100%;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 430px;
        margin: 0 auto;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
      }

      /* ===== 导航栏全新布局 ===== */
      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        height: var(--nav-height);
        background: var(--primary) !important;
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
        position: relative;
        z-index: 20;
      }
      .navbar-brand {
        display: flex;
        align-items: baseline;
        gap: 4px;
        flex-shrink: 0;
      }
      .navbar-brand .brand-text {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #fff !important;
      }
      .navbar-brand .brand-text .heart {
        color: #fff;
      }
      .navbar-brand .version {
        font-size: 11px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.7) !important;
        white-space: nowrap;
      }
      .navbar-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
      }
      .navbar-actions button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background var(--transition),
          transform 0.15s;
        background: rgba(255, 255, 255, 0.2) !important;
        color: #fff !important;
        position: relative;
      }
      .navbar-actions button:active {
        background: rgba(255, 255, 255, 0.35) !important;
        transform: scale(0.92);
      }
      .navbar-actions .back-btn {
        font-size: 22px;
        display: none;
      }
      .navbar-actions .back-btn.show {
        display: flex;
      }
      /* 更多菜单下拉 */
      .more-menu-wrap {
        position: relative;
      }
      .more-dropdown {
        position: absolute;
        top: 46px;
        right: 0;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        padding: 6px 0;
        min-width: 140px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-6px) scale(0.96);
        transition: all 0.2s ease;
        z-index: 30;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.96);
        border: 0.5px solid var(--border);
      }
      .more-dropdown.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .more-dropdown .menu-item {
        padding: 10px 18px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.15s;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        color: var(--text);
        font-weight: 500;
      }
      .more-dropdown .menu-item:active {
        background: rgba(0, 0, 0, 0.06);
      }
      .more-dropdown .menu-item .icon {
        font-size: 18px;
      }

      .main-content {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .page-container {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px 16px 80px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        transform: translateY(6px);
        -webkit-overflow-scrolling: touch;
      }
      .page-container.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      .page-container::-webkit-scrollbar {
        width: 0;
      }

      /* ===== 日历独立页面 ===== */
      #pageCalendar {
        padding: 12px 16px 80px;
      }
      #pageCalendar .cal-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-top: 4px;
      }
      #pageCalendar .cal-header-row .cal-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
      }
      #pageCalendar .cal-header-row .cal-nav-group {
        display: flex;
        gap: 6px;
      }
      #pageCalendar .cal-header-row .cal-nav-group button {
        padding: 6px 16px;
        border-radius: var(--radius);
        background: var(--card-bg);
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        transition: all var(--transition);
      }
      #pageCalendar .cal-header-row .cal-nav-group button:active {
        background: var(--primary);
        color: #fff;
      }
      #pageCalendar .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin: 6px 0 12px;
      }
      #pageCalendar .cal-grid .cal-weekday {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-align: center;
        padding: 6px 0 4px;
      }
      #pageCalendar .cal-grid .cal-day {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        font-size: 15px;
        font-weight: 500;
        background: var(--bg);
        color: var(--text);
        transition: all var(--transition);
        cursor: pointer;
        border: 1.5px solid transparent;
        min-height: 44px;
        position: relative;
      }
      #pageCalendar .cal-grid .cal-day:active {
        transform: scale(0.92);
        background: var(--primary-light);
      }
      #pageCalendar .cal-grid .cal-day.empty {
        background: transparent;
        cursor: default;
      }
      #pageCalendar .cal-grid .cal-day.today {
        border-color: var(--primary);
        background: rgba(255, 107, 138, 0.08);
      }
      #pageCalendar .cal-grid .cal-day .dot {
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary);
      }
      #pageCalendar .cal-grid .cal-day .day-num {
        font-size: 15px;
        font-weight: 500;
      }
      #pageCalendar .cal-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 12px;
        color: var(--text-secondary);
        margin: 4px 0 12px;
      }
      #pageCalendar .cal-legend .lg-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #pageCalendar .cal-legend .lg-color {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 0.5px solid var(--border);
      }
      #pageCalendar .cal-quick-add {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
        margin-top: 6px;
      }
      #pageCalendar .cal-quick-add .qa-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      #pageCalendar .cal-quick-add .qa-types {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #pageCalendar .cal-quick-add .qa-types .qa-btn {
        padding: 6px 14px;
        border-radius: 20px;
        background: var(--bg);
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        transition: all var(--transition);
        cursor: pointer;
      }
      #pageCalendar .cal-quick-add .qa-types .qa-btn:active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        transform: scale(0.94);
      }
      #pageCalendar .cal-quick-add .qa-types .qa-btn .emoji {
        margin-right: 4px;
      }

      .tab-bar {
        display: flex;
        align-items: stretch;
        height: var(--tab-height);
        background: var(--card-bg);
        border-top: 0.5px solid var(--border);
        flex-shrink: 0;
        padding-bottom: var(--safe-bottom);
        position: relative;
        z-index: 20;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.92);
      }
      .tab-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        font-size: 10px;
        color: var(--text-secondary);
        transition:
          color var(--transition),
          transform 0.15s;
        border: none;
        background: none;
        padding: 4px 0;
        position: relative;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .tab-item .tab-emoji {
        font-size: 22px;
        line-height: 1.2;
        transition: transform 0.2s;
      }
      .tab-item .tab-label {
        font-size: 10px;
        font-weight: 500;
        transition: font-weight 0.2s;
      }
      .tab-item.active {
        color: var(--primary);
      }
      .tab-item.active .tab-emoji {
        transform: scale(1.08);
      }
      .tab-item.active .tab-label {
        font-weight: 600;
      }
      .tab-item:active {
        transform: scale(0.94);
      }

      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px 14px;
        margin-bottom: 8px;
        transition: box-shadow var(--transition);
      }
      .card-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.2px;
      }
      .card-value {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
        margin-top: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row .card {
        flex: 1;
        height: 76px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 8px 12px;
      }
      .row .card .card-title {
        margin-bottom: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .row .card .card-value {
        margin-top: 0;
        font-size: 20px;
        line-height: 1.2;
        color: var(--text);
      }

      .section-block {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        margin: 0 -4px 4px -4px;
        padding: 0 4px 4px 4px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: box-shadow 0.2s;
      }
      .section-block:last-child {
        margin-bottom: 0;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        font-size: 16px;
        color: var(--text);
        padding: 12px 0 8px;
        border-bottom: 0.5px solid var(--border);
        background: var(--bg);
        background: rgba(248, 248, 252, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .section-header .action-btn {
        font-size: 14px;
        color: var(--primary);
        font-weight: 500;
        background: none;
        border: none;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .section-header .action-btn:active {
        background: rgba(0, 0, 0, 0.06);
      }
      .section-block .card {
        margin-bottom: 8px;
      }
      .section-block .card:last-child {
        margin-bottom: 0;
      }

      .achievement-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 6px 0;
      }
      .achievement-grid .ach-item {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 10px 12px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        transition: all var(--transition);
        cursor: pointer;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 64px;
      }
      .achievement-grid .ach-item:active {
        transform: scale(0.95);
      }
      .achievement-grid .ach-item.unlocked {
        border-color: var(--primary);
        background: linear-gradient(
          135deg,
          rgba(255, 107, 138, 0.06),
          rgba(255, 107, 138, 0.02)
        );
      }
      .achievement-grid .ach-item .ach-emoji {
        font-size: 24px;
      }
      .achievement-grid .ach-item .ach-name {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        margin-top: 2px;
        line-height: 1.2;
      }
      .achievement-grid .ach-item .ach-date {
        font-size: 10px;
        color: var(--text-secondary);
        margin-top: 1px;
      }

      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 2px 12px 2px 16px;
        box-shadow: var(--shadow);
        transition: box-shadow var(--transition);
      }
      .search-bar:focus-within {
        box-shadow:
          0 0 0 2px var(--primary),
          var(--shadow);
      }
      .search-bar input {
        flex: 1;
        height: 40px;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        padding: 0;
      }
      .search-bar input::placeholder {
        color: var(--text-secondary);
        opacity: 0.6;
      }
      .search-bar button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--text-secondary);
        transition: background var(--transition);
      }
      .search-bar button:active {
        background: rgba(0, 0, 0, 0.06);
      }

      .record-item {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 10px;
        overflow: hidden;
        transition: box-shadow var(--transition);
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        padding: 4px;
      }
      .record-item:active {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      .record-sticky-header {
        padding: 8px 14px 4px;
        border-bottom: 0.5px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        background: var(--card-bg);
      }
      .record-sticky-header .date-range {
        font-weight: 600;
        color: var(--text);
      }
      .record-sticky-header .delete-btn {
        font-size: 17px;
        color: var(--text-secondary);
        padding: 2px 6px;
        border-radius: 6px;
        transition:
          background var(--transition),
          color var(--transition);
        background: transparent;
        line-height: 1;
      }
      .record-sticky-header .delete-btn:active {
        background: rgba(255, 59, 48, 0.12);
        color: #ff3b30;
      }
      .record-body {
        padding: 8px 14px 10px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .record-body .info {
        flex: 1;
        min-width: 0;
      }
      /* 天气标签和地点间距增大 */
      .record-body .info .location {
        font-size: 14px;
        color: var(--text-secondary);
        margin: 2px 0 10px 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 12px;
      }
      .record-body .info .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .record-body .info .tags span {
        background: var(--bg);
        padding: 0 8px;
        border-radius: 12px;
        font-size: 12px;
        line-height: 22px;
      }
      .record-body .media-thumb {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: opacity 0.2s;
        object-fit: cover;
      }
      .record-body .media-thumb img,
      .record-body .media-thumb video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .record-body .media-thumb:active {
        opacity: 0.7;
      }
      .record-footer {
        padding: 4px 14px 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .record-footer .action-btn {
        font-size: 13px;
        padding: 4px 14px;
        border-radius: 20px;
        background: var(--bg);
        color: var(--text-secondary);
        transition: all var(--transition);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .record-footer .action-btn:active {
        background: var(--primary);
        color: #fff;
        transform: scale(0.96);
      }
      .record-note {
        padding: 3px 14px 6px;
        font-size: 13px;
        color: var(--text-secondary);
        border-top: 0.5px solid var(--border);
        margin: 0 14px 4px;
        cursor: pointer;
      }
      .record-note .note-content {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.3s ease;
      }
      .record-note .note-content.expanded {
        max-height: 300px;
      }
      .record-note .note-toggle {
        color: var(--primary);
        font-weight: 500;
        font-size: 13px;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 8px 0 4px;
      }
      .pagination button {
        padding: 4px 14px;
        border-radius: var(--radius);
        background: var(--card-bg);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        box-shadow: var(--shadow);
        transition: all var(--transition);
        border: 0.5px solid var(--border);
        min-width: 44px;
      }
      .pagination button:active {
        transform: scale(0.94);
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .pagination button:disabled {
        opacity: 0.3;
        pointer-events: none;
      }
      .pagination .page-info {
        font-size: 13px;
        color: var(--text-secondary);
        padding: 0 6px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-box {
        background: var(--card-bg);
        border-radius: var(--radius);
        max-width: 400px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 16px 18px 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        transform: scale(0.95) translateY(10px);
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
        opacity: 0;
      }
      .modal-overlay.show .modal-box {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
      .modal-box .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .modal-box .modal-header h3 {
        font-size: 18px;
        font-weight: 600;
      }
      .modal-box .modal-header .close-btn {
        font-size: 22px;
        color: var(--text-secondary);
        padding: 4px 8px;
        border-radius: 50%;
        transition: background var(--transition);
        background: transparent;
        line-height: 1;
      }

    <script>
      // ================================================================
      // DATA LAYER (保持不变)
      // ================================================================
      const DB_NAME = "LoveTrajectDB";
      const DB_VERSION = 6;
      const STORES = [
        "happy",
        "travel",
        "menstrual",
        "memorial",
        "fight",
        "loveInfo",
        "breakups",
      ];

      let db = null;
      let dbReady = false;
      let memoryStore = {
        happy: [],
        travel: [],
        menstrual: [],
        memorial: [],
        fight: [],
        loveInfo: [],
        breakups: [],
      };
      let useMemory = false;

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            STORES.forEach((s) => {
              if (!d.objectStoreNames.contains(s)) {
                d.createObjectStore(s, { keyPath: "id", autoIncrement: true });
              }
            });
          };
          req.onsuccess = (e) => {
            db = e.target.result;
            dbReady = true;
            useMemory = false;
            resolve(db);
          };
          req.onerror = (e) => {
            console.warn("IndexedDB 打开失败，使用内存存储", e.target.error);
            useMemory = true;
            resolve(null);
          };
        });
      }

      function dbAdd(store, data) {
        if (useMemory) {
          data.id = Date.now() + Math.random() * 1000;
          if (!memoryStore[store]) memoryStore[store] = [];
          memoryStore[store].push(data);
          return Promise.resolve(data.id);
        }
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).add(data);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function dbPut(store, data) {
        if (useMemory) {
          const idx = (memoryStore[store] || []).findIndex(
            (item) => item.id === data.id,
          );
          if (idx > -1) memoryStore[store][idx] = data;
          return Promise.resolve(data.id);
        }
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).put(data);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function dbDelete(store, id) {
        if (useMemory) {
          if (memoryStore[store])
            memoryStore[store] = memoryStore[store].filter(
              (item) => item.id !== id,
            );
          return Promise.resolve();
        }
        return new Promise((resolve, reject) => {
          const tx = db.transaction(store, "readwrite");
          const req = tx.objectStore(store).delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      function dbGetAll(store) {
        if (useMemory) return Promise.resolve([...(memoryStore[store] || [])]);
        return new Promise((resolve, reject) => {
          if (!db.objectStoreNames.contains(store)) {
            resolve([]);
            return;
          }
          const tx = db.transaction(store, "readonly");
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function dbGet(store, id) {
        if (useMemory) {
          const item = (memoryStore[store] || []).find(
            (item) => item.id === id,
          );
          return Promise.resolve(item || null);
        }
        return new Promise((resolve, reject) => {
          if (!db.objectStoreNames.contains(store)) {
            resolve(null);
            return;
          }
          const tx = db.transaction(store, "readonly");
          const req = tx.objectStore(store).get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      // ================================================================
      // UTILITY
      // ================================================================
      function formatDate(d) {
        if (!d) return "";
        const dt = typeof d === "string" ? new Date(d) : d;
        if (isNaN(dt)) return "";
        return `${dt.getFullYear()}年${String(dt.getMonth() + 1).padStart(2, "0")}月${String(dt.getDate()).padStart(2, "0")}日`;
      }

      function dateToStr(d) {
        if (!d) return "";
        const dt = typeof d === "string" ? new Date(d) : d;
        if (isNaN(dt)) return "";
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      }

      function daysBetween(a, b) {
        const da = new Date(a);
        const db = new Date(b);
        da.setHours(0, 0, 0, 0);
        db.setHours(0, 0, 0, 0);
        return Math.floor((db - da) / 86400000);
      }

      function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
      }

      function getMonthDays(year, month) {
        return new Date(year, month, 0).getDate();
      }

      function getTodayStr() {
        return dateToStr(new Date());
      }

      let toastTimer = null;

      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
      }

      function openModal(title, html, onClose) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = html;
        document.getElementById("modalOverlay").classList.add("show");
        const closeFn = () => {
          document.getElementById("modalOverlay").classList.remove("show");
          if (onClose) onClose();
        };
        document.getElementById("modalClose").onclick = closeFn;
        document.getElementById("modalOverlay").onclick = (e) => {
          if (e.target === e.currentTarget) closeFn();
        };
        return closeFn;
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("show");
      }

      // ================================================================
      // NOTIFICATION & REMINDERS (保持不变)
      // ================================================================
      let notificationPermission = false;

      function requestNotificationPermission() {
        if (!("Notification" in window)) return;
        if (Notification.permission === "granted") {
          notificationPermission = true;
          return;
        }
        if (Notification.permission === "denied") return;
        Notification.requestPermission().then((perm) => {
          notificationPermission = perm === "granted";
          if (notificationPermission) showToast("🔔 通知已授权");
        });
      }

      function sendNotification(title, body) {
        if (!notificationPermission) return;
        try {
          new Notification(title, { body, icon: "❤️" });
        } catch (e) {
          console.warn("通知发送失败", e);
        }
      }

      let lastReminderCheck = 0;

      function checkSmartReminders() {
        const now = Date.now();
        if (now - lastReminderCheck < 30000) return;
        lastReminderCheck = now;
        dbGetAll("loveInfo").then((infoArr) => {
          const info = infoArr.length > 0 ? infoArr[0] : null;
          if (!info || !info.startDate) return;
          const start = new Date(info.startDate);
          const today = new Date();
          const days = daysBetween(start, today);
          const milestones = [1, 7, 30, 50, 100, 200, 365, 500, 1000];
          milestones.forEach((m) => {
            if (days === m) {
              sendNotification(
                `💕 在一起 ${m} 天啦！`,
                `今天是你们相爱的第 ${m} 天，继续甜蜜下去吧！`,
              );
            }
          });
          dbGetAll("memorial").then((memorials) => {
            memorials.forEach((m) => {
              const mDate = new Date(m.date);
              const diff = daysBetween(today, mDate);
              if (diff === 3)
                sendNotification(
                  `🎉 纪念日提醒`,
                  `${m.content || "纪念日"} 还有3天就到了！`,
                );
              if (diff === 0)
                sendNotification(
                  `🎉 今天是个特别的日子！`,
                  `${m.content || "纪念日"} 快乐！`,
                );
            });
          });
          dbGetAll("menstrual").then((menstrual) => {
            if (menstrual.length > 0) {
              const sorted = [...menstrual].sort(
                (a, b) => new Date(b.startDate) - new Date(a.startDate),
              );
              const last = sorted[0];
              if (last) {
                let cycles = [];
                for (let i = 1; i < sorted.length; i++) {
                  const prev = new Date(sorted[i - 1].startDate);
                  const curr = new Date(sorted[i].startDate);
                  const diff = daysBetween(prev, curr);
                  if (diff > 0) cycles.push(diff);
                }
                const avgCycle =
                  cycles.length > 0
                    ? Math.round(
                        cycles.reduce((a, b) => a + b, 0) / cycles.length,
                      )
                    : 28;
                const lastStart = new Date(last.startDate);
                const nextStart = addDays(lastStart, avgCycle);
                const ovulation = addDays(nextStart, -14);
                const diffOvu = daysBetween(today, ovulation);
                if (diffOvu === 0)
                  sendNotification(
                    "🌸 排卵期提醒",
                    "今天是排卵日，注意身体变化哦 💕",
                  );
                if (diffOvu === -3 || diffOvu === -2 || diffOvu === -1) {
                  sendNotification(
                    "🌸 易孕期提醒",
                    "未来几天是易孕期，请留意身体感受 ✨",
                  );
                }
              }
            }
          });
        });
      }

      function applyTheme(color) {
        const c = color || currentTheme;

        document.documentElement.style.setProperty("--primary-light", c + "cc");

          html += `<div class="theme-swatch ${active}" style="background:${c};" data-color="${c}"></div>`;

        html += `<div class="theme-swatch" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border-color:#888;">

            .querySelectorAll(".theme-swatch[data-color]")

                const color = el.dataset.color;

                document
                  .querySelectorAll(".theme-swatch")
                  .forEach((s) => s.classList.remove("active"));
                el.classList.add("active");
                showToast("主题已切换");
                closeModal();
              };
            });
          const customInput = document.getElementById("customThemeColor");
          if (customInput) {
            customInput.oninput = (e) => {
              const color = e.target.value;
              applyTheme(color);
              document
                .querySelectorAll(".theme-swatch")
                .forEach((s) => s.classList.remove("active"));
              const parent = e.target.closest(".theme-swatch");
              if (parent) parent.classList.add("active");
              showToast("主题已更新");
              closeModal();
            };
          }
        }, 50);
      }

      // ================================================================
      // 长按菜单 & 分享 (保持不变)
      // ================================================================
      let contextTarget = null;

      function showContextMenu(e, type, id, store) {
        e.preventDefault();
        e.stopPropagation();
        const menu = document.getElementById("contextMenu");
        contextTarget = { type, id, store };
        menu.classList.add("show");
        let x = e.clientX || e.touches?.[0]?.clientX || 0;
        let y = e.clientY || e.touches?.[0]?.clientY || 0;
        const w = 150,
          h = 120;
        if (x + w > window.innerWidth) x = window.innerWidth - w - 10;
        if (y + h > window.innerHeight) y = window.innerHeight - h - 10;
        if (x < 10) x = 10;
        if (y < 10) y = 10;
        menu.style.left = x + "px";
        menu.style.top = y + "px";
        menu.querySelectorAll(".menu-item").forEach((btn) => {
          btn.onclick = () => {
            const action = btn.dataset.action;
            menu.classList.remove("show");
            if (action === "edit") {
              if (store === "happy") editHappy(id);
              else if (store === "travel") editTravel(id);
              else if (store === "menstrual") editMenstrual(id);
              else if (store === "memorial") editMemorial(id);
              else if (store === "fight") editFight(id);
              else if (store === "breakups") editBreakup(id);
            } else if (action === "delete") {
              if (store === "happy") deleteHappy(id);
              else if (store === "travel") deleteTravel(id);
              else if (store === "menstrual") deleteMenstrual(id);
              else if (store === "memorial") deleteMemorial(id);
              else if (store === "fight") deleteFight(id);
              else if (store === "breakups") deleteBreakup(id);
            } else if (action === "share") {
              shareRecordCard(store, id);
            }
          };
        });
      }

      document.addEventListener("click", () => {
        document.getElementById("contextMenu").classList.remove("show");
      });
      document.addEventListener("touchstart", (e) => {
        if (!e.target.closest(".context-menu"))
          document.getElementById("contextMenu").classList.remove("show");
      });

      let longPressTimer = null;

      function handleTouchStart(e, type, id, store) {
        longPressTimer = setTimeout(() => {
          showContextMenu(e, type, id, store);
        }, 600);
      }
      document.addEventListener("touchmove", () => {
        clearTimeout(longPressTimer);
      });
      document.addEventListener("touchend", () => {
        clearTimeout(longPressTimer);
      });

      function shareRecordCard(store, id) {
        dbGet(store, id).then((record) => {
          if (!record) {
            showToast("记录不存在");
            return;
          }
          const date = formatDate(
            record.startDate || record.date || record.breakupDate,
          );
          const loc = record.location || "";
          const type = record.type || record.transport || record.content || "";
          const mood = record.mood || "";
          const weather = record.weather || "";
          const note = record.note || "";
          const storeName =
            {
              happy: "快乐",
              travel: "旅行",
              menstrual: "月经",
              memorial: "纪念日",
              fight: "吵架/和好",
              breakups: "分手",
            }[store] || "记录";

          const cardDiv = document.createElement("div");
          cardDiv.style.cssText = `background:white;border-radius:16px;padding:20px 18px;max-width:340px;width:340px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.1);`;
          cardDiv.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:18px;font-weight:700;color:#ff6b8a;">❤️ Love·轨迹</span>
            <span style="font-size:13px;color:#6c6c70;">${storeName}</span>
          </div>
          <div style="font-size:15px;font-weight:600;margin-bottom:3px;">${date}</div>
          ${loc ? `<div style="font-size:13px;color:#6c6c70;margin-bottom:3px;">📍 ${loc}</div>` : ""}
          ${type ? `<div style="font-size:14px;margin-bottom:3px;">🏷️ ${type}</div>` : ""}

          ${weather ? `<div style="font-size:13px;color:#6c6c70;">🌤️ ${weather}</div>` : ""}
          ${note ? `<div style="margin-top:6px;padding:8px;background:#f8f8fc;border-radius:6px;font-size:13px;color:#1c1c1e;">📝 ${note}</div>` : ""}
          <div style="margin-top:10px;font-size:11px;color:#6c6c70;text-align:center;border-top:0.5px solid #e5e5ea;padding-top:8px;">💕 记录于 ${new Date().toLocaleDateString()}</div>
        `;
          document.body.appendChild(cardDiv);
          html2canvas(cardDiv, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff",
          })
            .then((canvas) => {
              document.body.removeChild(cardDiv);
              const imgData = canvas.toDataURL("image/png");
              if (navigator.share) {
                canvas.toBlob((blob) => {
                  const file = new File([blob], "love-card.png", {
                    type: "image/png",
                  });
                  navigator
                    .share({ title: "Love·轨迹 卡片", files: [file] })
                    .catch(() => {
                      downloadImage(imgData);
                    });
                });
              } else {
                downloadImage(imgData);
              }
            })
            .catch(() => {
              document.body.removeChild(cardDiv);
              showToast("生成卡片失败，请重试");
            });
        });
      }

      // ================================================================
      // HAPPY 模块 (完整实现)
      // ================================================================
      let happyPage = 1;
      const PAGE_SIZE = 5;

      function renderHappy(searchTerm = "") {
        const container = document.getElementById("pageHappy");
        dbGetAll("happy").then((all) => {
          try {
            let list = all.sort(
              (a, b) => new Date(b.startDate) - new Date(a.startDate),
            );
            if (searchTerm) {
              const s = searchTerm.toLowerCase();
              list = list.filter(
                (r) =>
                  (r.type || "").toLowerCase().includes(s) ||
                  (r.location || "").toLowerCase().includes(s) ||
                  (r.mood || "").toLowerCase().includes(s) ||
                  (r.weather || "").toLowerCase().includes(s) ||
                  (r.note || "").toLowerCase().includes(s) ||
                  formatDate(r.startDate).includes(s),
              );
            }
            const total = list.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (happyPage > totalPages) happyPage = totalPages;
            const start = (happyPage - 1) * PAGE_SIZE;
            const pageData = list.slice(start, start + PAGE_SIZE);

            const totalHappy = all.length;
            const lastHappy =
              all.length > 0
                ? formatDate(
                    all.sort(
                      (a, b) => new Date(b.startDate) - new Date(a.startDate),
                    )[0].startDate,
                  )
                : "暂无";

            let html = `
            <div class="search-bar">
              <input type="text" id="happySearch" placeholder="搜索快乐记录..." value="${searchTerm || ""}">
              <button onclick="doHappySearch()">🔍</button>
            </div>
            <div class="row">
              <div class="card"><div class="card-title">😄 总快乐数</div><div class="card-value" style="color:var(--primary);">${totalHappy}</div></div>
              <div class="card"><div class="card-title">🕐 最近一次</div><div class="card-value" style="font-size:18px;color:var(--primary);">${lastHappy}</div></div>
            </div>
          `;

            if (pageData.length === 0) {
              html += `<div class="empty-state"><span class="emoji-big">😊</span>还没有快乐记录<br>点击下方「再一次快乐」添加</div>`;
            } else {
              pageData.forEach((r) => {
                let dateRange = formatDate(r.startDate);
                if (r.duration && r.duration > 1 && r.endDate)
                  dateRange += ` ~ ${formatDate(r.endDate)}`;
                const loc = r.location || "";
                const typeTag = r.type || "快乐";
                const moodTag = r.mood || "开心";
                const weatherTag = r.weather || "";
                let mediaHtml = `<div class="media-thumb">📷</div>`;
                if (r.media) {
                  if (r.media.startsWith("data:video")) {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')">🎬</div>`;
                  } else if (r.media.startsWith("data:image")) {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')"><img src="${r.media}" alt="缩略图"></div>`;
                  } else {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')">🖼️</div>`;
                  }
                }
                let noteHtml = "";
                if (r.note) {
                  const noteId = `note_${r.id}`;
                  noteHtml = `
                  <div class="record-note" onclick="event.stopPropagation();toggleNote('${noteId}')">
                    <span class="note-toggle">📝 备注</span>
                    <div class="note-content" id="${noteId}">${r.note}</div>
                  </div>
                `;
                }
                html += `
                <div class="record-item" onclick="editHappy(${r.id})" oncontextmenu="event.preventDefault();showContextMenu(event,'happy',${r.id},'happy')" ontouchstart="handleTouchStart(event,'happy',${r.id},'happy')">
                  <div class="record-sticky-header">
                    <span class="date-range">${dateRange}</span>
                    <button class="delete-btn" onclick="event.stopPropagation();deleteHappy(${r.id})">❌</button>
                  </div>
                  <div class="record-body">
                    <div class="info">
                      <div class="location"><span>📍 ${loc || "未设置地点"}</span>${weatherTag ? `<span>🌤️ ${weatherTag}</span>` : ""}</div>
                      <div class="tags">
                        <span>${typeTag}</span>
                        <span>${moodTag}</span>
                      </div>
                    </div>
                    ${mediaHtml}
                  </div>
                  <div class="record-footer">
                    <span class="action-btn">📅 ${formatDate(r.startDate)}</span>
                  </div>
                  ${noteHtml}
                </div>
              `;
              });
            }

            html += `<div class="pagination">
            <button onclick="happyGoPage(${happyPage - 1})" ${happyPage <= 1 ? "disabled" : ""}>‹</button>
            <span class="page-info">${happyPage} / ${totalPages}</span>
            <button onclick="happyGoPage(${happyPage + 1})" ${happyPage >= totalPages ? "disabled" : ""}>›</button>
          </div>`;
            html += `<button class="action-btn" style="width:100%;padding:10px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;border-radius:var(--radius);margin-top:4px;" onclick="addHappy()">😊 再一次快乐</button>`;

            container.innerHTML = html;
          } catch (e) {
            console.error("renderHappy error:", e);
            container.innerHTML = `<div class="empty-state"><span class="emoji-big">⚠️</span>加载数据失败，请刷新重试</div>`;
          }
        });
      }

      let travelPage = 1;

      function renderTravel(searchTerm = "") {
        const container = document.getElementById("pageTravel");
        dbGetAll("travel").then((all) => {
          try {
            let list = all.sort(
              (a, b) => new Date(b.startDate) - new Date(a.startDate),
            );
            if (searchTerm) {
              const s = searchTerm.toLowerCase();
              list = list.filter(
                (r) =>
                  (r.transport || "").toLowerCase().includes(s) ||
                  (r.location || "").toLowerCase().includes(s) ||
                  (r.mood || "").toLowerCase().includes(s) ||
                  (r.weather || "").toLowerCase().includes(s) ||
                  (r.note || "").toLowerCase().includes(s) ||
                  formatDate(r.startDate).includes(s),
              );
            }
            const total = list.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (travelPage > totalPages) travelPage = totalPages;
            const start = (travelPage - 1) * PAGE_SIZE;
            const pageData = list.slice(start, start + PAGE_SIZE);

            const totalTravel = all.length;
            const lastTravel =
              all.length > 0
                ? formatDate(
                    all.sort(
                      (a, b) => new Date(b.startDate) - new Date(a.startDate),
                    )[0].startDate,
                  )
                : "暂无";

            let html = `
            <div class="search-bar">
              <input type="text" id="travelSearch" placeholder="搜索旅行记录..." value="${searchTerm || ""}">
              <button onclick="doTravelSearch()">🔍</button>
            </div>
            <div class="row">
              <div class="card"><div class="card-title">✈️ 总旅行次数</div><div class="card-value" style="color:var(--primary);">${totalTravel}</div></div>
              <div class="card"><div class="card-title">🕐 最近一次</div><div class="card-value" style="font-size:18px;color:var(--primary);">${lastTravel}</div></div>
            </div>
          `;

            if (pageData.length === 0) {
              html += `<div class="empty-state"><span class="emoji-big">✈️</span>还没有旅行记录<br>点击下方「再一次旅行」添加</div>`;
            } else {
              pageData.forEach((r) => {
                let dateRange = formatDate(r.startDate);
                if (r.duration && r.duration > 1 && r.endDate)
                  dateRange += ` ~ ${formatDate(r.endDate)}`;
                const loc = r.location || "";
                const transport = r.transport || "🚗 自驾";
                const mood = r.mood || "😄 开心";
                const weather = r.weather || "";
                let mediaHtml = `<div class="media-thumb">📷</div>`;
                if (r.media) {
                  if (r.media.startsWith("data:video")) {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')">🎬</div>`;
                  } else if (r.media.startsWith("data:image")) {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')"><img src="${r.media}" alt="缩略图"></div>`;
                  } else {
                    mediaHtml = `<div class="media-thumb" onclick="viewMedia('${r.media}')">🖼️</div>`;
                  }
                }
                let noteHtml = "";
                if (r.note) {
                  const noteId = `note_${r.id}`;
                  noteHtml = `
                  <div class="record-note" onclick="event.stopPropagation();toggleNote('${noteId}')">
                    <span class="note-toggle">📝 备注</span>
                    <div class="note-content" id="${noteId}">${r.note}</div>
                  </div>
                `;
                }
                html += `
                <div class="record-item" onclick="editTravel(${r.id})" oncontextmenu="event.preventDefault();showContextMenu(event,'travel',${r.id},'travel')" ontouchstart="handleTouchStart(event,'travel',${r.id},'travel')">
                  <div class="record-sticky-header">
                    <span class="date-range">${dateRange}</span>
                    <button class="delete-btn" onclick="event.stopPropagation();deleteTravel(${r.id})">❌</button>
                  </div>
                  <div class="record-body">
                    <div class="info">
                      <div class="location"><span>📍 ${loc || "未设置地点"}</span>${weather ? `<span>🌤️ ${weather}</span>` : ""}</div>
                      <div class="tags">
                        <span>${transport}</span>
                        <span>${mood}</span>
                      </div>
                    </div>
                    ${mediaHtml}
                  </div>
                  <div class="record-footer">
                    <span class="action-btn">📅 ${formatDate(r.startDate)}</span>
                  </div>
                  ${noteHtml}
                </div>
              `;
              });
            }

            html += `<div class="pagination">
            <button onclick="travelGoPage(${travelPage - 1})" ${travelPage <= 1 ? "disabled" : ""}>‹</button>
            <span class="page-info">${travelPage} / ${totalPages}</span>
            <button onclick="travelGoPage(${travelPage + 1})" ${travelPage >= totalPages ? "disabled" : ""}>›</button>
          </div>`;
            html += `<button class="action-btn" style="width:100%;padding:10px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;border-radius:var(--radius);margin-top:4px;" onclick="addTravel()">✈️ 再一次旅行</button>`;

            container.innerHTML = html;
          } catch (e) {
            console.error("renderTravel error:", e);
            container.innerHTML = `<div class="empty-state"><span class="emoji-big">⚠️</span>加载数据失败，请刷新重试</div>`;
          }
        });
      }

      function getSymptomStats(records) {
        if (records.length === 0) return null;
        const symptomCount = {};
        const flowHistory = [];
        records.forEach((r) => {
          if (r.symptoms) {
            r.symptoms.forEach((s) => {
              if (s.symptom && s.symptom !== "无")
                symptomCount[s.symptom] = (symptomCount[s.symptom] || 0) + 1;
              if (s.flow) flowHistory.push(s.flow);
            });
          }
        });
        const sorted = Object.entries(symptomCount).sort((a, b) => b[1] - a[1]);
        const emojiMap = {
          腹疼: "🤕",
          头痛: "😵",
          疲劳: "😩",
          情绪波动: "😤",
          乳房胀痛: "🤱",
          恶心: "🤢",
        };
        const symptoms = sorted.map(([name, count]) => ({
          symptom: name,
          count,
          emoji: emojiMap[name] || "💊",
        }));

        let flowTrend = "";
        if (flowHistory.length > 0) {
          const flowLevel = { 少量: 1, 中等: 2, 大量: 3, 非常多: 4 };
          const avg =
            flowHistory.reduce((s, f) => s + (flowLevel[f] || 1), 0) /
            flowHistory.length;
          if (avg < 1.5) flowTrend = "总体偏少 🌱";
          else if (avg < 2.5) flowTrend = "总体适中 🌿";
          else if (avg < 3.5) flowTrend = "总体偏多 🌺";
          else flowTrend = "总体非常多 🔥";
        }
        return { symptoms, flowTrend };
      }

      function analyzeMenstrual(records) {
        if (records.length < 1) return null;
        const sorted = [...records].sort(
          (a, b) => new Date(a.startDate) - new Date(b.startDate),
        );
        const durations = sorted.map((r) => r.duration || 1);
        const durCount = {};
        durations.forEach((d) => {
          durCount[d] = (durCount[d] || 0) + 1;
        });
        let mostCommonDays = 0,
          maxC = 0;
        Object.entries(durCount).forEach(([k, v]) => {
          if (v > maxC) {
            maxC = v;
            mostCommonDays = parseInt(k);
          }
        });
        const distribution = {};
        durations.forEach((d) => {
          distribution[d] = (distribution[d] || 0) + 1;
        });

        let cycles = [];
        for (let i = 1; i < sorted.length; i++) {
          const prev = new Date(sorted[i - 1].startDate);
          const curr = new Date(sorted[i].startDate);
          const diff = daysBetween(prev, curr);
          if (diff > 0) cycles.push(diff);
        }
        const avgCycle =
          cycles.length > 0
            ? Math.round(cycles.reduce((a, b) => a + b, 0) / cycles.length)
            : 0;
        let lastCycle = cycles.length > 0 ? cycles[cycles.length - 1] : null;
        let compareLast = "";
        if (lastCycle && avgCycle > 0) {
          const diff = lastCycle - avgCycle;
          if (diff > 0) compareLast = `推迟${diff}天`;
          else if (diff < 0) compareLast = `提前${Math.abs(diff)}天`;
          else compareLast = "准时 ✅";
        }
        let avgDeviation = "";
        if (cycles.length > 0 && avgCycle > 0) {
          const deviations = cycles.map((c) => c - avgCycle);
          const avgDev =
            deviations.reduce((a, b) => a + b, 0) / deviations.length;
          if (Math.abs(avgDev) < 0.5) avgDeviation = "准时 ✅";
          else if (avgDev > 0) avgDeviation = `平均推迟${avgDev.toFixed(1)}天`;
          else avgDeviation = `平均提前${Math.abs(avgDev).toFixed(1)}天`;
        }

        let predictNext = "暂无数据";
        if (sorted.length > 0 && avgCycle > 0) {
          const last = new Date(sorted[sorted.length - 1].startDate);
          const next = addDays(last, avgCycle);
          const today = new Date();
          const nextStr = formatDate(next);
          const diffDays = daysBetween(next, today);
          if (diffDays === 0) predictNext = `${nextStr} (今天)`;
          else if (diffDays < 0)
            predictNext = `${nextStr} (已推迟${Math.abs(diffDays)}天)`;
          else predictNext = `${nextStr} (还有${diffDays}天)`;
        }

        let ovulation = "",
          safePeriod = "";
        if (sorted.length > 0 && avgCycle > 0) {
          const last = new Date(sorted[sorted.length - 1].startDate);
          const next = addDays(last, avgCycle);
          const ovuDate = addDays(next, -14);
          ovulation = formatDate(ovuDate);
          const fertileStart = addDays(ovuDate, -5);
          const fertileEnd = addDays(ovuDate, 4);
          safePeriod = `${formatDate(fertileStart)} ~ ${formatDate(fertileEnd)} (易孕期)`;
        }

        return {
          mostCommonDays,
          durationDistribution: distribution,
          lastCycle,
          compareLast,
          avgCycle,
          avgDeviation,
          predictNext,
          ovulation,
          safePeriod,
        };
      }

      function editMenstrualAddDay() {
        const container = document.getElementById("editMenstrualDaysContainer");
        if (!container) return;
        const idx = container.children.length;
        const flowHtml = flowOptions
          .map(
            (f) =>
              `<span class="tag-option" data-value="${f.label}" data-emoji="${f.emoji}" onclick="toggleFlow(this)" style="font-size:11px;padding:2px 8px;">${f.emoji} ${f.label}</span>`,
          )
          .join("");
        const symptomHtml = symptomOptions
          .map(
            (s) =>
              `<span class="tag-option" data-value="${s.label}" data-emoji="${s.emoji}" onclick="toggleSymptom(this)" style="font-size:11px;padding:2px 8px;">${s.emoji} ${s.label}</span>`,
          )
          .join("");
        const div = document.createElement("div");
        div.className = "menstrual-day-item";
        div.style.padding = "3px 0";
        div.innerHTML = `
        <div class="day-header">
          <span class="day-number" style="font-size:13px;">第${idx + 1}天</span>
          <button class="delete-day-btn" onclick="this.closest('.menstrual-day-item').remove()" style="font-size:12px;">✕ 删除</button>
        </div>
        <div class="day-row" style="gap:2px 6px;">
          <span class="day-label" style="font-size:10px;min-width:32px;">流量</span>
          <div class="day-tag-group day-flow-group" style="gap:2px;">${flowHtml}</div>
        </div>
        <div class="day-row" style="gap:2px 6px;">
          <span class="day-label" style="font-size:10px;min-width:32px;">症状</span>
          <div class="day-tag-group day-symptom-group" style="gap:2px;">${symptomHtml}</div>
        </div>
      `;
        container.appendChild(div);
        div
          .querySelector(".day-flow-group .tag-option")
          ?.classList.add("selected");
        div
          .querySelector('.day-symptom-group .tag-option[data-value="无"]')

      }

      function updateMenstrual(id) {
        const start = document.getElementById("editMenstrualStart").value;
        const duration =
          parseInt(document.getElementById("editMenstrualDuration").value) || 1;
        if (!start) return showToast("请选择日期");
        const dayDivs = document.querySelectorAll(
          "#editMenstrualDaysContainer .menstrual-day-item",
        );
        const symptoms = [];
        dayDivs.forEach((div) => {
          const flowEl = div.querySelector(
            ".day-flow-group .tag-option.selected",
          );
          const symptomEls = div.querySelectorAll(
            ".day-symptom-group .tag-option.selected",
          );
          const flow = flowEl ? flowEl.dataset.value : "少量";
          const symptom =
            symptomEls.length > 0
              ? Array.from(symptomEls)
                  .map((el) => el.dataset.value)
                  .join("、")
              : "无";
          symptoms.push({ flow, symptom });
        });
        while (symptoms.length < duration)
          symptoms.push({ flow: "少量", symptom: "无" });
        dbGet("menstrual", id).then((old) => {
          if (!old) return showToast("记录不存在");
          const updated = {
            ...old,
            startDate: start,
            duration: duration,
            symptoms: symptoms.slice(0, duration),
          };
          dbPut("menstrual", updated).then(() => {
            showToast("✅ 已更新");
            closeModal();
            renderMenstrual();
          });
        });
      }

      // ================================================================
      // BREAKUP 模块 (保持不变)
      // ================================================================
      function addBreakup() {
        dbGetAll("breakups")
          .then((list) => {
            const count =
              list && list.length > 0
                ? Math.max(...list.map((b) => b.count)) + 1
                : 1;
            const today = getTodayStr();
            let html = `
          <label>💔 分手日期</label><input type="date" id="breakupDate" value="${today}">
          <label>💕 和好日期 (可选)</label><input type="date" id="reconcileDate">
          <label>📝 备注 (可选)</label><textarea id="breakupNote" rows="2"></textarea>

            <button class="btn btn-primary" onclick="saveBreakup(${count})">💾 保存</button>
            <button class="btn" onclick="closeModal()">取消</button>

        `;
            openModal(`💔 记录第 ${count} 次分手`, html, () => {});
          })
          .catch(() => {
            const count =
              memoryStore.breakups && memoryStore.breakups.length > 0
                ? Math.max(...memoryStore.breakups.map((b) => b.count)) + 1
                : 1;
            const today = getTodayStr();
            let html = `
          <label>💔 分手日期</label><input type="date" id="breakupDate" value="${today}">

          <div class="btn-row">
            <button class="btn btn-primary" onclick="saveBreakup(${count})">💾 保存</button>
            <button class="btn" onclick="closeModal()">取消</button>
          </div>
        `;
            openModal(`💔 记录第 ${count} 次分手`, html, () => {});
          });
      }

      function saveBreakup(count) {
        const breakupDate = document.getElementById("breakupDate").value;
        const reconcileDate =
          document.getElementById("reconcileDate").value || null;
        const note = document.getElementById("breakupNote").value.trim();
        if (!breakupDate) return showToast("请选择分手日期");
        const record = {
          count,
          breakupDate,
          reconcileDate,
          note,
          createdAt: new Date().toISOString(),
        };
        dbAdd("breakups", record).then(() => {
          showToast("💔 已记录");
          closeModal();
          renderLove();
        });
      }

      function deleteBreakup(id) {
        if (confirm("确定删除该分手记录吗？")) {
          dbDelete("breakups", id).then(() => {
            showToast("已删除");
            renderLove();
          });
        }
      }

      function editBreakup(id) {
        dbGet("breakups", id).then((r) => {
          if (!r) return showToast("记录不存在");
          let html = `
          <label>💔 分手日期</label><input type="date" id="editBreakupDate" value="${r.breakupDate}">
          <label>💕 和好日期 (可选)</label><input type="date" id="editReconcileDate" value="${r.reconcileDate || ""}">
          <label>📝 备注</label><textarea id="editBreakupNote" rows="2">${r.note || ""}</textarea>
          <div class="btn-row">
            <button class="btn btn-danger" onclick="deleteBreakup(${id});closeModal();">🗑删除</button>
            <button class="btn btn-primary" onclick="updateBreakup(${id})">💾 保存</button>
            <button class="btn" onclick="closeModal()">取消</button>
          </div>
        `;
          openModal(`✏️ 编辑第 ${r.count} 次分手`, html, () => {});

      function updateBreakup(id) {
        const breakupDate = document.getElementById("editBreakupDate").value;
        const reconcileDate =
          document.getElementById("editReconcileDate").value || null;
        const note = document.getElementById("editBreakupNote").value.trim();
        if (!breakupDate) return showToast("请选择分手日期");
        dbGet("breakups", id).then((old) => {
          if (!old) return showToast("记录不存在");
          const updated = { ...old, breakupDate, reconcileDate, note };
          dbPut("breakups", updated).then(() => {
            showToast("✅ 已更新");
            closeModal();
            renderLove();
          });

      // ================================================================
      // LOVE 模块 (纪念日和倒计时合并)
      // ================================================================
      let achievementPage = 1;
      const ACHIEVEMENT_PAGE_SIZE = 6;

      function renderLove() {
        const container = document.getElementById("pageLove");
        try {
          Promise.allSettled([
            dbGetAll("loveInfo"),
            dbGetAll("memorial"),
            dbGetAll("fight"),
            dbGetAll("breakups"),
            dbGetAll("happy"),
            dbGetAll("travel"),
          ])
            .then((results) => {
              const infoArr =
                results[0].status === "fulfilled" ? results[0].value : [];
              const memorials =
                results[1].status === "fulfilled" ? results[1].value : [];
              const fights =
                results[2].status === "fulfilled" ? results[2].value : [];
              const breakups =
                results[3].status === "fulfilled" ? results[3].value : [];
              const happy =
                results[4].status === "fulfilled" ? results[4].value : [];
              const travel =
                results[5].status === "fulfilled" ? results[5].value : [];

              const info = infoArr && infoArr.length > 0 ? infoArr[0] : null;

              let html = "";
              // ---- 恋爱信息 ----
              if (info) {
                const days = info.endDate
                  ? daysBetween(
                      new Date(info.startDate),
                      new Date(info.endDate),
                    )
                  : daysBetween(new Date(info.startDate), new Date());
                html += `<div class="card love-profile" style="padding:14px 12px;">
              <div class="names" style="font-size:20px;">${info.myName || "我"} <span class="heart-icon">💗</span> ${info.herName || "TA"}</div>
              <div class="date-info" style="font-size:13px;">📅 ${formatDate(info.startDate)} ${info.endDate ? `~ ${formatDate(info.endDate)}` : "💕 进行中"}</div>
              <div class="days" style="font-size:28px;">💕 在一起 ${days > 0 ? days : 0} 天</div>
            </div>`;
              } else {
                const today = getTodayStr();
                html += `<div class="card" style="padding:12px 14px;">
              <div style="display:flex;flex-direction:column;gap:6px;">
                <input type="text" id="loveMyName" placeholder="我的名字" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:14px;">
                <input type="text" id="loveHerName" placeholder="TA的名字" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:14px;">
                <input type="date" id="loveStartDate" placeholder="恋爱开始日期" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:14px;" value="${today}">
                <input type="date" id="loveEndDate" placeholder="结束日期 (可选)" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:14px;">
                <button class="btn btn-primary" onclick="saveLoveInfo()" style="padding:10px;border-radius:6px;background:var(--primary);color:#fff;font-weight:600;font-size:14px;">💾 保存</button>
              </div>
            </div>`;
              }

              // ---- 纪念日合并 (倒计时 + 列表) ----
              html += `<div class="section-block memorial-combined">
            <div class="section-header">
              <span>🎉 纪念日</span>
              <button class="action-btn" onclick="addMemorial()">➕ 添加</button>
            </div>`;

              if (!memorials || memorials.length === 0) {
                html += `<div class="empty-state" style="padding:12px;font-size:14px;">还没有纪念日，添加第一个纪念日吧 🎉</div>`;
              } else {
                // 倒计时部分：即将到来的前3个
                const today = new Date();
                const withDiff = memorials.map((m) => {
                  const d = new Date(m.date);
                  const diff = daysBetween(today, d);
                  return { ...m, diff };
                });
                const sorted = withDiff.sort((a, b) => {
                  if (a.diff >= 0 && b.diff < 0) return -1;
                  if (a.diff < 0 && b.diff >= 0) return 1;
                  return Math.abs(a.diff) - Math.abs(b.diff);
                });
                const top3 = sorted.slice(0, 3);
                // 倒计时卡片
                top3.forEach((m) => {
                  const isFuture = m.diff >= 0;
                  const daysText = isFuture
                    ? `还有 ${m.diff} 天`
                    : `已过 ${Math.abs(m.diff)} 天`;
                  const cls = isFuture ? "" : "negative";
                  html += `
                <div class="countdown-card">
                  <span class="name">${m.content || "纪念日"}</span>
                  <span class="days ${cls}">${daysText}</span>
                </div>
              `;
                });
                if (sorted.length > 3) {
                  html += `<div style="text-align:center;font-size:12px;color:var(--text-secondary);padding:2px 0 6px;">... 共 ${sorted.length} 个纪念日</div>`;
                }

                // 列表：所有纪念日
                const memList = (memorials || []).sort(
                  (a, b) => new Date(b.date) - new Date(a.date),
                );
                html += `<div style="margin-top:6px;border-top:0.5px solid var(--border);padding-top:6px;">`;
                memList.slice(0, 10).forEach((m) => {
                  const passed = daysBetween(new Date(m.date), new Date());
                  html += `
                <div class="mem-list-item" onclick="editMemorial(${m.id})" oncontextmenu="event.preventDefault();showContextMenu(event,'memorial',${m.id},'memorial')" ontouchstart="handleTouchStart(event,'memorial',${m.id},'memorial')">
                  <span class="mem-name">${m.content || "纪念日"}</span>
                  <span class="mem-date">${formatDate(m.date)} · ${passed > 0 ? passed : 0}天前</span>
                </div>
              `;
                });
                if (memList.length > 10) {
                  html += `<div style="text-align:center;font-size:12px;color:var(--text-secondary);padding:4px;">... 共 ${memList.length} 条</div>`;
                }
                html += `</div>`;
              }
              html += `</div>`;

              // ---- 吵架 / 和好 ----
              html += `<div class="section-block">
            <div class="section-header">
              <span>💢 吵架 / 和好</span>
              <button class="action-btn" onclick="addFight()">➕ 添加</button>
            </div>`;
              const fightList = (fights || []).sort(
                (a, b) => new Date(b.date) - new Date(a.date),
              );
              if (fightList.length === 0) {
                html += `<div class="empty-state" style="padding:12px;font-size:14px;">还没有吵架/和好记录</div>`;
              } else {
                fightList.slice(0, 5).forEach((f) => {
                  const emoji = f.type === "吵架" ? "💢" : "💕";
                  html += `
                <div class="record-item" style="margin-bottom:6px;" onclick="editFight(${f.id})" oncontextmenu="event.preventDefault();showContextMenu(event,'fight',${f.id},'fight')" ontouchstart="handleTouchStart(event,'fight',${f.id},'fight')">
                  <div class="record-sticky-header" style="padding:6px 12px;">
                    <span class="date-range" style="font-size:13px;">${formatDate(f.date)} ${emoji} ${f.type}</span>
                    <button class="delete-btn" onclick="event.stopPropagation();deleteFight(${f.id})" style="font-size:16px;">❌</button>
                  </div>
                  <div class="record-body" style="padding:6px 12px 8px;">
                    <div class="info">
                      ${f.location ? `<div class="location" style="font-size:13px;">📍 ${f.location}</div>` : ""}
                      ${f.reason ? `<div style="font-size:13px;color:var(--text-secondary);">${f.reason}</div>` : ""}
                    </div>
                  </div>
                </div>
              `;
                });
                if (fightList.length > 5)
                  html += `<div style="text-align:center;font-size:12px;color:var(--text-secondary);padding:3px;">... 共 ${fightList.length} 条</div>`;
              }
              html += `</div>`;

              // ---- 分手记录 ----
              html += `<div class="section-block">
            <div class="section-header">
              <span>💔 分手记录</span>
              <button class="action-btn" onclick="addBreakup()">➕ 添加</button>
            </div>`;
              if (!breakups || breakups.length === 0) {
                html += `<div class="empty-state" style="padding:12px;font-size:14px;">还没有分手记录 💕</div>`;
              } else {
                const sortedBreakups = [...breakups].sort(
                  (a, b) => new Date(b.breakupDate) - new Date(a.breakupDate),
                );
                sortedBreakups.forEach((b) => {
                  html += `
                <div class="record-item" onclick="editBreakup(${b.id})" oncontextmenu="event.preventDefault();showContextMenu(event,'breakups',${b.id},'breakups')" ontouchstart="handleTouchStart(event,'breakups',${b.id},'breakups')">
                  <div class="record-sticky-header" style="padding:6px 12px;">
                    <span class="date-range">第 ${b.count} 次分手</span>
                    <button class="delete-btn" onclick="event.stopPropagation();deleteBreakup(${b.id})" style="font-size:16px;">❌</button>
                  </div>
                  <div class="record-body" style="padding:6px 12px 8px;">
                    <div class="info">
                      <div>💔 分手：${formatDate(b.breakupDate)}</div>
                      <div>💕 和好：${b.reconcileDate ? formatDate(b.reconcileDate) : "暂未和好"}</div>
                      ${b.note ? `<div style="margin-top:4px;font-size:13px;color:var(--text-secondary);">📝 ${b.note}</div>` : ""}
                    </div>
                  </div>
                </div>
              `;
                });
              }
              html += `</div>`;

              // ---- 成就墙 ----
              const allAchievements = collectAchievements(
                happy || [],
                travel || [],
                memorials || [],
                info,
              );
              const totalAch = allAchievements.length;
              const totalAchPages = Math.max(
                1,
                Math.ceil(totalAch / ACHIEVEMENT_PAGE_SIZE),
              );
              if (achievementPage > totalAchPages)
                achievementPage = totalAchPages;
              const achStart = (achievementPage - 1) * ACHIEVEMENT_PAGE_SIZE;
              const pageAchievements = allAchievements.slice(
                achStart,
                achStart + ACHIEVEMENT_PAGE_SIZE,
              );

              html += `<div class="section-block">
            <div class="section-header">
              <span>🏆 成就墙 <span style="font-size:12px;font-weight:400;color:var(--text-secondary);">共 ${totalAch} 项</span></span>
            </div>
            <div class="achievement-grid">`;
              if (pageAchievements.length === 0) {
                html += `<div class="empty-state" style="padding:12px;font-size:14px;grid-column:1/-1;">还没有成就，继续创造美好回忆吧 💕</div>`;
              } else {
                pageAchievements.forEach((a) => {
                  html += `
                <div class="ach-item unlocked" onclick="triggerAchievementEggRandom()">
                  <span class="ach-emoji">${a.emoji || "🏆"}</span>
                  <span class="ach-name">${a.name || "成就"}</span>
                  <span class="ach-date">${a.date ? formatDate(a.date) : "已达成"}</span>
                </div>
              `;
                });
              }
              html += `</div>`;
              if (totalAchPages > 1) {
                html += `<div class="pagination" style="padding:4px 0;">
              <button onclick="achievementGoPage(${achievementPage - 1})" ${achievementPage <= 1 ? "disabled" : ""} style="font-size:13px;padding:4px 12px;">‹</button>
              <span class="page-info" style="font-size:12px;">${achievementPage} / ${totalAchPages}</span>
              <button onclick="achievementGoPage(${achievementPage + 1})" ${achievementPage >= totalAchPages ? "disabled" : ""} style="font-size:13px;padding:4px 12px;">›</button>
            </div>`;
              }
              html += `</div>`;

              container.innerHTML = html;
            })
            .catch((err) => {
              console.error("renderLove error:", err);
              container.innerHTML = `<div class="empty-state"><span class="emoji-big">⚠️</span>加载Love数据失败，请刷新重试</div>`;
            });
        } catch (err) {
          console.error("renderLove fatal error:", err);
          container.innerHTML = `<div class="empty-state"><span class="emoji-big">⚠️</span>加载Love数据失败，请刷新重试</div>`;
        }
      }

      function achievementGoPage(p) {
        if (p < 1) return;
        achievementPage = p;
        renderLove();
      }

      function collectAchievements(happy, travel, memorial, info) {
        try {
          const achievements = [];
          happy = happy || [];
          travel = travel || [];
          memorial = memorial || [];

          if (info && info.startDate) {
            const days = daysBetween(new Date(info.startDate), new Date());
            const milestones = [1, 7, 30, 50, 100, 200, 365, 500, 1000];
            milestones.forEach((m) => {
              if (days >= m) {
                const date = addDays(new Date(info.startDate), m - 1);
                achievements.push({
                  name: `💕 在一起 ${m} 天`,
                  emoji: "💕",
                  date: dateToStr(date),
                });
              }
            });
          }
          if (travel.length >= 1) {
            const sorted = travel.sort(
              (a, b) => new Date(a.startDate) - new Date(b.startDate),
            );
            if (sorted[0] && sorted[0].startDate) {
              achievements.push({
                name: "✈️ 第一次旅行",
                emoji: "✈️",
                date: sorted[0].startDate,
              });
            }
          }
          if (travel.length >= 3) {
            const sorted = travel.sort(
              (a, b) => new Date(b.startDate) - new Date(a.startDate),
            );
            if (sorted[0] && sorted[0].startDate) {
              achievements.push({
                name: "🌍 旅行达人 (3次)",
                emoji: "🌍",
                date: sorted[0].startDate,
              });
            }
          }
          if (happy.length >= 5) {
            const sorted = happy.sort(
              (a, b) => new Date(b.startDate) - new Date(a.startDate),
            );
            if (sorted[0] && sorted[0].startDate) {
              achievements.push({
                name: "😄 快乐5次",
                emoji: "😄",
                date: sorted[0].startDate,
              });
            }
          }
          if (happy.length >= 10) {
