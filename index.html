          if (happy.length >= 50) {

            );
            if (sorted[0] && sorted[0].startDate) {

          if (memorial.length >= 3) {

                name: "🎉 5个纪念日",
                emoji: "🎊",
                date: sorted[0].date,
              });
            }
          }
          const map = {};

                  new Date(a.date) > new Date(map[a.name].date)))

      function previewMedia(input, previewId) {
        const container = document.getElementById(previewId);
        if (!container) return;
        if (!input.files || !input.files[0]) {
          container.innerHTML = `<span class="placeholder">暂无预览</span>`;
          return;
        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          const data = e.target.result;
          if (file.type.startsWith("image/")) {
            container.innerHTML = `<img src="${data}" alt="预览">`;
          } else if (file.type.startsWith("video/")) {
            container.innerHTML = `<video src="${data}" controls style="max-height:140px;"></video>`;
          } else {
            container.innerHTML = `<span class="placeholder">不支持预览此格式</span>`;
          }
        };
        reader.readAsDataURL(file);
      }

      function addCustomTag(type, inputId) {
        const input = document.getElementById(inputId);
        if (!input || !input.value.trim()) return showToast("请输入标签");
        const tag = input.value.trim();
        const key = `custom_${type}`;
        const saved = localStorage.getItem(key);
        let tags = saved ? JSON.parse(saved) : [];
        if (tags.includes(tag)) return showToast("标签已存在");
        tags.push(tag);
        localStorage.setItem(key, JSON.stringify(tags));
        showToast("✅ 已添加");
        closeModal();
        setTimeout(showSettings, 300);
      }

      function removeCustomTag(type, index) {
        const key = `custom_${type}`;
        const saved = localStorage.getItem(key);
        if (!saved) return;
        let tags = JSON.parse(saved);
        tags.splice(index, 1);
        localStorage.setItem(key, JSON.stringify(tags));
        showToast("已删除");
        closeModal();
        setTimeout(showSettings, 300);
      }

      function renderTrendChart(happy, travel) {
        const canvas = document.getElementById("trendChart");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const year = new Date().getFullYear();
        const monthData = Array(12).fill(0);
        happy.forEach((h) => {
          if (h.startDate) {
            const d = new Date(h.startDate);
            if (d.getFullYear() === year) monthData[d.getMonth()]++;
          }
        });
        travel.forEach((t) => {
          if (t.startDate) {
            const d = new Date(t.startDate);
            if (d.getFullYear() === year) monthData[d.getMonth()]++;
          }
        });
        if (monthData.every((v) => v === 0)) {
          canvas.parentElement.innerHTML =
            "<div style='padding:14px;text-align:center;color:var(--text-secondary);font-size:13px;'>今年暂无数据</div>";
          return;
        }
        const labels = [
          "1月",
          "2月",
          "3月",
          "4月",
          "5月",
          "6月",
          "7月",
          "8月",
          "9月",
          "10月",
          "11月",
          "12月",
        ];
        new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "快乐+旅行",
                data: monthData,
                borderColor: "#FF6B8A",
                backgroundColor: "rgba(255,107,138,0.1)",
                fill: true,
                tension: 0.3,
                pointBackgroundColor: "#FF6B8A",
                pointRadius: 3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: {
                ticks: {
                  maxRotation: 0,
                  minRotation: 0,
                  font: { size: 9 },
                  autoSkip: false,
                },
              },
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1, font: { size: 9 } },
              },
            },
          },
        });
      }

      // ---------- 地图 (保持不变) ----------
      function renderChinaMap(locationDetails, visitedProvinceShort, citySet) {
        const container = document.getElementById("chinaMapContainer");
        if (!container) return;
        if (chinaChart) {
          chinaChart.dispose();
          chinaChart = null;
        }
        chinaChart = echarts.init(container);

        if (!chinaMapLoaded) {
          fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json")
            .then((res) => {
              if (!res.ok) throw new Error("网络请求失败");
              return res.json();
            })
            .then((chinaJson) => {
              chinaMapLoaded = true;
              chinaMapData = chinaJson;
              echarts.registerMap("china", chinaJson);
              buildChinaMap(
                chinaChart,
                locationDetails,
                visitedProvinceShort,
                citySet,
              );
            })
            .catch((err) => {
              console.warn("加载中国地图数据失败，使用备用", err);
              container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">🌍 地图加载中...<br>请检查网络</div>`;
              setTimeout(() => {
                fetch(
                  "https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json",
                )
                  .then((res) => res.json())
                  .then((data) => {
                    chinaMapLoaded = true;
                    chinaMapData = data;
                    echarts.registerMap("china", data);
                    buildChinaMap(
                      chinaChart,
                      locationDetails,
                      visitedProvinceShort,
                      citySet,
                    );
                  })
                  .catch(() => {
                    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">⚠️ 地图加载失败，请刷新</div>`;
                  });
              }, 2000);
            });
        } else {
          if (chinaMapData) echarts.registerMap("china", chinaMapData);
          buildChinaMap(
            chinaChart,
            locationDetails,
            visitedProvinceShort,
            citySet,
          );
        }

        const resizeHandler = () => {
          if (chinaChart) chinaChart.resize();
        };
        window.removeEventListener("resize", resizeHandler);
        window.addEventListener("resize", resizeHandler);
        const ro = new ResizeObserver(() => {
          if (chinaChart) chinaChart.resize();
        });
        ro.observe(container);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && chinaChart)
            setTimeout(() => chinaChart.resize(), 100);
        });
      }

      function buildChinaMap(
        chart,
        locationDetails,
        visitedProvinceShort,
        citySet,
      ) {
        if (!chart) return;

        const provinceData = [];
        allProvinceFullNames.forEach((fullName, index) => {
          const shortName = provinceShortNames[fullName] || fullName;
          const isVisited = visitedProvinceShort.has(shortName);
          const hoverColor = hoverColors[index % hoverColors.length];
          provinceData.push({
            name: fullName,
            value: isVisited ? 1 : 0,
            itemStyle: {
              areaColor: isVisited ? "#FF6B8A" : "transparent",
              borderColor: "#999",
              borderWidth: 1.2,
            },
            emphasis: {
              itemStyle: {
                areaColor: hoverColor,
                borderColor: "#FF6B8A",
                borderWidth: 2,
              },
              label: {
                show: true,
                fontSize: 12,
                fontWeight: "bold",
                color: "#333",
              },
            },
          });
        });

        const cityMarkData = [];
        const cityMap = {};
        locationDetails.forEach((item) => {
          if (item.city && !cityMap[item.city]) {
            const coord = cityCoords[item.city];
            if (coord) {
              cityMap[item.city] = true;
              cityMarkData.push({ name: item.city, value: coord.concat([1]) });
            }
          }
        });

        const option = {
          tooltip: {
            trigger: "item",
            formatter: function (params) {
              if (params.componentType === "series") {
                if (params.seriesName === "城市") return `📍 ${params.name}`;
                if (params.seriesName === "省份") {
                  const shortName =
                    provinceShortNames[params.name] || params.name;
                  const visited = params.value === 1 ? "💕 去过" : "未去";
                  return `${shortName}<br>${visited}`;
                }
              }
              return "";
            },
          },
          geo: {
            map: "china",
            roam: true,
            zoom: 1.15,
            center: [104, 35],
            itemStyle: { borderColor: "#999", borderWidth: 1.2 },
            emphasis: {},
          },
          series: [
            {
              name: "省份",
              type: "map",
              map: "china",
              geoIndex: 0,
              data: provinceData,
              label: {
                show: true,
                fontSize: 9,
                color: "#555",
                formatter: function (params) {
                  return provinceShortNames[params.name] || params.name;
                },
              },
              itemStyle: { borderColor: "#999", borderWidth: 1.2 },
              emphasis: {},
            },
            {
              name: "城市",
              type: "scatter",
              coordinateSystem: "geo",
              data: cityMarkData,
              symbol: "pin",
              symbolSize: 24,
              label: {
                show: true,
                formatter: "{b}",
                position: "right",
                fontSize: 9,
                color: "#333",
                fontWeight: 600,
              },
              itemStyle: { color: "#FF6B8A" },
              emphasis: {
                label: { show: true, fontSize: 11, fontWeight: "bold" },
                itemStyle: { color: "#FF3B6A" },
              },
            },
          ],
        };

        chart.setOption(option, true);
        chart.resize();

        chart.off("click");
        chart.on("click", function (params) {
          if (
            params.componentType === "series" &&
            params.seriesName === "城市"
          ) {
            const cityName = params.name;
            const details = locationDetails.filter(
              (item) => item.city === cityName,
            );
            if (details.length > 0) {
              let msg = `📍 ${cityName}\n`;
              details.forEach((d) => {
                msg += `${d.type} ${formatDate(d.date)}\n`;
              });
              showToast(msg.replace(/\n/g, " · "));
            }
          } else if (
            params.componentType === "series" &&
            params.seriesName === "省份"
          ) {
            const fullName = params.name;
            const shortName = provinceShortNames[fullName] || fullName;
            const details = locationDetails.filter((item) => {
              const pFull = shortToFull[item.province] || item.province;
              return pFull === fullName;
            });
            if (details.length > 0) {
              let msg = `📍 ${shortName}\n`;
              const cities = new Set();
              details.forEach((d) => {
                if (d.city) cities.add(d.city);
              });
              msg += `去过城市：${Array.from(cities).join("、")}`;
              showToast(msg.replace(/\n/g, " · "));
            }
          }
        });
      }

      // ================================================================
      // 导航栏交互 (全新)

      let currentTab = "love";

      function switchTab(tab) {
        if (tab === currentTab) return;
        currentTab = tab;
        document.querySelectorAll(".tab-item").forEach((el) => {
          el.classList.toggle("active", el.dataset.tab === tab);
        });
        document.querySelectorAll(".page-container").forEach((el) => {
          el.classList.toggle("active", el.dataset.page === tab);
        });
        // 如果切换到日历，使用日历逻辑
        if (tab === "calendar") {
          openCalendarPage();
          return;
        }
        if (tab === "happy") renderHappy();
        else if (tab === "travel") renderTravel();
        else if (tab === "overview") {
          renderOverview();
          setTimeout(() => {
            const c = document.getElementById("chinaMapContainer");
            if (c && chinaChart) chinaChart.resize();
          }, 300);
        } else if (tab === "menstrual") renderMenstrual();
        else if (tab === "love") renderLove();
        const container = document.querySelector(
          `.page-container[data-page="${tab}"]`,
        );
        if (container) container.scrollTop = 0;
      }

      `;

        setTimeout(() => {
          const input = document.getElementById("globalSearchInput");

            input.focus();
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter") doGlobalSearch();

      function doGlobalSearch() {
        const input = document.getElementById("globalSearchInput");
        const term = input ? input.value.trim() : "";
        if (!term) {
          showToast("请输入搜索关键词");
          return;
        }
        const s = term.toLowerCase();
        Promise.all([
          dbGetAll("happy"),
          dbGetAll("travel"),
          dbGetAll("menstrual"),
          dbGetAll("memorial"),
          dbGetAll("fight"),
          dbGetAll("breakups"),
        ]).then(([happy, travel, menstrual, memorial, fight, breakups]) => {
          const results = [];

          happy.forEach((r) => {
            const text =
              `${r.type || ""} ${r.location || ""} ${r.mood || ""} ${r.weather || ""} ${r.note || ""} ${formatDate(r.startDate)}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "😄 快乐",
                date: r.startDate,
                id: r.id,
                store: "happy",
                data: r,
              });
          });
          travel.forEach((r) => {
            const text =
              `${r.transport || ""} ${r.location || ""} ${r.mood || ""} ${r.weather || ""} ${r.note || ""} ${formatDate(r.startDate)}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "✈️ 旅行",
                date: r.startDate,
                id: r.id,
                store: "travel",
                data: r,
              });
          });
          menstrual.forEach((r) => {
            const text =
              `${r.duration || ""} ${formatDate(r.startDate)} ${r.symptoms ? r.symptoms.map((sy) => sy.flow + " " + sy.symptom).join(" ") : ""}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "🩸 月经",
                date: r.startDate,
                id: r.id,
                store: "menstrual",
                data: r,
              });
          });
          memorial.forEach((r) => {
            const text =
              `${r.content || ""} ${r.location || ""} ${formatDate(r.date)}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "🎉 纪念日",
                date: r.date,
                id: r.id,
                store: "memorial",
                data: r,
              });
          });
          fight.forEach((r) => {
            const text =
              `${r.type || ""} ${r.location || ""} ${r.reason || ""} ${formatDate(r.date)}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "💢 吵架/和好",
                date: r.date,
                id: r.id,
                store: "fight",
                data: r,
              });
          });
          (breakups || []).forEach((r) => {
            const text =
              `${r.count || ""} ${formatDate(r.breakupDate)} ${r.reconcileDate ? formatDate(r.reconcileDate) : ""} ${r.note || ""}`.toLowerCase();
            if (text.includes(s))
              results.push({
                type: "💔 分手",
                date: r.breakupDate,
                id: r.id,
                store: "breakups",
                data: r,
              });
          });

          results.sort((a, b) => new Date(b.date) - new Date(a.date));

          const container = document.getElementById("globalSearchResults");
          if (results.length === 0) {
            container.innerHTML = `<div class="empty-state"><span class="emoji-big">🔍</span>没有找到匹配的记录</div>`;
            return;
          }
          let html = `<div style="font-size:12px;color:var(--text-secondary);padding:4px 0;">找到 ${results.length} 条结果</div>`;
          results.slice(0, 30).forEach((r) => {
            const date = formatDate(r.date);
            const loc = r.data.location ? `📍 ${r.data.location}` : "";
            const detail =
              r.data.type ||
              r.data.transport ||
              r.data.content ||
              r.data.type ||
              r.data.count ||
              "";
            html += `
            <div class="record-item" style="cursor:pointer;margin-bottom:4px;" onclick="jumpToRecord('${r.store}',${r.id})">
              <div class="record-sticky-header" style="padding:4px 10px;">
                <span>${r.type} ${date}</span>
              </div>
              <div class="record-body" style="padding:4px 10px;">
                <div class="info">
                  <div class="tags"><span>${detail}</span> ${loc ? `<span>${loc}</span>` : ""}</div>
                </div>
              </div>
            </div>
          `;
          });
          if (results.length > 30)
            html += `<div style="text-align:center;font-size:12px;color:var(--text-secondary);padding:6px;">... 还有 ${results.length - 30} 条结果</div>`;
          container.innerHTML = html;
        });
      }

      function jumpToRecord(store, id) {
        closeModal();
        const tabMap = {
          happy: "happy",
          travel: "travel",
          menstrual: "menstrual",
          memorial: "love",
          fight: "love",
          breakups: "love",
        };
        const tab = tabMap[store] || "love";
        switchTab(tab);
        setTimeout(() => {
          const items = document.querySelectorAll(
            `.page-container[data-page="${tab}"] .record-item`,
          );
          items.forEach((el) => {
            const onclick = el.getAttribute("onclick") || "";
            if (
              onclick.includes(
                `edit${store.charAt(0).toUpperCase() + store.slice(1)}(${id})`,
              ) ||
              onclick.includes(
                `delete${store.charAt(0).toUpperCase() + store.slice(1)}(${id})`,
              )
            ) {
              el.style.border = "2px solid var(--primary)";
              el.style.boxShadow = "0 0 0 4px rgba(255,107,138,0.2)";
              setTimeout(() => {
                el.style.border = "";
                el.style.boxShadow = "";
              }, 3000);
              el.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          });
        }, 400);
      }

      function randomMemory() {
        Promise.all([
          dbGetAll("happy"),
          dbGetAll("travel"),
          dbGetAll("menstrual"),
          dbGetAll("memorial"),
        ]).then(([happy, travel, menstrual, memorial]) => {
          const all = [...happy, ...travel, ...menstrual, ...memorial];
          if (all.length === 0) {
            showToast("还没有记录哦，快去添加吧 💕");
            return;
          }
          const pick = all[Math.floor(Math.random() * all.length)];
          let detail = "";
          if (pick.type !== undefined && pick.type !== null)
            detail = `🏷️ ${pick.type}`;
          else if (pick.transport) detail = `🚗 ${pick.transport}`;
          else if (pick.symptoms) detail = `🩸 月经记录`;
          else if (pick.content) detail = `🎉 ${pick.content}`;
          const date = formatDate(
            pick.startDate || pick.date || pick.createdAt,
          );
          const loc = pick.location ? `📍 ${pick.location}` : "";
          const weather = pick.weather ? `🌤️ ${pick.weather}` : "";
          const note = pick.note ? `📝 ${pick.note.substring(0, 20)}` : "";
          const msg =
            `📅 ${date}\n${loc}\n${weather}\n${detail}\n${note}`.trim();
          showToast(`🎲 随机回忆：${msg.replace(/\n/g, " · ")}`);
        });
      }

          document.addEventListener("keydown", (e) => {

              else if (active && active.id === "travelSearch") doTravelSearch();
              else if (active && active.id === "globalSearchInput")

          requestNotificationPermission();
          setInterval(checkSmartReminders, 30000);

          console.log("💕 Love·轨迹 App 已启动 (完整版)");
