      // ============================================================
      // 拖拽
      // ============================================================
      let dragItemEl = null,
        dragTypeEl = null;

      function setupDragAndDrop(container) {
        const items = container.querySelectorAll('[draggable="true"]');
        items.forEach((item) => {
          item.removeEventListener("dragstart", handleDragStartEl);
          item.removeEventListener("dragend", handleDragEndEl);
          item.removeEventListener("dragover", handleDragOverEl);
          item.removeEventListener("dragenter", handleDragEnterEl);
          item.removeEventListener("drop", handleDropEl);
          item.addEventListener("dragstart", handleDragStartEl);
          item.addEventListener("dragend", handleDragEndEl);
          item.addEventListener("dragover", handleDragOverEl);
          item.addEventListener("dragenter", handleDragEnterEl);
          item.addEventListener("drop", handleDropEl);
        });
      }

      function handleDragStartEl(e) {
        dragItemEl = this;
        if (this.closest(".menstrual-record-card")) dragTypeEl = "menstrual";
        else dragTypeEl = "overview";
        e.dataTransfer.setData("text/plain", dragTypeEl);
        this.style.opacity = "0.5";
        e.dataTransfer.effectAllowed = "move";
      }

      function handleDragEndEl(e) {
        this.style.opacity = "1";
        document
          .querySelectorAll(".drag-over")
          .forEach((el) => el.classList.remove("drag-over"));
      }

      function handleDragOverEl(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      }

      function handleDragEnterEl(e) {
        e.preventDefault();
        if (this !== dragItemEl) this.classList.add("drag-over");
      }

      function handleDropEl(e) {
        e.preventDefault();
        this.classList.remove("drag-over");
        if (dragItemEl === this) return;
        const parent = this.parentNode;
        const allItems = [...parent.querySelectorAll('[draggable="true"]')];
        const fromIndex = allItems.indexOf(dragItemEl);
        const toIndex = allItems.indexOf(this);
        if (fromIndex < toIndex)
          parent.insertBefore(dragItemEl, this.nextSibling);
        else parent.insertBefore(dragItemEl, this);
        if (dragTypeEl === "menstrual") {
          const items = parent.querySelectorAll(".menstrual-record-card");
          const newOrder = [];
          items.forEach((el) => {
            const id = el.dataset.id;
            const item = data.menstrual.find((d) => d.id === id);
            if (item) newOrder.push(item);
          });
          data.menstrual = newOrder;
          saveData();
        } else if (dragTypeEl === "overview") {
          const items = parent.querySelectorAll(".overview-card");
          const newOrder = [];
          items.forEach((el) => {
            const key = el.dataset.key;
            if (key) newOrder.push(key);
          });
          const allKeys = [
            "happy_count",
            "travel_count",
            "love_days",
            "last_travel",
            "last_happy",
          ];
          const finalOrder = newOrder.filter((k) => allKeys.includes(k));
          allKeys.forEach((k) => {
            if (!finalOrder.includes(k)) finalOrder.push(k);
          });
          data.overviewOrder = finalOrder;
          saveData();
          renderOverview();
        }
        dragItemEl = null;
        dragTypeEl = null;
      }

      // ============================================================
      // 月经
      // ============================================================
      let menstrualPageNum = 1;

      function renderMenstrual(list) {
        const source = list || data.menstrual;
        const total = source.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (menstrualPageNum > totalPages) menstrualPageNum = totalPages;
        const start = (menstrualPageNum - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const pageData = source.slice(start, end);

        const statsContainer = document.getElementById("menstrualStats");
        if (statsContainer) {
          let avgCycle = 0,
            lastCycle = 0,
            cycles = [];
          if (source.length >= 2) {
            for (let i = 1; i < source.length; i++) {
              const diff = daysBetween(
                source[i - 1].startDate,
                source[i].startDate,
              );
              if (diff > 0) cycles.push(diff);
            }
            if (cycles.length > 0) {
              avgCycle = Math.round(
                cycles.reduce((a, b) => a + b, 0) / cycles.length,
              );
              lastCycle = cycles[cycles.length - 1] || 0;
            }
          }
          let nextDate = "-";
          if (source.length > 0 && avgCycle > 0) {
            const last = new Date(source[source.length - 1].startDate);
            last.setDate(last.getDate() + avgCycle);
            nextDate = formatDate(last);
          }
          const lastRecord =
            source.length > 0 ? source[source.length - 1] : null;
          const lastStart = lastRecord ? formatDate(lastRecord.startDate) : "-";
          const lastEnd =
            lastRecord && lastRecord.endDate
              ? formatDate(lastRecord.endDate)
              : "";
          const lastRange = lastStart + (lastEnd ? " ~ " + lastEnd : "");
          const deviation = lastCycle > 0 ? lastCycle - avgCycle : 0;
          const deviationText =
            deviation > 0
              ? `推迟 ${deviation}天`
              : deviation < 0
                ? `提前 ${Math.abs(deviation)}天`
                : "准时";
          const statItems = [
            { emoji: "📋", label: "总次数", value: total, unit: "次" },
            { emoji: "⏳", label: "预计下次", value: nextDate, unit: "" },
            { emoji: "📅", label: "上次月经时间", value: lastRange, unit: "" },
            { emoji: "📊", label: "偏差", value: deviationText, unit: "" },
            {
              emoji: "📈",
              label: "平均偏差",
              value:
                deviation > 0
                  ? `推迟 ${Math.round(avgCycle ? deviation : 0)}天`
                  : deviation < 0
                    ? `提前 ${Math.round(Math.abs(deviation))}天`
                    : "准时",
              unit: "",
            },
            {
              emoji: "🔄",
              label: "周期",
              value: lastCycle > 0 ? lastCycle + "天" : "-",
              unit: "",
            },
            {
              emoji: "📊",
              label: "平均周期",
              value: avgCycle > 0 ? avgCycle + "天" : "-",
              unit: "",
            },
          ];
          let statsHtml = `<div class="menstrual-stats-grid">`;
          statItems.forEach((item) => {
            statsHtml += `
              <div class="menstrual-stat-card">
                <div class="ms-title"><span class="ms-emoji">${item.emoji}</span> ${item.label}</div>
                <div class="ms-value">${item.value}${item.unit ? ' <span class="unit">' + item.unit + "</span>" : ""}</div>
              </div>
            `;
          });
          statsHtml += `</div>`;
          statsContainer.innerHTML = statsHtml;
        }

        const container = document.getElementById("menstrualList");
        if (!container) return;
        if (pageData.length === 0) {
          container.innerHTML =
            '<div class="empty-state"><span class="empty-emoji">🩸</span>还没有月经记录</div>';
        } else {
          container.innerHTML = pageData
            .map((item) => renderMenstrualCard(item))
            .join("");
          container.querySelectorAll(".toggle-btn").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const card = this.closest(".menstrual-record-card");
              const details = card.querySelector(".daily-details");
              const isOpen = details.style.display === "block";
              details.style.display = isOpen ? "none" : "block";
              this.textContent = isOpen ? "👇 展开" : "👆 折叠";
            });
          });
          container.querySelectorAll(".del-btn").forEach((el) => {
            el.addEventListener("click", function (e) {
              e.stopPropagation();
              const id = this.dataset.id;
              if (id && confirm("确定删除吗？")) {
                const card = this.closest(".menstrual-record-card");
                if (card) createDeleteParticles(card);
                data.menstrual = data.menstrual.filter(
                  (item) => item.id !== id,
                );
                saveData();
                setTimeout(() => renderMenstrual(), 300);
              }
            });
          });
          container
            .querySelectorAll(".menstrual-record-card")
            .forEach((card) => {
              setupDragDrop(card);
              setupLongPress(card, function (target) {
                const id = target.dataset.id;
                const item = data.menstrual.find((d) => d.id === id);
                if (item) showMenstrualForm(item);
              });
              card.addEventListener("click", function (e) {
                if (
                  e.target.closest(".del-btn") ||
                  e.target.closest(".toggle-btn")
                )
                  return;
                const id = this.dataset.id;
                const item = data.menstrual.find((d) => d.id === id);
                if (item) showMenstrualForm(item);
              });
            });
          setupDragAndDrop(container);
        }

        renderPagination(
          "menstrualPagination",
          "menstrualPageInfo",
          "menstrualPrev",
          "menstrualNext",
          menstrualPageNum,
          totalPages,
        );
        document.getElementById("menstrualPrev").onclick = function () {
          if (menstrualPageNum > 1) {
            menstrualPageNum--;
            renderMenstrual();
          }
        };
        document.getElementById("menstrualNext").onclick = function () {
          if (menstrualPageNum < totalPages) {
            menstrualPageNum++;
            renderMenstrual();
          }
        };
      }

      function renderMenstrualCard(item) {
        const start = new Date(item.startDate);
        const days = item.days || item.dayDetails?.length || 1;
        const endDate = addDays(item.startDate, days - 1);
        const dateRange =
          formatDateNoPad(item.startDate) +
          " ~ " +
          formatDateNoPad(endDate) +
          "（" +
          days +
          "天）";
        const details = item.dayDetails || [];
        let flowCount = {},
          symptomCount = {};
        let dailyDetailsHtml = "";
        details.forEach((d, idx) => {
          const flow = d.flow || "中量";
          flowCount[flow] = (flowCount[flow] || 0) + 1;
          (d.symptoms || []).forEach((s) => {
            if (s !== "无") symptomCount[s] = (symptomCount[s] || 0) + 1;
          });
          const daySymptoms = (d.symptoms || [])
            .filter((s) => s !== "无")
            .map((s) => getSymptomEmoji(s) + s)
            .join(" ");
          const flowEmoji = getFlowEmoji(flow);
          dailyDetailsHtml += `
            <div class="day-row">
              <span class="day-label">Day ${idx + 1}</span>
              <span class="flow-part">${flowEmoji} ${flow}</span>
              <span class="symptom-part">${daySymptoms || "✅ 无"}</span>
            </div>
          `;
        });
        let avgFlow = "中量";
        if (Object.keys(flowCount).length > 0) {
          avgFlow = Object.keys(flowCount).reduce((a, b) =>
            flowCount[a] > flowCount[b] ? a : b,
          );
        }
        const avgFlowEmoji = getFlowEmoji(avgFlow);
        let symptomStr = Object.keys(symptomCount)
          .map((s) => `${getSymptomEmoji(s)} ${s} x${symptomCount[s]}天`)
          .join(" ");
        if (!symptomStr) symptomStr = "✅ 无症状";
        return `
          <div class="menstrual-record-card" draggable="true" data-id="${item.id}">
            <div class="record-summary"><span class="date-range">${dateRange}</span><button class="del-btn" data-id="${item.id}">❌</button></div>
            <div class="record-body">
              <div class="flow-info">🌊 平均流量：${avgFlowEmoji} ${avgFlow}</div>
              <div class="symptom-info">${symptomStr}</div>
              <div class="daily-details">${dailyDetailsHtml}</div>
              <button class="toggle-btn">👇 展开</button>
            </div>
          </div>
        `;
      }

      let menstrualEditId = null;

      function showMenstrualForm(editItem) {
        const isEdit = !!editItem;
        menstrualEditId = isEdit ? editItem.id : null;
        const item = isEdit ? editItem : null;
        const startDate = isEdit ? item.startDate : todayStr();
        const days = isEdit ? item.days || item.dayDetails?.length || 1 : 3;
        const dayDetails = isEdit ? item.dayDetails || [] : [];
        while (dayDetails.length < days)
          dayDetails.push({ flow: "中量", symptoms: ["无"] });
        document.getElementById("menstrualFormTitle").textContent = isEdit
          ? "编辑月经记录"
          : "月经记录";

        const flowOptions = ["🩸少量", "🩸🩸中量", "🩸🩸🩸大量"];
        const symptomOptions = [
          "😌无",
          "😣腹痛",
          "😮‍💨疲惫",
          "😤情绪波动",
          "🤱乳房肿胀",
          "🤢恶心",
        ];

        let html = `
          <div class="form-group"><label>开始时间</label><input type="date" id="mfStartDate" value="${startDate}" /></div>
          <div class="form-group"><label>持续天数</label><input type="number" id="mfDays" value="${days}" min="1" max="20" /></div>
          <hr class="form-divider" />
          <div style="font-size:14px;font-weight:500;color:var(--text2);margin-bottom:12px;">📓每天症状与流量（点击标签选择，流量单选，症状可多选）</div>
          <div id="mfDayCards"></div>
          ${isEdit ? `<div class="btn-row"><button class="btn-primary" id="mfSave">💾 更新</button><button class="btn-danger" id="mfDelete">🗑 删除</button></div>` : `<button class="btn-primary" id="mfSave">💾 保存</button>`}
        `;
        document.getElementById("menstrualFormBody").innerHTML = html;
        document.getElementById("pageMenstrual").classList.remove("active");
        document.getElementById("pageMenstrualForm").classList.add("active");
        navHistory.push("pageMenstrualForm");
        if (navHistory.length > 20) navHistory.shift();

        function renderDayCards() {
          const daysVal =
            parseInt(document.getElementById("mfDays").value) || 1;
          const container = document.getElementById("mfDayCards");
          const currentDetails = [];
          const existingCards = container.querySelectorAll(
            ".menstrual-day-card",
          );
          existingCards.forEach((card, idx) => {
            const flow =
              card.querySelector(".flow-opt.active")?.dataset.value || "中量";
            const symptoms = [];
            card
              .querySelectorAll(".symptom-opt.active")
              .forEach((el) => symptoms.push(el.dataset.value));
            if (symptoms.length === 0) symptoms.push("无");
            currentDetails[idx] = { flow, symptoms };
          });
          while (currentDetails.length < daysVal)
            currentDetails.push({ flow: "中量", symptoms: ["无"] });
          const finalDetails = currentDetails.slice(0, daysVal);

          let cardsHtml = "";
          finalDetails.forEach((d, idx) => {
            const dayNum = idx + 1;
            const flow = d.flow || "中量";
            const symptoms = d.symptoms || ["无"];
            cardsHtml += `
                <div class="menstrual-day-card" data-day="${idx}">
                  <div class="day-title">Day${dayNum}</div>
                  <div class="section-label">流量</div>
                  <div class="flow-options">
                    ${flowOptions.map((f) => `<span class="flow-opt ${flow === f ? "active" : ""}" data-value="${f}"><span></span> ${f}</span>`).join("")}
                  </div>
                  <div class="section-label" style="margin-top:8px;">症状</div>
                  <div class="symptom-options">
                    ${symptomOptions.map((s) => `<span class="symptom-opt ${symptoms.includes(s) ? "active" : ""}" data-value="${s}"><span></span> ${s}</span>`).join("")}
                  </div>
                </div>
              `;
          });
          container.innerHTML = cardsHtml;

          container.querySelectorAll(".menstrual-day-card").forEach((card) => {
            card.querySelectorAll(".flow-opt").forEach((opt) => {
              opt.addEventListener("click", function (e) {
                e.stopPropagation();
                const parent = this.closest(".flow-options");
                parent
                  .querySelectorAll(".flow-opt")
                  .forEach((o) => o.classList.remove("active"));
                this.classList.add("active");
              });
            });
            card.querySelectorAll(".symptom-opt").forEach((opt) => {
              opt.addEventListener("click", function (e) {
                e.stopPropagation();
                const isNone = this.dataset.value === "无";
                const parent = this.closest(".symptom-options");
                if (isNone) {
                  parent
                    .querySelectorAll(".symptom-opt")
                    .forEach((o) => o.classList.remove("active"));
                  this.classList.add("active");
                } else {
                  const noneOpt = parent.querySelector(
                    '.symptom-opt[data-value="无"]',
                  );
                  if (noneOpt) noneOpt.classList.remove("active");
                  this.classList.toggle("active");
                }
              });
            });
          });
        }

        renderDayCards();
        document
          .getElementById("mfDays")
          .addEventListener("change", renderDayCards);
        document
          .getElementById("mfDays")
          .addEventListener("input", renderDayCards);

        document
          .getElementById("mfSave")
          .addEventListener("click", function () {
            const startDateVal = document.getElementById("mfStartDate").value;
            const daysVal =
              parseInt(document.getElementById("mfDays").value) || 1;
            const dayDetails = [];
            document.querySelectorAll(".menstrual-day-card").forEach((card) => {
              const flow =
                card.querySelector(".flow-opt.active")?.dataset.value || "中量";
              const symptoms = [];
              card
                .querySelectorAll(".symptom-opt.active")
                .forEach((el) => symptoms.push(el.dataset.value));
              if (symptoms.length === 0) symptoms.push("无");
              if (symptoms.includes("无"))
                dayDetails.push({ flow, symptoms: ["无"] });
              else dayDetails.push({ flow, symptoms });
            });
            if (!startDateVal) {
              alert("请选择开始日期");
              return;
            }
            if (dayDetails.length !== daysVal) {
              alert("请确保每天的流量和症状都已选择");
              return;
            }
            const recordData = {
              id: isEdit ? menstrualEditId : genId(),
              startDate: startDateVal,
              days: daysVal,
              dayDetails: dayDetails,
              createdAt: isEdit
                ? item?.createdAt || new Date().toISOString()
                : new Date().toISOString(),
            };
            if (isEdit) {
              const idx = data.menstrual.findIndex(
                (d) => d.id === menstrualEditId,
              );
              if (idx !== -1) {
                data.menstrual[idx] = { ...data.menstrual[idx], ...recordData };
                saveData();
                goBack();
                renderMenstrual();
              }
            } else {
              data.menstrual.push(recordData);
              data.menstrual.sort(
                (a, b) => new Date(a.startDate) - new Date(b.startDate),
              );
              saveData();
              goBack();
              renderMenstrual();
            }
          });

        const delBtn = document.getElementById("mfDelete");
        if (delBtn) {
          delBtn.addEventListener("click", function () {
            if (confirm("确定删除吗？")) {
              data.menstrual = data.menstrual.filter(
                (d) => d.id !== menstrualEditId,
              );
              saveData();
              goBack();
              renderMenstrual();
            }
          });
        }
      }
      document
        .getElementById("addMenstrualBtn")
        .addEventListener("click", () => showMenstrualForm(null));
      document
        .getElementById("menstrualFormBack")
        .addEventListener("click", goBack);

      // ============================================================
      // 分页
      // ============================================================
      function renderPagination(
        containerId,
        infoId,
        prevId,
        nextId,
        currentPage,
        totalPages,
      ) {
        const info = document.getElementById(infoId);
        const prev = document.getElementById(prevId);
        const next = document.getElementById(nextId);
        if (info)
          info.textContent = currentPage + " / " + Math.max(1, totalPages);
        if (prev) prev.disabled = currentPage <= 1;
        if (next) next.disabled = currentPage >= totalPages;
      }

        document.getElementById("anniversaryFormTitle").textContent = isEdit
          ? "编辑纪念日"

      // ============================================================
      // 爱情树 — 重新设计，每日浇水施肥次数限制
      // ============================================================
      function checkTreeLevelUp() {
        let tree = data.love.loveTree;
        while (tree.exp >= tree.level * 15) {
          tree.exp -= tree.level * 15;
          tree.level++;
        }
        saveData();
      }

      function addTreeExp(amount, action) {
        const tree = data.love.loveTree;
        const today = todayStr();
        // 每日重置浇水施肥次数
        if (tree.lastWaterDate !== today) {
          tree.waterCount = 0;
          tree.lastWaterDate = today;
        }
        // 每天最多浇水3次，施肥2次
        let maxTimes = 3;
        if (action === "water") maxTimes = 3;
        else if (action === "fertilize") maxTimes = 2;
        else {
          // 其他操作如记录快乐等，无限制
          tree.exp += amount;
          checkTreeLevelUp();
          renderTree();
          if (document.getElementById("pageLove").classList.contains("active"))
            renderLove();
          return;
        }

        if (tree.waterCount >= maxTimes) {
          showToast(
            `⏰ 今天已经${action === "water" ? "浇水" : "施肥"}${tree.waterCount}次了，明天再来吧！`,
          );
          return;
        }
        tree.exp += amount;
        tree.waterCount++;
        checkTreeLevelUp();
        renderTree();
        if (document.getElementById("pageLove").classList.contains("active"))
          renderLove();
        saveData();
      }

      function renderTree() {
        const tree = data.love.loveTree || {
          level: 1,
          exp: 0,
          waterCount: 0,
          lastWaterDate: "",
        };
        const expNeeded = tree.level * 15;
        const progress = Math.min(
          100,
          Math.round((tree.exp / expNeeded) * 100),
        );
        const emojis = [
          "🌰",
          "🌱",
          "🌿",
          "🌲",
          "🌳",
          "🌴",
          "🎄",
          "🌺",
          "🌸",
          "🌹",
        ];
        const emoji =
          emojis[Math.min(tree.level - 1, emojis.length - 1)] || "🌳";
        const container = document.getElementById("treeContent");
        const name = data.love.myName || "我";
        const herName = data.love.herName || "她";
        const today = todayStr();
        const isSameDay = tree.lastWaterDate === today;
        const waterRemain = isSameDay
          ? Math.max(0, 3 - (tree.waterCount || 0))
          : 3;
        const fertilizeRemain = isSameDay
          ? Math.max(0, 2 - (tree.waterCount || 0))
          : 2;

        container.innerHTML = `
          <div class="weather-card">
            <div class="card-header">🌳 爱情树</div>
            <div class="card-body" style="text-align:center;padding:20px 16px;">
              <div class="tree-ring" style="--progress: ${progress}%;">
                <div class="tree-inner"><span class="tree-emoji">${emoji}</span></div>
                <span class="tree-level">Lv.${tree.level}</span>
              </div>
              <div style="font-size:16px;font-weight:600;color:var(--text);">${name} + ${herName}</div>
              <div style="font-size:20px;font-weight:700;color:var(--primary);margin-top:2px;">${tree.exp} / ${expNeeded} 经验</div>
              <div style="font-size:13px;color:var(--text2);margin-top:2px;">🌱 升级需要 ${expNeeded} 经验</div>
              <div class="tree-action-row">
                <button class="btn-primary" id="treeWaterBtn" ${waterRemain <= 0 ? "disabled" : ""}>💧 浇水 +1 <span style="font-size:10px;opacity:0.7;">(${waterRemain}次)</span></button>
                <button class="btn-primary" id="treeFertilizeBtn" ${fertilizeRemain <= 0 ? "disabled" : ""}>🌿 施肥 +3 <span style="font-size:10px;opacity:0.7;">(${fertilizeRemain}次)</span></button>
              </div>
              <div style="font-size:12px;color:var(--text2);margin-top:4px;">⏰ 每日浇水3次 · 施肥2次</div>
              <div class="exp-rules">
                <div class="rule-item"><span class="rule-emoji">😊</span><span class="rule-label">快乐</span><span class="rule-exp">+1</span></div>
                <div class="rule-item"><span class="rule-emoji">✈️</span><span class="rule-label">旅行</span><span class="rule-exp">+1</span></div>
                <div class="rule-item"><span class="rule-emoji">💌</span><span class="rule-label">情书</span><span class="rule-exp">+1</span></div>
                <div class="rule-item"><span class="rule-emoji">✅</span><span class="rule-label">打卡</span><span class="rule-exp">+1</span></div>
                <div class="rule-item"><span class="rule-emoji">🎉</span><span class="rule-label">纪念日</span><span class="rule-exp">+2</span></div>
                <div class="rule-item"><span class="rule-emoji">💧</span><span class="rule-label">浇水</span><span class="rule-exp">+1</span></div>
                <div class="rule-item"><span class="rule-emoji">🌿</span><span class="rule-label">施肥</span><span class="rule-exp">+3</span></div>
              </div>
            </div>
          </div>
        `;

        document
          .getElementById("treeWaterBtn")
          .addEventListener("click", function () {
            addTreeExp(1, "water");
          });
        document
          .getElementById("treeFertilizeBtn")

          });

      function buildChinaMap2(
        chart,
        locationDetails,
        visitedProvinceShort,
        citySet,
      ) {
        if (!chart) return;
        const primary =
          getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#FF6B8A";

        const provinceData = [];
        allProvinceFullNames2.forEach((fullName, index) => {
          const shortName = provinceShortNames2[fullName] || fullName;
          const isVisited = visitedProvinceShort.has(shortName);
          const hoverColor = primary;
          provinceData.push({
            name: fullName,
            value: isVisited ? 1 : 0,
            itemStyle: {
              areaColor: isVisited ? primary : "transparent",
              borderColor: "#999",
              borderWidth: 1.2,
            },
            emphasis: {
              itemStyle: {
                areaColor: hoverColor,
                borderColor: primary,
                borderWidth: 2,
              },
              label: {
                show: true,
                fontSize: 12,
                fontWeight: "bold",
                color: "#333",
              },
            },
          });
        });

        const cityMarkData = [];
        const cityMap = {};
        locationDetails.forEach((item) => {
          if (item.city && !cityMap[item.city]) {
            const coord = cityCoords2[item.city];
            if (coord) {
              cityMap[item.city] = true;
              cityMarkData.push({ name: item.city, value: coord.concat([1]) });
            }
          }
        });

        const option = {
          tooltip: {
            trigger: "item",
            formatter: function (params) {
              if (params.componentType === "series") {
                if (params.seriesName === "城市") return `📍 ${params.name}`;
                if (params.seriesName === "省份") {
                  const shortName =
                    provinceShortNames2[params.name] || params.name;
                  const visited = params.value === 1 ? "💕 去过" : "未去";
                  return `${shortName}<br>${visited}`;
                }
              }
              return "";
            },
          },
          geo: {
            map: "china",
            roam: true,
            zoom: 1.15,
            center: [104, 35],
            itemStyle: { borderColor: "#999", borderWidth: 1.2 },
            emphasis: {},
          },
          series: [
            {
              name: "省份",
              type: "map",
              map: "china",
              geoIndex: 0,
              data: provinceData,
              label: {
                show: true,
                fontSize: 9,
                color: "#555",
                formatter: function (params) {
                  return provinceShortNames2[params.name] || params.name;
                },
              },
              itemStyle: { borderColor: "#999", borderWidth: 1.2 },
              emphasis: {},
            },
            {
              name: "城市",
              type: "scatter",
              coordinateSystem: "geo",
              data: cityMarkData,
              symbol: "pin",
              symbolSize: 24,
              label: {
                show: true,
                formatter: "{b}",
                position: "right",
                fontSize: 9,
                color: "#333",
                fontWeight: 600,
              },
              itemStyle: { color: primary },
              emphasis: {
                label: { show: true, fontSize: 11, fontWeight: "bold" },
                itemStyle: { color: "#FF3B6A" },
              },
            },
          ],
        };

        chart.setOption(option, true);
        chart.resize();

        chart.off("click");
        chart.on("click", function (params) {
          if (
            params.componentType === "series" &&
            params.seriesName === "城市"
          ) {
            const cityName = params.name;
            const details = locationDetails.filter(
              (item) => item.city === cityName,
            );
            if (details.length > 0) {
              let msg = `📍 ${cityName}\n`;
              details.forEach((d) => {
                msg += `${d.type} ${formatDate(d.date)}\n`;
              });
              showToast(msg.replace(/\n/g, " · "));
            }
          } else if (
            params.componentType === "series" &&
            params.seriesName === "省份"
          ) {
            const fullName = params.name;
            const shortName = provinceShortNames2[fullName] || fullName;
            const details = locationDetails.filter((item) => {
              const pFull = shortToFull2[item.province] || item.province;
              return pFull === fullName;
            });
            if (details.length > 0) {
              let msg = `📍 ${shortName}\n`;
              const cities = new Set();
              details.forEach((d) => {
                if (d.city) cities.add(d.city);
              });
              msg += `去过城市：${Array.from(cities).join("、")}`;
              showToast(msg.replace(/\n/g, " · "));
            }
          }
        });
      }

      // ---- renderFootprint 使用 ECharts ----
      function renderFootprint() {
        const container = document.getElementById("footprintContent");
        const happy = data.happy;
        const travel = data.travel;

        const visitedCities = {};
        const allItems = [...happy, ...travel];
        allItems.forEach((item) => {
          if (item.location && item.location !== "无地点") {
            const locs = item.location.split(/[、，,]/).map((s) => s.trim());
            locs.forEach((loc) => {
              if (loc && loc !== "无地点") {
                if (!visitedCities[loc])
                  visitedCities[loc] = { count: 0, items: [] };
                visitedCities[loc].count++;
                visitedCities[loc].items.push(item);
              }
            });
          }
        });

        const visitedProvinces = {};
        Object.keys(visitedCities).forEach((city) => {
          const province = cityProvinceMap[city];
          if (province) {
            if (!visitedProvinces[province]) visitedProvinces[province] = [];
            visitedProvinces[province].push(city);
          }
        });

        const locationDetails = [];
        const visitedProvinceShort = new Set();
        const citySet = new Set();

        Object.keys(visitedCities).forEach((city) => {
          citySet.add(city);
          const province = cityProvinceMap[city];
          if (province) {
            visitedProvinceShort.add(province);
            const items = visitedCities[city].items || [];
            items.forEach((item) => {
              locationDetails.push({
                province: province,
                city: city,
                date: item.startDate,
                type: item.transport ? "✈️" : "😄",
                original: city,
              });
            });
          }
        });

        let listHtml = "";
        const filteredItems = allItems;
        if (filteredItems.length === 0) {
          listHtml =
            '<div class="empty-state"><span class="empty-emoji">👣</span>还没有足迹记录</div>';
        } else {
          const sorted = filteredItems.sort(
            (a, b) => new Date(a.startDate) - new Date(b.startDate),
          );
          sorted.forEach((item) => {
            const type = item.transport ? "✈️ 旅行" : "😊 快乐";
            listHtml += `
              <div class="footprint-item">
                <div class="fp-icon">${item.transport ? "✈️" : "📍"}</div>
                <div class="fp-info"><div class="fp-date">${formatDate(item.startDate)}</div><div class="fp-location">${item.location || "无地点"}</div></div>
                <span class="fp-type">${type}</span>
              </div>
            `;
          });
        }

        const primaryColor =
          getComputedStyle(document.documentElement)
            .getPropertyValue("--primary")
            .trim() || "#ff6b8a";

        container.innerHTML = `
          <div class="weather-card">
            <div class="card-header">👣 足迹</div>
            <div class="card-body">
              <div class="footprint-tabs">
                <span class="ftab active" data-tab="all">全部</span>
                <span class="ftab" data-tab="happy">😊 快乐</span>

      function renderCalendar2(year, month) {
        const daysInMonth = new Date(year, month, 0).getDate();
        const firstDay = new Date(year, month - 1, 1).getDay();
        let grid = "";
        const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
        weekdays.forEach((w) => {
          grid += `<div class="cal-weekday">${w}</div>`;
        });
        for (let i = 0; i < firstDay; i++) {
          grid += `<div class="cal-day"></div>`;
        }

        const events = {};
        data.happy.forEach((h) => {
          const d = formatDateShort(h.startDate);
          if (!events[d]) events[d] = [];
          events[d].push({ type: "happy", data: h });
        });
        data.travel.forEach((t) => {
          const d = formatDateShort(t.startDate);
          if (!events[d]) events[d] = [];
          events[d].push({ type: "travel", data: t });
        });
        data.menstrual.forEach((m) => {
          const d = formatDateShort(m.startDate);
          if (!events[d]) events[d] = [];
          events[d].push({ type: "menstrual", data: m });
        });
        (data.love.anniversaries || []).forEach((a) => {
          const d = formatDateShort(a.date);
          if (!events[d]) events[d] = [];
          events[d].push({ type: "anniversary", data: a });
        });

        for (let i = 1; i <= daysInMonth; i++) {
          const d = new Date(year, month - 1, i);
          const key = formatDateShort(d);
          const has = events[key] || [];
          let bg = "",
            dot = "",
            classStr = "cal-day";
          if (has.length > 0) {
            classStr += " has-event";
            if (has.length === 1) {
              const t = has[0].type;
              if (t === "happy") bg = "background:#34C759;";
              else if (t === "travel") bg = "background:#007AFF;";
              else if (t === "menstrual") bg = "background:#FF6B8A;";
              else if (t === "anniversary") bg = "background:#AF52DE;";
            } else {
              let colors = [];
              has.forEach((e) => {
                if (e.type === "happy") colors.push("#34C759");
                else if (e.type === "travel") colors.push("#007AFF");
                else if (e.type === "menstrual") colors.push("#FF6B8A");
                else if (e.type === "anniversary") colors.push("#AF52DE");
              });
              if (colors.length === 1) bg = `background:${colors[0]};`;
              else if (colors.length === 2)
                bg = `background:linear-gradient(135deg,${colors[0]} 50%,${colors[1]} 50%);`;
              else
                bg = `background:linear-gradient(135deg,${colors.slice(0, 3).join(",")});`;
            }
            dot = `<span class="event-dot"></span>`;
          }
          grid += `<div class="${classStr}" style="${bg}" data-date="${key}" data-day="${i}">${i}${dot}</div>`;
        }

        // 生成详情HTML（完整记录）
        let detailHtml = `<div class="date-detail-popup" id="calDetailContent"><div class="dd-empty">点击日期查看详情</div></div>`;

        const html = `
          <div class="cal-nav"><button id="calPrev2">‹</button><span class="cal-month-year">${year}年 ${month}月</span><button id="calNext2">›</button></div>
          <div class="cal-grid" id="calGrid2">${grid}</div>
          <div id="calDetailContainer2">${detailHtml}</div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text2);">

            <span><span style="display:inline-block;width:12px;height:12px;background:#AF52DE;border-radius:3px;vertical-align:middle;"></span> 纪念日</span>
          </div>
        `;

        showModal("📅 日历", html, () => {
          document.querySelectorAll("#calGrid2 .cal-day").forEach((el) => {
            el.addEventListener("click", function () {
              const dateKey = this.dataset.date;
              const hasEvents = events[dateKey] || [];
              let detail = "";
              if (hasEvents.length === 0) {
                detail = '<div class="dd-empty">这一天没有记录</div>';
              } else {
                detail = hasEvents
                  .map((e) => {
                    const typeMap = {
                      happy: "😊 快乐",
                      travel: "✈️ 旅行",
                      menstrual: "🩸 月经",
                      anniversary: "🎉 纪念日",
                    };
                    let desc = "";
                    if (e.type === "happy") {
                      desc =
                        (e.data.location || "快乐时刻") +
                        (e.data.content ? " · " + e.data.content : "") +
                        (e.data.moods && e.data.moods.length > 0
                          ? " · 心情" + e.data.moods.join(",")
                          : "") +
                        (e.data.tags && e.data.tags.length > 0
                          ? " · " + e.data.tags.join(",")
                          : "");
                    } else if (e.type === "travel") {
                      desc =
                        (e.data.location || "旅行") +
                        (e.data.content ? " · " + e.data.content : "") +
                        (e.data.transport ? " · " + e.data.transport : "");
                    } else if (e.type === "menstrual") {
                      const days = e.data.dayDetails?.length || 1;
                      const flow = e.data.dayDetails?.[0]?.flow || "中量";

                    }
                    return `<div class="dd-item"><span>${typeMap[e.type] || "📌"}</span><span>${desc}</span></div>`;
                  })
                  .join("");
              }
              document.getElementById("calDetailContainer2").innerHTML =
                `<div class="date-detail-popup">${detail}</div>`;
              document
                .querySelectorAll("#calGrid2 .cal-day")
                .forEach((d) => (d.style.outline = "none"));

              this.style.outlineOffset = "-2px";

          document

              兴奋: "😁",
              平静: "😌",
              感动: "😍",
              难过: "😞",
            };
            const moodsStr = r.moods
              .map((m) => `${moodEmojiMap[m] || "😊"} ${m}`)
              .join("  ");
            detailHtml += `<div class="rd-row"><span class="rd-label">😊 心情</span><span class="rd-value">${moodsStr}</span></div>`;
          }
          if (r.tags && r.tags.length > 0) {
            const typeEmojiMap = { 啪啪啪: "❤️", 看电影: "📺", 约会: "🎉" };
            const tagsStr = r.tags
              .map((t) => `${typeEmojiMap[t] || "📌"} ${t}`)
              .join("  ");
            detailHtml += `<div class="rd-row"><span class="rd-label">🏷️ 类型</span><span class="rd-value">${tagsStr}</span></div>`;
          }
          if (r.transport) {
            detailHtml += `<div class="rd-row"><span class="rd-label">🚗 交通</span><span class="rd-value">${r.transport}</span></div>`;
          }
          if (r.content) {
            detailHtml += `<div class="rd-row"><span class="rd-label">📝 备注</span><span class="rd-value">${r.content}</span></div>`;
          }
          if (r.images && r.images.length > 0) {
            detailHtml += `<div class="rd-row"><span class="rd-label">🖼️ 照片</span><span class="rd-value">${r.images.length}张</span></div>`;
          }

          const html = `
          <div class="random-egg-body">
            <span class="random-icon">${bigEmoji}</span>
            <div class="random-title">${randomPhrase}</div>
            <div class="random-detail">${detailHtml}</div>
          </div>
        `;
          showModal("🎲 随机回忆", html);
        });

      // ============================================================
      // 主题
      // ============================================================
      let themePreviewHue = 340,
        themePreviewSat = 70,
        themePreviewLit = 55;

      function showThemeModal() {
        const current = data.theme || { hue: 340, sat: 70, lit: 55 };
        themePreviewHue = current.hue;
        themePreviewSat = current.sat;
        themePreviewLit = current.lit;

        const presets = [
          { hue: 0, sat: 80, lit: 55, label: "红色" },
          { hue: 50, sat: 85, lit: 55, label: "黄色" },
          { hue: 280, sat: 70, lit: 55, label: "紫色" },
          { hue: 340, sat: 70, lit: 55, label: "粉色" },
          { hue: 220, sat: 75, lit: 55, label: "蓝色" },
          { hue: 330, sat: 80, lit: 60, label: "粉红色" },
        ];

        const html = `
          <div style="margin-bottom:8px;font-size:15px;font-weight:600;color:var(--text);">主题切换</div>
          <div class="theme-preset-grid">
            ${presets
              .map((p) => {
                const isActive =
                  p.hue === themePreviewHue &&
                  p.sat === themePreviewSat &&
                  p.lit === themePreviewLit;
                const bg = `hsl(${p.hue}, ${p.sat}%, ${p.lit}%)`;
                return `<button class="theme-preset-btn ${isActive ? "active-theme-btn" : ""}" style="background:${bg};" data-hue="${p.hue}" data-sat="${p.sat}" data-lit="${p.lit}" title="${p.label}"></button>`;
              })
              .join("")}
          </div>
          <div class="theme-hue-wrap">
            <label style="font-size:13px;font-weight:500;color:var(--text2);">自定义色相（0-360）</label>
            <input type="range" id="customHue" min="0" max="360" value="${themePreviewHue}" />
            <div class="theme-preview-block" id="themePreviewBlock" style="background:hsl(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%);"></div>
          </div>
          <button class="btn-primary" id="themeSaveBtn" style="background:hsl(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%); box-shadow: 0 4px 16px hsla(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%, 0.4);">💾 保存主题</button>
        `;

        showModal("🎨 主题切换", html, () => {
          const saveBtn = document.getElementById("themeSaveBtn");
          const presetBtns = document.querySelectorAll(".theme-preset-btn");
          const range = document.getElementById("customHue");
          const previewBlock = document.getElementById("themePreviewBlock");

          function updatePreview(hue, sat, lit) {
            themePreviewHue = hue;
            themePreviewSat = sat;
            themePreviewLit = lit;
            setThemeVariables(hue, sat, lit);
            if (previewBlock)
              previewBlock.style.background = `hsl(${hue}, ${sat}%, ${lit}%)`;
            if (saveBtn) {
              saveBtn.style.background = `hsl(${hue}, ${sat}%, ${lit}%)`;
              saveBtn.style.boxShadow = `0 4px 16px hsla(${hue}, ${sat}%, ${lit}%, 0.4)`;
            }
            presetBtns.forEach((btn) => {
              const bh = parseInt(btn.dataset.hue);
              const bs = parseInt(btn.dataset.sat);
              const bl = parseInt(btn.dataset.lit);
              btn.classList.toggle(
                "active-theme-btn",
                bh === hue && bs === sat && bl === lit,
              );
            });
            if (range) range.value = hue;
          }

          presetBtns.forEach((btn) => {
            btn.addEventListener("click", function () {
              const h = parseInt(this.dataset.hue);
              const s = parseInt(this.dataset.sat);
              const l = parseInt(this.dataset.lit);
              updatePreview(h, s, l);
            });
          });
          if (range) {
            range.addEventListener("input", function () {
              const h = parseInt(this.value);
              updatePreview(h, themePreviewSat, themePreviewLit);
            });
          }
          if (saveBtn) {
            saveBtn.addEventListener("click", function () {
              const h = Math.min(
                360,
                Math.max(0, parseInt(range ? range.value : themePreviewHue)),
              );
              applyTheme(h, themePreviewSat, themePreviewLit);
              hideModal();
            });
          }
          updatePreview(themePreviewHue, themePreviewSat, themePreviewLit);
        });
      }
      document
        .getElementById("themeBtn")
        .addEventListener("click", showThemeModal);

      // ============================================================
      // 搜索
      // ============================================================
      function setupSearch(inputId, btnId, dataList, renderFn) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        if (!input || !btn) return;
        const doSearch = () => {
          const q = input.value.trim().toLowerCase();
          if (!q) {
            renderFn(dataList);
            return;
          }
          const filtered = dataList.filter((item) =>
            JSON.stringify(item).toLowerCase().includes(q),
          );
          renderFn(filtered);
        };
        btn.addEventListener("click", doSearch);
        input.addEventListener("input", doSearch);
      }
      setupSearch(
        "searchHappyInput",
        "searchHappyBtn",
        data.happy,
        (filtered) => {
          const cp = happyPageNum;
          renderHappy(filtered);
          happyPageNum = cp;
        },
      );
      setupSearch(
        "searchTravelInput",
        "searchTravelBtn",
        data.travel,
        (filtered) => {
          const cp = travelPageNum;
          renderTravel(filtered);
          travelPageNum = cp;
        },
      );
      setupSearch(
        "searchMenstrualInput",
        "searchMenstrualBtn",
        data.menstrual,
        (filtered) => {
          const cp = menstrualPageNum;
          renderMenstrual(filtered);
          menstrualPageNum = cp;
        },
      );

      // ============================================================
      // 图片查看器
      // ============================================================
      let viewerImages = [],
        viewerIndex = 0;
      document
        .getElementById("viewerClose")
        .addEventListener("click", () =>
          document.getElementById("imageViewer").classList.remove("show"),
        );
      document
        .getElementById("viewerPrev")
        .addEventListener("click", function () {
          if (viewerIndex > 0) {
            viewerIndex--;
            document.getElementById("viewerImg").src =
              viewerImages[viewerIndex];
          }
        });
      document
        .getElementById("viewerNext")
        .addEventListener("click", function () {
          if (viewerIndex < viewerImages.length - 1) {
            viewerIndex++;
            document.getElementById("viewerImg").src =
              viewerImages[viewerIndex];
          }
        });
      document
        .getElementById("imageViewer")
        .addEventListener("click", function (e) {
          if (e.target === this) this.classList.remove("show");
        });

      // ============================================================
      // 一键清除数据
      // ============================================================
      function init() {
        loadTheme();
        updateAchievements();

        document
          .getElementById("clearDataBtn")
          .addEventListener("click", function () {
            if (
              confirm("⚠️ 确定要清除所有数据吗？此操作不可撤销！") &&
              confirm("再次确认：删除所有本地数据？")
            ) {
              try {
                localStorage.removeItem(STORAGE_KEY);
                alert("✅ 数据已清除，页面即将刷新。");
                location.reload();
              } catch (e) {
                alert("清除数据失败，请稍后重试。");
              }
            }
          });

        document
          .querySelectorAll(".page-container, .form-page")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById("pageLove").classList.add("active");
        navHistory = ["pageLove"];

        renderLove();
        renderHappy();
        renderTravel();
        renderOverview();
        renderMenstrual();
        renderAnniversary();
        renderFight();
        renderBreakup();
        renderLetter();
        renderTree();
        renderChallenge();
        renderFootprint();
        renderYearlyReport();
        renderArchive();
        setInterval(saveData, 30000);
        console.log("💕 Love·轨迹 已启动 (完整优化版)");
        console.log("✅ 随机回忆大emoji每次不同，短句随机");
        console.log("✅ 日历正方形格子，记录完整");
        console.log("✅ 爱情树重新设计，浇水施肥每日次数限制");
        console.log("✅ 所有页面右滑返回");
        console.log("✅ 恋爱档案重新布局");
        console.log("✅ 成就墙预设成就");
        console.log("✅ 总览卡片右对齐补齐");
        console.log("✅ 所有卡片拖拽排序 + 长按操作");
        console.log("✅ 地图悬停用主题色，图例重设计");
        console.log("✅ 彩蛋每次不同，粒子点击知道啦后触发");
      }

      document.addEventListener("DOMContentLoaded", init);
      if (window.navigator.standalone) {
        document.body.style.overflow = "hidden";
        document.body.style.height = "100vh";
      }
      console.log("✅ 加载完成");
    </script>
  </body>
