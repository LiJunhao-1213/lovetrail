        const d = r
          ? { ...r }
          : {
              date: today(),
              place: "",
              from: "",
              to: "",
              days: 1,
              text: "",
              imgs: [],
              tags: [],
              color: DB.settings.defaultCardColor || "",
              startDate: today(),
              endDate: today(),
            };
        if (!d.startDate) d.startDate = d.date || today();
        if (!d.endDate) d.endDate = addDays(d.startDate, (d.days || 1) - 1);
        d.imgs = d.imgs || [];
        d.tags = d.tags || [];
        d.color = d.color || "";
        const title =
          (id ? "编辑" : "新增") + (type === "happy" ? "快乐记录" : "旅行记录");
        openSub(title, (el) => {
          const imgs = d.imgs;
          const updateEndDate = () => {
            const start = $("#reStartDate").value;
            const days = +$("#reDays").value || 1;
            if (start) {
              const end = addDays(start, days - 1);
              $("#reEndDate").value = end;
              d.endDate = end;
            }
          };
          const fields = [
            ["reDate", "date", d.date],
            ["reStartDate", "date", d.startDate],
            ["reEndDate", "date", d.endDate],
            ["reDays", "number", d.days],
            ["rePlace", "text", d.place],
            ["reFrom", "text", d.from],
            ["reTo", "text", d.to],
            ["reText", "textarea", d.text],
          ];
          fields.forEach(([fid, type, val]) => {
            const i = el.querySelector("#" + fid);
            if (!i) return;
            if (type === "textarea") i.value = val;
            else i.value = val;
            i.addEventListener("input", () => {
              if (fid === "reStartDate" || fid === "reDays") updateEndDate();
              d[fid.replace("re", "").toLowerCase()] = i.value;
            });
            i.addEventListener("change", () => {
              if (fid === "reStartDate" || fid === "reDays") updateEndDate();
              d[fid.replace("re", "").toLowerCase()] = i.value;
            });
          });
          const tplChips =
            type === "happy" && DB.templates.length
              ? `<div class="field-l">使用模板</div><div class="sym-grid" id="tplChips">${DB.templates
                  .map(
                    (t) =>
                      `<button class="chip" data-tp="${t.id}">${esc(t.name)}</button>`,
                  )
                  .join("")}</div>`
              : "";
          el.innerHTML = `<div class="card">${tplChips}
          <div class="field"><div class="field-l">日期 *</div>
            <input class="input" type="date" id="reDate" value="${d.date}"></div>
          <div class="field"><div class="field-l">开始日期</div>
            <input class="input" type="date" id="reStartDate" value="${d.startDate}"></div>
          <div class="field"><div class="field-l">结束日期（自动计算）</div>
            <input class="input" type="date" id="reEndDate" value="${d.endDate}" readonly style="background:#e8e8ea;"></div>
          <div class="field"><div class="field-l">持续天数</div>
            <input class="input" type="number" min="1" id="reDays" value="${d.days || 1}"></div>
          ${
            type === "happy"
              ? `
            <div class="field"><div class="field-l">地点</div><input class="input" id="rePlace" value="${esc(d.place || "")}" placeholder="在哪里？"></div>
            <div class="field"><div class="field-l">事件标签</div><div class="sym-grid" id="reTags">
              ${DB.tags.happy.map((t) => `<button class="chip ${d.tags && d.tags.includes(t) ? "on" : ""}" data-tg="${esc(t)}">${esc(t)}</button>`).join("")}
              <button class="chip" id="reAddTag">＋ 新标签</button></div></div>`
              : `
            <div class="field"><div class="field-l">出发地</div><input class="input" id="reFrom" value="${esc(d.from || "")}" placeholder="如：上海"></div>
            <div class="field"><div class="field-l">目的地 *</div><input class="input" id="reTo" value="${esc(d.to || "")}" placeholder="如：成都"></div>`
          }
          <div class="field"><div class="field-l">${type === "travel" ? "旅途文案" : "备注"}</div>
            <textarea class="input" id="reText" rows="3" placeholder="${type === "travel" ? "这次旅途的故事…" : "记录这一刻…"}">${esc(d.text || "")}</textarea></div>
          <div class="field"><div class="field-l">图片（${imgs.length}张，不限数量）</div>
            <div class="sym-grid" id="reImgs">${imgs
              .map(
                (im, i) =>
                  `<div style="position:relative;width:86px"><img src="${im}" style="width:86px;height:86px;object-fit:cover;border-radius:8px">
              <button data-rm="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px">✕</button></div>`,
              )
              .join("")}
            <button id="reAddImg" style="width:86px;height:86px;border-radius:8px;border:1px dashed #C9CDD4;color:var(--sub);font-size:24px">＋</button></div></div>
          <div class="field"><div class="field-l">卡片颜色</div><div class="sym-grid" id="reColors">
            ${CARD_COLORS.map((c, i) => `<button data-c="${i}" style="width:34px;height:34px;border-radius:8px;background:${c || "var(--card)"};border:1px solid ${(d.color || "") === c ? "var(--primary)" : "var(--line)"}"></button>`).join("")}</div></div>
          <button class="btn blk" id="reSave">保存</button></div>`;
          let color = d.color || "";
          let tags = new Set(d.tags || []);
          const selClr = () =>
            el
              .querySelectorAll("#reColors button")
              .forEach(
                (b, i) =>
                  (b.style.borderColor =
                    (CARD_COLORS[i] || "") === color
                      ? "var(--primary)"
                      : "var(--line)"),
              );
          el.querySelectorAll("#reColors button").forEach(
            (b, i) =>
              (b.onclick = () => {
                color = CARD_COLORS[i] || "";
                selClr();
              }),
          );
          selClr();
          el.querySelector("#reTags")?.addEventListener("click", (e) => {
            const b = e.target.closest("[data-tg]");
            if (!b) return;
            const t = b.dataset.tg;
            tags.has(t) ? tags.delete(t) : tags.add(t);
            b.classList.toggle("on");
          });
          $("#reAddTag")?.addEventListener("click", () =>
            inputModal(
              "新增标签",
              [{ k: "t", label: "标签名", req: 1 }],
              (v) => {
                if (!DB.tags.happy.includes(v.t)) DB.tags.happy.push(v.t);
                tags.add(v.t);
                save();
                paintSub();
                setTimeout(() => {
                  const c = $(`#reTags [data-tg="${v.t}"]`);
                  c && c.click();
                }, 0);
              },
            ),
          );
          $("#reAddImg").onclick = () =>
            pickImages((arr) => {
              imgs.push(...arr.filter(Boolean));
              paintSub();
            }, true);
          el.querySelectorAll("[data-rm]").forEach(
            (b) =>
              (b.onclick = () => {
                imgs.splice(+b.dataset.rm, 1);
                paintSub();
              }),
          );
          el.querySelectorAll("[data-tp]").forEach(
            (b) =>
              (b.onclick = () => {
                const t = DB.templates.find((x) => x.id === b.dataset.tp);
                if (!t) return;
                tags = new Set(t.tags || []);
                color = t.color || "";
                $("#reText").value = t.text || "";
                selClr();
                el.querySelectorAll("#reTags [data-tg]").forEach((c) =>
                  c.classList.toggle("on", tags.has(c.dataset.tg)),
                );
                toast("已套用模板：" + t.name);
              }),
          );
          $("#reSave").onclick = () => {
            const date = $("#reDate").value;
            if (!date) {
              toast("请选择日期");
              return;
            }
            const startDate = $("#reStartDate").value;
            const days = +$("#reDays").value || 1;
            if (!startDate) {
              toast("请选择开始日期");
              return;
            }
            const endDate = addDays(startDate, days - 1);
            let obj;
            if (type === "happy") {
              const text = $("#reText").value.trim(),
                place = $("#rePlace").value.trim();
              if (!text && !d.imgs.length && !place) {
                toast("至少填写文字、地点或图片");
                return;
              }
              obj = {
                date,
                startDate,
                endDate,
                days,
                place,
                text,
                tags: [...tags],
                imgs: [...d.imgs],
                color,
              };
            } else {
              const to = $("#reTo").value.trim();
              if (!to) {
                toast("请填写目的地");
                return;
              }
              obj = {
                date,
                startDate,
                endDate,
                days,
                from: $("#reFrom").value.trim(),
                to,
                text: $("#reText").value.trim(),
                imgs: [...d.imgs],
                color,
              };
            }
            if (r) {
              Object.assign(r, obj);
              r.updatedAt = new Date().toISOString();
            } else
              DB[type].push({
                id: uid(),
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                ...obj,
              });
            save();
            checkAchAll();
            toast("已保存");
            closeSub();
          };
          updateEndDate();
        });
      }

      /* 记录详情 */
      function recDetail(type, id) {
        openSub("记录详情", (el) => {
          const r = DB[type].find((x) => x.id === id);
          if (!r) {
            closeSub();
            return;
          }
          const nAlbums = DB.albums.filter((a) =>
            (a.items || []).some((it) => (r.imgs || []).includes(it.img)),
          ).length;
          const infoRows = [
            {
              icon: "🔖",
              label: "类型",
              value: type === "travel" ? "🧳 旅行足迹" : "💖 快乐日常",
            },
          ];
          if (type === "travel") {
            infoRows.push({
              icon: "🛫",
              label: "出发地",
              value: r.from || "—",
            });
            infoRows.push({ icon: "📍", label: "目的地", value: r.to || "—" });
          } else if (r.place) {
            infoRows.push({ icon: "📍", label: "地点", value: r.place });
          }
          infoRows.push(
            {
              icon: "📅",
              label: "日期",
              value: fmtCN(r.date) + " " + weekday(r.date),
            },
            {
              icon: "⏳",
              label: "持续",
              value:
                (r.days || 1) +
                " 天 (" +
                fmtCN(r.startDate || r.date) +
                " → " +
                fmtCN(r.endDate || r.date) +
                ")",
            },
            { icon: "🖼️", label: "图片", value: (r.imgs || []).length + " 张" },
            {
              icon: "🏷️",
              label: "标签",
              value: (r.tags || []).length ? r.tags.map(esc).join("、") : "—",
            },
            {
              icon: "📷",
              label: "所属相册",
              value: nAlbums ? nAlbums + " 个相册" : "未收录",
            },
          );
          const rowsHtml = infoRows
            .map(
              (row, idx) =>
                `<div class="detail-info-row" style="${idx === 0 ? "padding-top:0" : ""}">
            <span class="di-icon">${row.icon}</span>
            <span class="di-label">${row.label}</span>
            <span class="di-value">${row.value}</span>
          </div>`,
            )
            .join("");
          el.innerHTML = `
          <div class="card" style="padding:18px;text-align:center">
            <div style="width:64px;height:64px;margin:0 auto;border-radius:20px;background:var(--primary-weak);display:flex;align-items:center;justify-content:center;font-size:32px">${type === "travel" ? "🧳" : LOVE_EMOJI}</div>
            <div style="font-size:17px;font-weight:600;margin-top:10px">${type === "travel" ? esc((r.from || "—") + " → " + (r.to || "—")) : esc(r.place || "快乐日常")}</div>
            <div style="font-size:12px;color:var(--sub);margin-top:4px">${fmtCN(r.date)} ${weekday(r.date)}</div>
            ${r.text ? `<div style="font-size:15px;line-height:1.7;margin-top:12px;text-align:left;white-space:pre-wrap">${esc(r.text)}</div>` : ""}
          </div>
          ${
            (r.imgs || []).length
              ? `<div class="card" style="margin-top:12px;padding:12px">
            <div class="sec-hd" style="margin:0 2px 10px"><span class="sec-t">🖼️ 图片 · ${(r.imgs || []).length}张</span>
              <span class="chip" style="height:22px;font-size:11px">${(r.imgs || []).length} 张，可左右切换</span></div>
            <div class="dt-imgs">${r.imgs.map((im, i) => `<img class="dt-img" src="${im}" data-i="${i}" style="border-radius:12px" alt="${i + 1}/${r.imgs.length}">`).join("")}</div></div>`
              : ""
          }
          <div class="card" style="margin-top:12px;padding:6px 16px">${rowsHtml}</div>
          <div style="display:flex;gap:10px;margin-top:14px">
            <button class="btn ghost" style="flex:1" onclick="recEditor('${type}','${id}')">✏️ 编辑</button>
            <button class="btn danger" style="flex:1" onclick="confirmBox('删除这条记录？',()=>{(r.imgs||[]).forEach(removeImgFromAlbums);DB[type]=DB[type].filter(x=>x.id!=='${id}');save();closeSub();toast('已删除')})">🗑 删除</button>
          </div>`;
          el.querySelectorAll(".dt-img").forEach(
            (im) =>
              (im.onclick = () => {
                lightbox(r.imgs, +im.dataset.i, {
                  onDelete: (i) => {
                    removeImgFromAlbums(r.imgs[i]);
                    r.imgs.splice(i, 1);
                    save();
                    paintSub();
                  },
                });
              }),
          );
        });
      }

      function removeImgFromAlbums(img) {
        DB.albums.forEach(
          (a) => (a.items = a.items.filter((it) => it.img !== img)),
        );
      }

      function addToAlbum(r) {
        if (!(r.imgs || []).length) {
          toast("这条记录没有图片");
          return;
        }
        const items = [
          ...DB.albums.map((a) => ({
            name: a.name,
            items: a.items,
            fn: () => {
              r.imgs.forEach((im) =>
                DB.albums
                  .find((x) => x.id === a.id)
                  .items.push({ img: im, rid: r.id }),
              );
              save();
              toast("已加入「" + a.name + "」");
            },
          })),
          {
            name: "＋ 新建相册并加入",
            items: [],
            fn: () => {
              inputModal(
                "新建相册",
                [{ k: "n", label: "相册名称", req: 1 }],
                (v) => {
                  const a = {
                    id: uid(),
                    name: v.n,
                    items: r.imgs.map((im) => ({ img: im, rid: r.id })),
                  };
                  DB.albums.push(a);
                  save();
                  checkAchAll();
                  toast("已创建并加入");
                },
              );
            },
          },
        ];
        sheet({ title: "加入相册", albums: items });
      }

      /* ================================================================
       * 子页：情侣日历
       * ================================================================ */
      let calMonth = (() => {
        const d = new Date();
        return d.getFullYear() + "-" + pad(d.getMonth() + 1);
      })();

      function calendarPage() {
        openSub("情侣日历", (el) => {
          const [y, m] = calMonth.split("-").map(Number);
          const start = new Date(y, m - 1, 1).getDay(),
            dim = new Date(y, m, 0).getDate();
          const C = DB.couple,
            A = periodAnalysis();
          const evs = {};
          C.annivs.forEach((a) => {
            const md = a.date.slice(5);
            const d = y + "-" + md;
            if (d >= y + "-01-01" && d <= y + "-12-31")
              (evs[d] = evs[d] || []).push({
                i: "💝",
                c: "var(--primary)",
                t: a.name,
                cat: "anniv",
              });
          });
          [
            ["me", C.me],
            ["partner", C.partner],
          ].forEach(([k, pp]) => {
            if (pp.birthday) {
              const d = y + "-" + pp.birthday.slice(5);
              (evs[d] = evs[d] || []).push({
                i: "🎂",
                c: "var(--primary)",
                t: (pp.name || "TA") + "的生日",
                cat: "anniv",
              });
            }
          });
          if (C.loveStart) {
            const d = y + "-" + C.loveStart.slice(5);
            (evs[d] = evs[d] || []).push({
              i: "💞",
              c: "var(--primary)",
              t: "恋爱纪念日",
              cat: "anniv",
            });
          }
          const periodSet = new Set();
          A.eps.forEach((e) => {
            let d = e.start;
            while (d <= e.end) {
              if (d.startsWith(calMonth)) {
                periodSet.add(d);
                (evs[d] = evs[d] || []).push({
                  i: "🩸",
                  c: "var(--ok)",
                  t: "经期",
                  cat: "period",
                });
              }
              d = addDays(d, 1);
            }
          });
          const predSet = new Set();
          if (A.next && !A.ongoing) {
            for (let i = 0; i < A.avg; i++) {
              const d = addDays(A.next, i);
              if (d.startsWith(calMonth)) {
                predSet.add(d);
                if (!periodSet.has(d))
                  (evs[d] = evs[d] || []).push({
                    i: "🕊️",
                    c: "var(--ok)",
                    t: "预测经期",
                    cat: "pred",
                  });
              }
            }
          }
          DB.happy.forEach((r) => {
            if (r.date.startsWith(calMonth))
              (evs[r.date] = evs[r.date] || []).push({
                i: "💖",
                c: "var(--primary)",
                t: r.place || r.text?.slice(0, 14) || "快乐日常",
                cat: "happy",
                rid: r.id,
              });
          });
          DB.travel.forEach((r) => {
            if (r.date.startsWith(calMonth))
              (evs[r.date] = evs[r.date] || []).push({
                i: "🧳",
                c: "var(--accent)",
                t: `${r.from || ""}→${r.to || ""}` || "旅行足迹",
                cat: "travel",
                rid: r.id,
              });
          });
          [...new Set(DB.checkin.map((c) => c.date))].forEach((d) => {
            if (d.startsWith(calMonth))
              (evs[d] = evs[d] || []).push({
                i: "✅",
                c: "var(--accent)",
                t: "打卡",
                cat: "checkin",
              });
          });

          let html = `<div class="cal"><div class="cal-hd">
          <button data-p="-1">‹</button><b>${y}年${m}月</b><button data-p="1">›</button></div>
          <div class="cal-wk">${WEEK.map((w) => `<span>${w}</span>`).join("")}</div><div class="cal-g">`;
          for (let i = 0; i < start; i++) html += '<div class="cal-d"></div>';
          for (let d = 1; d <= dim; d++) {
            const ds = `${y}-${pad(m)}-${pad(d)}`;
            const de = evs[ds] || [];
            const catBadge = (() => {
              if (!de.length) return "";
              const cats = new Set(de.map((e) => e.cat));
              const icons = [];
              if (cats.has("period") || cats.has("pred")) icons.push("🩸");
              if (cats.has("happy")) icons.push("💖");
              if (cats.has("travel")) icons.push("🧳");
              if (cats.has("anniv") && !icons.length) icons.push("💝");
              if (cats.has("checkin") && !icons.length) icons.push("✅");
              return `<div class="cat-icons">${icons.join("")}</div>`;
            })();
            html += `<div class="cal-d ${ds === today() ? "today" : ""} ${ds === pdDate ? "sel" : ""}" data-d="${ds}">${d}${catBadge}
            ${
              de.length
                ? `<div class="dots">${de
                    .slice(0, 4)
                    .map((e) => `<i style="background:${e.c}"></i>`)
                    .join("")}</div>`
                : ""
            }</div>`;
          }
          html += `</div>
          <div class="cal-legend">
            <span><i style="background:var(--primary)"></i>快乐</span>
            <span><i style="background:var(--accent)"></i>旅行</span>
            <span><i style="background:var(--ok)"></i>经期/预测</span>
            <span><i style="background:var(--primary)"></i>纪念日/生日</span>
          </div></div>
          <div class="sec" id="calDay" style="margin-top:14px"></div>`;
          el.innerHTML = html;
          const showDay = (ds) => {
            const de = (evs[ds] || []).slice();
            const group = (cat) => de.filter((e) => e.cat === cat);
            const annivs = group("anniv");
            const periods = [...group("period"), ...group("pred")];
            const happy = group("happy");
            const travel = group("travel");
            const checkin = group("checkin");
            const sections = [];
            if (annivs.length)
              sections.push([
                "💝 重要日子",
                annivs.map(
                  (e) =>
                    `<div class="row-line"><span class="row-ic">${e.i}</span><span>${esc(e.t)}</span></div>`,
                ),
              ]);
            if (periods.length)
              sections.push([
                "🩸 经期",
                periods.map(
                  (e) =>
                    `<div class="row-line"><span class="row-ic">${e.i}</span><span>${esc(e.t)}</span></div>`,
                ),
              ]);
            if (happy.length)
              sections.push([
                "💖 快乐",
                happy.map(
                  (e) =>
                    `<div class="row-line clickable" onclick="recDetail('happy','${e.rid}')"><span class="row-ic">${e.i}</span><span style="flex:1;min-width:0">${esc(e.t)}</span><span class="arrow">›</span></div>`,
                ),
              ]);
            if (travel.length)
              sections.push([
                "🧳 旅行",
                travel.map(
                  (e) =>
                    `<div class="row-line clickable" onclick="recDetail('travel','${e.rid}')"><span class="row-ic">${e.i}</span><span style="flex:1;min-width:0">${esc(e.t)}</span><span class="arrow">›</span></div>`,
                ),
              ]);
            if (checkin.length)
              sections.push([
                "✅ 打卡",
                checkin.map(
                  (e) =>
                    `<div class="row-line"><span class="row-ic">${e.i}</span><span>${esc(e.t)}</span></div>`,
                ),
              ]);
            $("#calDay").innerHTML =
              `<div class="sec-hd"><span class="sec-t">${fmtCN(ds)} ${weekday(ds)}</span></div>` +
              (sections.length
                ? sections
                    .map(
                      ([title, rows]) =>
                        `<div style="margin-top:10px"><div class="st-h">${title}</div>

      function albumDetail(id) {
        openSub("相册", (el) => {
          const a = DB.albums.find((x) => x.id === id);
          if (!a) {
            closeSub();
            return;
          }
          const allImgs = [...DB.happy, ...DB.travel].flatMap((r) =>
            (r.imgs || []).map((im) => ({ img: im, rid: r.id })),
          );
          const draw = () => {
            el.innerHTML = `<div class="sec-hd" style="margin-top:8px"><span class="sec-t">${esc(a.name)}</span>
            <span style="font-size:12px;color:var(--sub)">${a.items.length} 张</span></div>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn plain" style="flex:1" id="abAddRec">从记录添加</button>
            <button class="btn ghost" style="flex:1" id="abAddUp">上传图片</button>

          ${a.items.length ? `<div class="abm" style="background:var(--card);box-shadow:var(--shadow)">${a.items.map((it, i) => `<img src="${it.img}" data-i="${i}">`).join("")}</div>` : empty("🖼️", "相册还是空的", "从记录中挑选图片归类到这里", "从记录添加", "albumPick()")}`;
            el.querySelectorAll(".abm img").forEach(
              (im) =>
                (im.onclick = () => {
                  const i = +im.dataset.i;
                  lightbox(
                    a.items.map((x) => x.img),
                    i,
                    {
                      onDelete: (j) => {
                        a.items.splice(j, 1);
                        save();
                        paintSub();
                      },
                    },
                  );
                }),
            );
            $("#abAddUp").onclick = () =>
              pickImages((arr) => {
                arr
                  .filter(Boolean)
                  .forEach((im) => a.items.push({ img: im, rid: "" }));
                save();
                paintSub();
              });
            $("#abDel").onclick = () =>
              confirmBox("删除相册（不影响原始记录）", () => {
                DB.albums = DB.albums.filter((x) => x.id !== id);
                save();
                closeSub();
              });
            window.albumPick = () => {
              const sel = new Set(a.items.map((it) => it.rid + ":" + it.img));
              const m = modal({
                title: "选择图片加入「" + esc(a.name) + "」",
                body: `<div class="abm" id="pkGrid" style="max-height:340px;overflow-y:auto;background:#F5F6F8;border-radius:8px">
                ${allImgs
                  .map(
                    (
                      x,
                    ) => `<div data-k="${x.rid}:${x.img}" style="position:relative;cursor:pointer">
                  <img src="${x.img}" style="width:100%;aspect-ratio:1;object-fit:cover">
                  <span style="position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:${sel.has(x.rid + ":" + x.img) ? "var(--primary)" : "rgba(255,255,255,.7)"};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center">✓</span></div>`,
                  )
                  .join("")}
                ${allImgs.length ? "" : '<div style="padding:30px;text-align:center;color:var(--sub)">暂无可选图片</div>'}</div>`,
                ok: "加入",
                wide: true,
                onOk: () => {
                  m.querySelectorAll("[data-k]").forEach((dv) => {
                    if (dv.style.opacity === "0.4") return;
                  });
                  [...sel].forEach((k) => {
                    const [rid, img] = k.split(":");
                    const im = rid ? img : k.split(":").slice(1).join(":");
                    a.items.push({ img: im, rid });
                  });
                  save();
                  paintSub();
                  toast("已加入 " + sel.size + " 张");
                },
              });
              m.querySelectorAll("#pkGrid [data-k]").forEach(
                (dv) =>
                  (dv.onclick = () => {
                    const k = dv.dataset.k;
                    if (sel.has(k)) {
                      sel.delete(k);
                      dv.style.opacity = "0.4";
                    } else {
                      sel.add(k);
                      dv.style.opacity = "1";
                    }
                    const tick = dv.querySelector("span");
                    tick.style.background = sel.has(k)
                      ? "var(--primary)"
                      : "rgba(255,255,255,.7)";
                  }),
              );
            };
            $("#abAddRec").onclick = albumPick;
          };
          draw();
        });
      }

          <button class="cell" style="width:100%;text-align:left" id="dExp"><span class="ic">📤</span>
            <span class="tt">导出数据（JSON备份）<div class="desc">跨设备迁移前，先在旧设备导出</div></span><span class="arr">›</span></button>
          <button class="cell" style="width:100%;text-align:left" id="dImp"><span class="ic">📥</span>
            <span class="tt">导入数据<div class="desc">支持合并去重，重复记录自动跳过</div></span><span class="arr">›</span></button>
          <button class="cell" style="width:100%;text-align:left" id="dClr"><span class="ic">🗑️</span>
            <span class="tt" style="color:var(--danger);font-weight:500">清空全部数据<div class="desc">不可恢复，请先导出备份</div></span></button></div>
        <div style="font-size:12px;color:var(--sub);margin:14px 4px;line-height:1.7;font-weight:500">
          ⚠️ 清除浏览器缓存、无痕模式或更换设备会导致本地数据丢失，请定期导出备份。</div>`;
          $("#dExp").onclick = () => {
            const blob = new Blob([JSON.stringify(DB)], {
              type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "love_backup_" + today() + ".json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 500);
            toast("已导出备份文件");
          };
          $("#dImp").onclick = () => {
            const inp = document.createElement("input");
            inp.type = "file";
            inp.accept = ".json,application/json";
            inp.onchange = () => {
              const f = inp.files[0];
              if (!f) return;
              const r = new FileReader();
              r.onload = () => {
                try {
                  const src = JSON.parse(r.result);
                  modal({
                    title: "选择导入方式",
                    body: "合并：保留现有数据并去重合并<br>覆盖：用备份数据完全替换",
                    ok: "合并导入",
                    onOk: () => {
                      const n = mergeDB(src);
                      toast("合并完成，新增 " + n + " 条");
                    },
                    cancel: "覆盖导入",
                    okCls: "btn",
                  }).querySelector("[data-x]").onclick = () => {
                    try {
                      localStorage.setItem(KEY, JSON.stringify(src));
                      DB = load();
                      applyTheme();
                      toast("已覆盖导入");
                      closeSub();
                    } catch (e) {
                      toast("导入失败：" + e.message);
                    }
                  };
                } catch (e) {
                  toast("文件解析失败");
                }
              };
              r.readAsText(f);
            };
            inp.click();
          };
          $("#dClr").onclick = () =>
            confirmBox("将清空所有本地数据且不可恢复，确定继续？", () => {
              modal({
                title: "再次确认",
                body: "这是最后一次确认，清空后无法找回。",
                ok: "彻底清空",
                okCls: "btn danger",
                onOk: () => {
                  localStorage.removeItem(KEY);
                  DB = DEF();
                  save();
                  applyTheme();
                  switchTab("home");
                  toast("已清空");
                },
              });
            });
        });
      }

      /* ================================================================
       * 经期标签管理
       * ================================================================ */
      function rPeriodTags(el) {
        const P = DB.period;
        const draw = () => {
          const one = (label, arr, key) =>
            `<div class="card" style="margin-top:12px">
          <div class="sec-t" style="font-size:14px;font-weight:500">${label}</div>
          <div class="sym-grid">${arr
            .map(
              (s, i) =>
                `<span class="chip">${esc(s)}
            <button data-up="${key}:${i}" style="font-size:11px;color:var(--sub)">↑</button>
            <span class="x" data-px="${key}:${i}">✕</span></span>`,
            )
            .join("")}</div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <input class="input" data-pin="${key}" placeholder="新增${label.replace("档位", "")}标签">
            <button class="btn" data-padd="${key}" style="flex:none">添加</button></div></div>`;
          el.innerHTML = `<div style="margin-top:8px">${one("流量档位", P.flow, "flow")}${one("身体症状", P.symptoms, "symptoms")}${one("心情标签", P.moods, "moods")}</div>`;
          el.querySelectorAll("[data-px]").forEach(
            (x) =>
              (x.onclick = () => {
                const [k, i] = x.dataset.px.split(":");
                P[k].splice(+i, 1);
                save();
                draw();
              }),
          );
          el.querySelectorAll("[data-up]").forEach(
            (b) =>
              (b.onclick = () => {
                const [k, i] = b.dataset.up.split(":");
                const a = P[k];
                if (i > 0) {
                  [a[i - 1], a[i]] = [a[i], a[i - 1]];
                  save();
                  draw();
                }
              }),
          );
          el.querySelectorAll("[data-padd]").forEach(
            (b) =>
              (b.onclick = () => {
                const k = b.dataset.padd,
                  inp = el.querySelector(`[data-pin="${k}"]`);
                const v = inp.value.trim();
                if (!v) return;
                if (P[k].includes(v)) return toast("标签已存在");
                P[k].push(v);
                save();
                draw();
              }),
          );
        };
        draw();
      }

      function prj(lng, lat) {
        return [
          ((lng - 73) / (135 - 73)) * 340 + 20,
          ((54 - lat) / (54 - 18)) * 260 + 20,
        ];
      }

      function mapCard() {
        const cities = {};
        DB.travel.forEach((t) => {
          if (t.to) cities[t.to] = (cities[t.to] || 0) + 1;
        });
        const totalD = DB.travel.reduce((a, b) => a + (b.days || 1), 0);
        let dots = "";
        for (const city in cities) {
          let xy = CITY_COORDS[city];
          if (!xy) {
            let h = 0;
            for (const ch of city) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            xy = [73 + (h % 60), 20 + (h % 32)];
          }
          const [x, y] = prj(xy[0], xy[1]);
          dots += `<g><circle class="mp-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${4 + Math.min(cities[city], 3)}">
          <title>${esc(city)} · ${cities[city]}次</title></circle>
          <text class="mp-lb" x="${x.toFixed(1)}" y="${(y + 11).toFixed(1)}">${esc(city)}</text></g>`;
        }
        const poly = CN_OUTLINE.map((p) =>
          prj(p[0], p[1])
            .map((v) => v.toFixed(1))
            .join(","),
        ).join(" ");
        return `<div class="sec card"><div class="sec-hd"><span class="sec-t">🗺️ 情侣旅行足迹</span>
        <span style="font-size:11px;color:var(--sub);font-weight:500">离线静态点位图</span></div>
        <svg class="map-svg" viewBox="0 0 380 300">
          <polygon points="${poly}" fill="#EFF1F3" stroke="#DDE0E4" stroke-width="1"/>
          ${dots}</svg>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center">
          <div><div style="font-size:18px;font-weight:700">${DB.travel.length}</div><div style="font-size:11px;color:var(--sub);font-weight:500">旅行次数</div></div>
          <div><div style="font-size:18px;font-weight:700">${totalD}</div><div style="font-size:11px;color:var(--sub);font-weight:500">旅行天数</div></div>
          <div><div style="font-size:18px;font-weight:700">${Object.keys(cities).length}</div><div style="font-size:11px;color:var(--sub);font-weight:500">到访城市</div></div></div>
        ${DB.travel.length ? "" : '<div style="text-align:center;font-size:12px;color:var(--sub);margin-top:8px;font-weight:500">添加旅行记录，自动点亮城市点位 ✈️</div>'}</div>`;
      }

      function drawReport(cv, y) {
        const ctx = cv.getContext("2d");
        const W = 750,
          H = 1200;
        const css = getComputedStyle(document.documentElement);
        const pri = css.getPropertyValue("--primary").trim(),
          sub = "#8A8F99",
          txt = "#22242A";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = pri;
        ctx.fillRect(0, 0, W, 10);
        ctx.textAlign = "center";
        ctx.fillStyle = txt;
        ctx.font = "700 52px PingFang SC,sans-serif";
        const C = DB.couple;
        ctx.fillText(
          `${C.me.name || "我"} & ${C.paired ? C.partner.name : "❤"}`,
          W / 2,
          150,
        );
        ctx.fillStyle = sub;
        ctx.font = "26px PingFang SC,sans-serif";
        ctx.fillText(`${y} 年度恋爱报告`, W / 2, 200);
        ctx.fillText(
          C.loveStart
            ? `${fmtCN(C.loveStart)} 在一起 · ${loveDays()} 天`
            : "未设置恋爱起始日",
          W / 2,
          240,
        );
        const yf = (d) => d.startsWith(y + "-");
        const nHappy = DB.happy.filter((r) => yf(r.date)).length,
          nTrv = DB.travel.filter((r) => yf(r.date)).length,
          nCity = new Set(DB.travel.filter((r) => yf(r.date)).map((r) => r.to))
            .size,
          nCk = new Set(DB.checkin.filter((c) => yf(c.date)).map((c) => c.date))
            .size;
        const cards = [
          ["💞", "恋爱总天数", loveDays() + "天"],
          ["💖", "快乐瞬间", nHappy + "件"],
          ["🧳", "旅行次数", nTrv + "次"],
          ["📍", "到访城市", nCity + "座"],
          ["✅", "打卡天数", nCk + "天"],
          ["✨", "幸福指数", happiness() + "分"],
        ];
        ctx.font = "30px PingFang SC,sans-serif";
        cards.forEach((c, i) => {
          const cx = 90 + (i % 2) * 300,
            cy = 330 + Math.floor(i / 2) * 160;
          ctx.fillStyle = "#F7F7F9";
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(cx - 70, cy - 55, 280, 120, 18);
          else ctx.rect(cx - 70, cy - 55, 280, 120);
          ctx.fill();
          ctx.fillStyle = txt;
          ctx.font = "600 28px PingFang SC";
          ctx.fillText(c[2], cx + 70, cy + 5);
          ctx.fillStyle = sub;
          ctx.font = "22px PingFang SC";
          ctx.fillText(c[1] + " " + c[0], cx + 70, cy + 38);
        });
        const mh = [];
        for (let m = 1; m <= 12; m++) {
          const mm = y + "-" + pad(m);
          mh.push(
            DB.happy.filter((r) => monthKey(r.date) === mm).length +
              DB.travel.filter((r) => monthKey(r.date) === mm).length,
          );
        }
        const bx = 100,
          bw = 46,
          mbase = 930;
        ctx.fillStyle = "#F0F1F3";
        ctx.fillRect(bx - 20, mbase - 190, 590, 190);
        const mx = Math.max(4, ...mh);
        mh.forEach((v, i) => {
          const h = (v / mx) * 160;
          ctx.fillStyle = v ? pri : "#D9DCE1";
          ctx.fillRect(
            bx + i * 47,
            mbase - Math.max(h, v ? 4 : 0),
            bw,
            Math.max(h, v ? 4 : 0),
          );
        });
        ctx.fillStyle = sub;
        ctx.font = "18px PingFang SC";
        for (let m = 0; m < 12; m++)
          ctx.fillText(m + 1, bx + m * 47 + bw / 2, mbase + 26);
        ctx.fillStyle = txt;
        ctx.font = "600 26px PingFang SC";
        ctx.fillText("月度美好瞬间", W / 2, 700);
        ctx.fillStyle = sub;
        ctx.font = "24px PingFang SC";
        ctx.fillText("「" + QUOTES[y % QUOTES.length] + "」", W / 2, 1040);
        ctx.fillText("情侣全记录 · 纯离线生成 · " + today(), W / 2, 1120);
      }
