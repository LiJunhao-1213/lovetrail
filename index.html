                    ${listHtml || '<div class="text-muted text-center" style="padding:12px 0;">暂无提醒</div>'}
                </div>
            `;
        showModal("⏰ 提醒事项", html, () => {
          const addBtn = document.getElementById("remAddBtn");
          if (addBtn) {
            addBtn.addEventListener("click", function () {
              const inp = document.getElementById("remInput");
              const text = inp ? inp.value.trim() : "";
              if (text) {
                data.reminders.push({
                  text,
                  createdAt: new Date().toISOString(),
                });
                saveData();
                hideModal();
                showReminderModal();
              }
            });
          }
          document.querySelectorAll(".rem-del").forEach((el) => {
            el.addEventListener("click", function () {
              const idx = parseInt(this.dataset.ridx);
              data.reminders.splice(idx, 1);
              saveData();
              hideModal();
              showReminderModal();
            });
          });
        });
      }
      document
        .getElementById("reminderBtn")
        .addEventListener("click", showReminderModal);

      // ============================================================
      // 日历
      // ============================================================
      let calYear = new Date().getFullYear();
      let calMonth = new Date().getMonth() + 1;

      function showCalendarModal() {
        renderCalendar(calYear, calMonth);
      }

      function renderCalendar(year, month) {
        const daysInMonth = new Date(year, month, 0).getDate();
        const firstDay = new Date(year, month - 1, 1).getDay();
        let grid = "";
        const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
        weekdays.forEach((w) => {
          grid += `<div class="cal-weekday">${w}</div>`;
        });
        for (let i = 0; i < firstDay; i++) {
          grid += `<div class="cal-day"></div>`;
        }
        const events = {};
        data.happy.forEach((h) => {
          const d = formatDateShort(h.startDate);
          if (!events[d]) events[d] = [];
          events[d].push("😊");
        });
        data.travel.forEach((t) => {
          const d = formatDateShort(t.startDate);
          if (!events[d]) events[d] = [];
          events[d].push("✈️");
        });
        data.menstrual.forEach((m) => {
          const d = formatDateShort(m.startDate);
          if (!events[d]) events[d] = [];
          events[d].push("🩸");
        });
        (data.love.anniversaries || []).forEach((a) => {
          const d = formatDateShort(a.date);
          if (!events[d]) events[d] = [];
          events[d].push("🎉");
        });

        for (let i = 1; i <= daysInMonth; i++) {
          const d = new Date(year, month - 1, i);
          const key = formatDateShort(d);
          const has = events[key] || [];
          let bg = "";
          let dot = "";
          let classStr = "cal-day";
          if (has.length > 0) {
            classStr += " has-event";
            if (has.length === 1) {
              const t = has[0];
              if (t === "😊") bg = "background:#34C759;";
              else if (t === "✈️") bg = "background:#007AFF;";
              else if (t === "🩸") bg = "background:#AF52DE;";
              else if (t === "🎉") bg = "background:#FF6B8A;";
            } else {
              bg =
                "background:linear-gradient(135deg,#34C759 50%,#007AFF 50%);";
            }
            dot = `<span class="event-dot"></span>`;
          }
          grid += `<div class="${classStr}" style="${bg}" data-date="${key}">${i}${dot}</div>`;
        }

        const html = `
                <div class="cal-nav">
                    <button id="calPrev">‹</button>
                    <span class="cal-month-year">${year}年 ${month}月</span>
                    <button id="calNext">›</button>
                </div>
                <div class="cal-grid">${grid}</div>
                <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text2);">
                    <span><span style="display:inline-block;width:12px;height:12px;background:#34C759;border-radius:3px;vertical-align:middle;"></span> 快乐</span>
                    <span><span style="display:inline-block;width:12px;height:12px;background:#007AFF;border-radius:3px;vertical-align:middle;"></span> 旅行</span>
                    <span><span style="display:inline-block;width:12px;height:12px;background:#AF52DE;border-radius:3px;vertical-align:middle;"></span> 月经</span>
                    <span><span style="display:inline-block;width:12px;height:12px;background:#FF6B8A;border-radius:3px;vertical-align:middle;"></span> 纪念日</span>
                </div>
            `;

        showModal("📅 日历", html, () => {
          document
            .getElementById("calPrev")
            .addEventListener("click", function () {
              if (calMonth > 1) {
                calMonth--;
              } else {
                calMonth = 12;
                calYear--;
              }
              renderCalendar(calYear, calMonth);
            });
          document
            .getElementById("calNext")
            .addEventListener("click", function () {
              if (calMonth < 12) {
                calMonth++;
              } else {
                calMonth = 1;
                calYear++;
              }
              renderCalendar(calYear, calMonth);
            });
        });
      }
      document
        .getElementById("calendarBtn")
        .addEventListener("click", showCalendarModal);

      // ============================================================
      // 随机回忆
      // ============================================================
      document
        .getElementById("randomBtn")
        .addEventListener("click", function () {
          const all = [...data.happy, ...data.travel, ...data.menstrual];
          if (all.length === 0) {
            showModal(
              "🎲 随机回忆",
              '<div class="random-egg-body"><div class="random-icon">📭</div><div class="random-title">暂无记录</div><div class="random-detail">快去创造属于你们的回忆吧！</div></div>',
            );
            return;
          }
          const r = all[Math.floor(Math.random() * all.length)];
          let detailHtml = "";
          if (r.startDate) {
            detailHtml += `<div class="rd-row"><span class="rd-label">📅 日期</span><span class="rd-value">${formatDate(r.startDate)}${r.endDate && r.endDate !== r.startDate ? " ~ " + formatDate(r.endDate) : ""}</span></div>`;
          }
          if (r.location) {
            detailHtml += `<div class="rd-row"><span class="rd-label">📍 地点</span><span class="rd-value">${r.location}</span></div>`;
          }
          if (r.moods && r.moods.length > 0) {
            const moodEmojiMap = {
              开心: "😊",
              高兴: "😄",
              兴奋: "😁",
              平静: "😌",
              感动: "😍",
              难过: "😞",
            };
            const moodsStr = r.moods
              .map((m) => `${moodEmojiMap[m] || "😊"} ${m}`)
              .join("  ");
            detailHtml += `<div class="rd-row"><span class="rd-label">😊 心情</span><span class="rd-value">${moodsStr}</span></div>`;
          }
          if (r.tags && r.tags.length > 0) {
            const typeEmojiMap = { 啪啪啪: "❤️", 看电影: "📺", 约会: "🎉" };
            const tagsStr = r.tags
              .map((t) => `${typeEmojiMap[t] || "📌"} ${t}`)
              .join("  ");
            detailHtml += `<div class="rd-row"><span class="rd-label">🏷️ 类型</span><span class="rd-value">${tagsStr}</span></div>`;
          }
          if (r.transport) {
            detailHtml += `<div class="rd-row"><span class="rd-label">🚗 交通</span><span class="rd-value">${r.transport}</span></div>`;
          }
          if (r.content) {
            detailHtml += `<div class="rd-row"><span class="rd-label">📝 备注</span><span class="rd-value">${r.content}</span></div>`;
          }
          if (r.images && r.images.length > 0) {
            detailHtml += `<div class="rd-row"><span class="rd-label">🖼️ 照片</span><span class="rd-value">${r.images.length}张</span></div>`;
          }

          const iconMap = { h: "😊", t: "✈️", m: "🩸" };
          const type = r.id
            ? r.id.startsWith("h")
              ? "h"
              : r.id.startsWith("t")
                ? "t"
                : "m"
            : "h";

          const html = `
                <div class="random-egg-body">
                    <div class="random-icon">${iconMap[type] || "🎲"}</div>
                    <div class="random-title">✨ 随机回忆</div>
                    <div class="random-detail">${detailHtml}</div>
                </div>
            `;
          showModal("🎲 随机回忆", html);
        });

      // ============================================================
      // 主题
      // ============================================================
      let themePreviewHue = 340,
        themePreviewSat = 70,
        themePreviewLit = 55;

      function showThemeModal() {
        const current = data.theme || { hue: 340, sat: 70, lit: 55 };
        themePreviewHue = current.hue;
        themePreviewSat = current.sat;
        themePreviewLit = current.lit;

        const presets = [
          { hue: 0, sat: 80, lit: 55, label: "红色" },
          { hue: 50, sat: 85, lit: 55, label: "黄色" },
          { hue: 280, sat: 70, lit: 55, label: "紫色" },
          { hue: 340, sat: 70, lit: 55, label: "粉色" },
          { hue: 220, sat: 75, lit: 55, label: "蓝色" },
          { hue: 330, sat: 80, lit: 60, label: "粉红色" },
        ];

        const html = `
                <div style="margin-bottom:8px;font-size:15px;font-weight:600;color:var(--text);">主题切换</div>
                <div class="theme-preset-grid">
                    ${presets
                      .map((p) => {
                        const isActive =
                          p.hue === themePreviewHue &&
                          p.sat === themePreviewSat &&
                          p.lit === themePreviewLit;
                        const bg = `hsl(${p.hue}, ${p.sat}%, ${p.lit}%)`;
                        return `<button class="theme-preset-btn ${isActive ? "active-theme-btn" : ""}" style="background:${bg};" data-hue="${p.hue}" data-sat="${p.sat}" data-lit="${p.lit}" title="${p.label}"></button>`;
                      })
                      .join("")}
                </div>
                <div class="theme-hue-wrap">
                    <label style="font-size:13px;font-weight:500;color:var(--text2);">自定义色相（0-360）</label>
                    <input type="range" id="customHue" min="0" max="360" value="${themePreviewHue}" />
                    <div class="theme-preview-block" id="themePreviewBlock" style="background:hsl(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%);"></div>
                </div>
                <button class="btn-primary" id="themeSaveBtn" style="background:hsl(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%); box-shadow: 0 4px 16px hsla(${themePreviewHue}, ${themePreviewSat}%, ${themePreviewLit}%, 0.4);">💾 保存主题</button>
            `;

        showModal("🎨 主题切换", html, () => {
          const saveBtn = document.getElementById("themeSaveBtn");
          const presetBtns = document.querySelectorAll(".theme-preset-btn");
          const range = document.getElementById("customHue");
          const previewBlock = document.getElementById("themePreviewBlock");

          function updatePreview(hue, sat, lit) {
            themePreviewHue = hue;
            themePreviewSat = sat;
            themePreviewLit = lit;
            setThemeVariables(hue, sat, lit);
            if (previewBlock)
              previewBlock.style.background = `hsl(${hue}, ${sat}%, ${lit}%)`;
            if (saveBtn) {
              saveBtn.style.background = `hsl(${hue}, ${sat}%, ${lit}%)`;
              saveBtn.style.boxShadow = `0 4px 16px hsla(${hue}, ${sat}%, ${lit}%, 0.4)`;
            }
            presetBtns.forEach((btn) => {
              const bh = parseInt(btn.dataset.hue);
              const bs = parseInt(btn.dataset.sat);
              const bl = parseInt(btn.dataset.lit);
              btn.classList.toggle(
                "active-theme-btn",
                bh === hue && bs === sat && bl === lit,
              );
            });
            if (range) range.value = hue;
          }

          presetBtns.forEach((btn) => {
            btn.addEventListener("click", function () {
              const h = parseInt(this.dataset.hue);
              const s = parseInt(this.dataset.sat);
              const l = parseInt(this.dataset.lit);
              updatePreview(h, s, l);
            });
          });
          if (range) {
            range.addEventListener("input", function () {
              const h = parseInt(this.value);
              updatePreview(h, themePreviewSat, themePreviewLit);
            });
          }
          if (saveBtn) {
            saveBtn.addEventListener("click", function () {
              const h = Math.min(
                360,
                Math.max(0, parseInt(range ? range.value : themePreviewHue)),
              );
              applyTheme(h, themePreviewSat, themePreviewLit);
              hideModal();
            });
          }
          updatePreview(themePreviewHue, themePreviewSat, themePreviewLit);
        });
      }
      document
        .getElementById("themeBtn")
        .addEventListener("click", showThemeModal);

      // ============================================================
      // 搜索
      // ============================================================
      function setupSearch(inputId, btnId, dataList, renderFn) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        if (!input || !btn) return;
        const doSearch = () => {
          const q = input.value.trim().toLowerCase();
          if (!q) {
            renderFn(dataList);
            return;
          }
          const filtered = dataList.filter((item) =>
            JSON.stringify(item).toLowerCase().includes(q),
          );
          renderFn(filtered);
        };
        btn.addEventListener("click", doSearch);
        input.addEventListener("input", doSearch);
      }
      setupSearch(
        "searchHappyInput",
        "searchHappyBtn",
        data.happy,
        (filtered) => {
          const cp = happyPageNum;
          renderHappy(filtered);
          happyPageNum = cp;
        },
      );
      setupSearch(
        "searchTravelInput",
        "searchTravelBtn",
        data.travel,
        (filtered) => {
          const cp = travelPageNum;
          renderTravel(filtered);
          travelPageNum = cp;
        },
      );
      setupSearch(
        "searchMenstrualInput",
        "searchMenstrualBtn",
        data.menstrual,
        (filtered) => {
          const cp = menstrualPageNum;
          renderMenstrual(filtered);
          menstrualPageNum = cp;
        },
      );

      // ============================================================
      // 图片查看器
      // ============================================================
      let viewerImages = [],
        viewerIndex = 0;
      document
        .getElementById("viewerClose")
        .addEventListener("click", () =>
          document.getElementById("imageViewer").classList.remove("show"),
        );
      document
        .getElementById("viewerPrev")
        .addEventListener("click", function () {
          if (viewerIndex > 0) {
            viewerIndex--;
            document.getElementById("viewerImg").src =
              viewerImages[viewerIndex];
          }
        });
      document
        .getElementById("viewerNext")
        .addEventListener("click", function () {
          if (viewerIndex < viewerImages.length - 1) {
            viewerIndex++;
            document.getElementById("viewerImg").src =
              viewerImages[viewerIndex];
          }
        });
      document
        .getElementById("imageViewer")
        .addEventListener("click", function (e) {
          if (e.target === this) this.classList.remove("show");
        });

      // ============================================================
      // 一键清除数据（放在 init 中绑定）
      // ============================================================
      function init() {
        loadTheme();
        updateAchievements();

        // 绑定清除按钮（确保 DOM 已加载）
        document
          .getElementById("clearDataBtn")
          .addEventListener("click", function () {
            if (
              confirm("⚠️ 确定要清除所有数据吗？此操作不可撤销！") &&
              confirm("再次确认：删除所有本地数据？")
            ) {
              try {
                localStorage.removeItem(STORAGE_KEY);
                alert("✅ 数据已清除，页面即将刷新。");
                location.reload();
              } catch (e) {
                alert("清除数据失败，请稍后重试。");
              }
            }
          });

        document
          .querySelectorAll(".page-container, .form-page")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById("pageLove").classList.add("active");
        navHistory = ["pageLove"];

        renderLove();
        renderHappy();
        renderTravel();
        renderOverview();
        renderMenstrual();
        renderAnniversary();
        renderFight();
        renderBreakup();
        renderLetter();
        renderTree();
        renderChallenge();
        renderArchive();
        setInterval(saveData, 30000);
        console.log("💕 Love·轨迹 已启动（数据为空）");
      }

      document.addEventListener("DOMContentLoaded", init);
      if (window.navigator.standalone) {
        document.body.style.overflow = "hidden";
        document.body.style.height = "100vh";
      }
      console.log("✅ 加载完成");
    </script>
  </body>
</html>
