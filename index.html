<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Love·轨迹" />
    <title>Love·轨迹 520.1314</title>
    <style>
      /* ===== 全局重置 & 变量 ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --primary: #ff6b8a;
        --primary-light: hsla(340, 70%, 55%, 0.15);
        --bg: #f2f2f7;
        --card: #ffffff;
        --text: #1c1c1e;
        --text2: #414141;
        --border: #e5e5ea;
        --radius: 8px;
        --tab-height: 56px;
        --nav-height: 52px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        max-width: 430px;
        margin: 0 auto;
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }
      /* ===== 导航栏（与状态栏融合） ===== */
      .nav-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 0) 16px 0 16px;
        min-height: calc(var(--nav-height) + env(safe-area-inset-top, 0));
        background: var(--primary);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .nav-title {
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        user-select: none;
      }
      .nav-title span {
        opacity: 0.9;
      }
      .nav-actions {
        display: flex;
        gap: 2px;
        align-items: center;
      }
      .nav-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: transparent;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        color: #fff;
        user-select: none;
      }
      .nav-btn:active {
        transform: scale(0.88);
        background: rgba(255, 255, 255, 0.2);
      }
      /* ===== 主内容区 ===== */
      .main-content {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .page-container,
      .form-page {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0 16px 16px 16px;
        padding-bottom: calc(16px + var(--tab-height) + 8px);
        display: none;
        -webkit-overflow-scrolling: touch;
        background: var(--bg);
      }
      .page-container.active,
      .form-page.active {
        display: block;
      }
      /* ===== 表单导航 ===== */
      .form-nav {
        display: flex;
        align-items: center;
        padding: 8px 0 12px 0;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 10;
        backdrop-filter: saturate(180%) blur(12px);
        -webkit-backdrop-filter: saturate(180%) blur(12px);
      }
      .back-btn {
        font-size: 22px;
        color: var(--primary);
        cursor: pointer;
        background: none;
        border: none;
        padding: 6px 4px 6px 0;
        display: flex;
        align-items: center;
        gap: 2px;
        font-weight: 500;
      }
      .back-btn:active {
        opacity: 0.6;
      }
      .form-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        text-align: center;
        flex: 1;
        margin-right: 36px;
      }
      /* ===== 表单通用 ===== */
      .form-group {
        margin-bottom: 14px;
        background: #ffffff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        border: none;
      }
      .form-group label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        display: block;
        margin-bottom: 4px;
      }
      .form-group input[type="text"],
      .form-group input[type="number"],
      .form-group input[type="date"],
      .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--radius);
        border: 0.5px solid var(--border);
        font-size: 15px;
        background: var(--card);
        color: var(--text);
        outline: none;
        transition: all 0.2s;
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 107, 138, 0.12);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 60px;
      }
      .form-divider {
        border: none;
        border-top: 0.5px solid var(--border);
        margin: 6px 0 14px 0;
      }
      .form-row {
        display: flex;
        gap: 12px;
      }
      .form-row .form-group {
        flex: 1;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        margin-top: 6px;
      }
      .btn-primary:active {
        transform: scale(0.96);
        opacity: 0.85;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      .btn-row .btn-primary,
      .btn-row .btn-danger {
        flex: 1;
      }
      .btn-danger {
        background: #ff3b30;
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        margin-top: 6px;
      }
      .btn-danger:active {
        transform: scale(0.96);
        opacity: 0.85;
      }
      /* ===== Tab栏（适配底部安全区域 + 文字完整显示） ===== */
      .tab-bar {
        height: auto;
        min-height: calc(var(--tab-height) + env(safe-area-inset-bottom, 0));
        display: flex;
        align-items: stretch;
        background: var(--bg);
        border-top: 0.5px solid var(--border);
        flex-shrink: 0;
        padding: 0 0 env(safe-area-inset-bottom, 0) 0;
        box-sizing: border-box;
      }
      .tab-item {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        color: var(--text2);
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        background: transparent;
        padding: 4px 2px;
        gap: 1px;
        position: relative;
        font-weight: 500;
        letter-spacing: 0.2px;
        user-select: none;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 0;
      }
      .tab-item .tab-emoji {
        font-size: 18px;
        line-height: 1.2;
        transition: all 0.2s;
      }
      .tab-item .tab-label {
        font-size: 8px;
        line-height: 1.2;
        transition: all 0.2s;
      }
      .tab-item.active {
        color: var(--primary);
        transform: scale(1.04);
      }
      .tab-item.active .tab-emoji {
        transform: scale(1.08);
      }
      .tab-item:active {
        transform: scale(0.92);
      }
      .tab-item.active::after {
        content: "";
        position: absolute;
        top: 0;
        left: 20%;
        right: 20%;
        height: 2.5px;
        background: var(--primary);
        border-radius: 0 0 4px 4px;
      }
      /* ===== Modal ===== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        animation: fadeIn 0.25s ease;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal-box {
        background: var(--card);
        border-radius: 14px;
        max-width: 400px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px 18px 18px 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s ease;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-size: 17px;
        font-weight: 600;
        color: var(--text);
      }
      .modal-header .close-modal {
        font-size: 22px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
        color: var(--text2);
        line-height: 1;
      }
      .modal-header .close-modal:active {
        transform: scale(0.85);
      }
      /* ===== 分页 ===== */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        padding: 12px 0 6px 0;
        font-size: 14px;
        color: var(--text2);
      }
      .pagination button {
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text);
        font-weight: 500;
      }
      .pagination button:active {
        transform: scale(0.92);
        opacity: 0.7;
      }
      .pagination button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      /* ===== 固定添加按钮 ===== */
      .fixed-add-btn {
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 0 8px 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        margin-top: 4px;
        background: var(--bg);
      }
      .fixed-add-btn button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 10px 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 16px rgba(255, 107, 138, 0.3);
      }
      .fixed-add-btn button:active {
        transform: scale(0.94);
        opacity: 0.85;
      }
      /* ===== 列表卡片 ===== */
      .list-item-card {
        background: var(--card);
        border-radius: var(--radius);
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        overflow: hidden;
        cursor: default;
        transition: all 0.2s;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .list-item-card .item-left {
        flex: 1;
        min-width: 0;
      }
      .list-item-card .item-left .item-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .list-item-card .item-left .item-sub {
        font-size: 13px;
        color: var(--text2);
        margin-top: 2px;
      }
      .list-item-card .item-left .item-desc {
        font-size: 13px;
        color: var(--text);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .list-item-card .del-btn {
        font-size: 18px;
        cursor: pointer;
        background: none;
        border: none;
        color: var(--text2);
        padding: 4px;
        line-height: 1;
        transition: all 0.2s;
        flex-shrink: 0;
        margin-left: 8px;
      }
      .list-item-card .del-btn:active {
        transform: scale(0.85);
        color: #ff3b30;
      }
      .list-item-card .status-badge {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 10px;
        border-radius: 12px;
        background: var(--primary-light);
        color: var(--primary);
        flex-shrink: 0;
        margin-left: 8px;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }
      .list-item-card .status-badge.done {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .list-item-card .status-badge.pending {
        background: #fff3e0;
        color: #e65100;
      }
      .list-item-card .status-badge:active {
        transform: scale(0.92);
        opacity: 0.7;
      }
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text2);
        font-size: 15px;
      }
      .empty-state .empty-emoji {
        font-size: 48px;
        display: block;
        margin-bottom: 12px;
      }
      /* ===== Love主页 ===== */
      .love-profile-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 16px 16px 14px 16px;
        margin-bottom: 14px;
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .love-profile-card:active {
        transform: scale(0.96);
        opacity: 0.7;
      }
      .love-profile-card .names {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        color: var(--primary);
      }
      .love-profile-card .names .heart {
        color: var(--primary);
        font-size: 22px;
      }
      .love-profile-card .birthdays {
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 13px;
        color: var(--text2);
        margin-top: 6px;
      }
      .love-profile-card .birthdays .birth-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .love-profile-card .birthdays .birth-item .birth-label {
        font-weight: 500;
        color: var(--text);
      }
      .love-profile-card .start-date {
        font-size: 14px;
        color: var(--text2);
        margin-top: 8px;
      }
      .love-profile-card .together-days {
        font-size: 22px;
        font-weight: 700;
        color: var(--primary);
        margin-top: 4px;
      }
      .love-function-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 0 12px 0;
      }
      .love-function-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 10px;
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 60px;
        position: relative;
      }
      .love-function-card:active {
        transform: scale(0.94);
        opacity: 0.7;
      }
      .love-function-card .func-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 0;
        margin-bottom: 8px;
      }
      .love-function-card .func-left .func-emoji {
        font-size: 18px;
        line-height: 1.2;
        flex-shrink: 0;
      }
      .love-function-card .func-left .func-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
      }
      .love-function-card .func-arrow {
        font-size: 18px;
        color: var(--text2);
        flex-shrink: 0;
        margin-left: 4px;
      }
      .love-function-card .func-value {
        font-size: 10px;
        font-weight: 600;
        color: var(--primary);
        position: absolute;
        bottom: 12px;
        left: 10px;
        line-height: 0.2;
      }
      /* ===== 成就墙 ===== */
      .achievement-wall {
        background: var(--card);
        border-radius: var(--radius);
        padding: 14px 14px 10px 14px;
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        margin-bottom: 4px;
      }
      .achievement-wall .wall-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .achievement-wall .wall-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .achievement-wall .wall-title .wall-emoji {
        font-size: 20px;
      }
      .achievement-wall .wall-count {
        font-weight: 400;
        font-size: 13px;
        color: var(--text2);
      }
      .achievement-wall .wall-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .achieve-card {
        background: var(--primary-light);
        border-radius: var(--radius);
        padding: 10px 12px 10px 12px;
        border: 0.5px solid rgba(0, 0, 0, 0.04);
        transition: all 0.2s;
        min-height: 62px;
        display: flex;
        align-items: stretch;
        cursor: pointer;
        position: relative;
        -webkit-touch-callout: none;
      }
      .achieve-card:active {
        transform: scale(0.96);
      }
      .achieve-card .ach-left {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        min-width: 0;
        padding-right: 4px;
      }
      .achieve-card .ach-left .ach-title-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .achieve-card .ach-left .ach-title-row .ach-icon {
        font-size: 16px;
        flex-shrink: 0;
      }
      .achieve-card .ach-left .ach-title-row .ach-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .achieve-card .ach-left .ach-desc {
        font-size: 11px;
        color: var(--text2);
        line-height: 1.3;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .achieve-card .ach-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        align-self: flex-end;
        flex-shrink: 0;
        margin-left: auto;
        min-width: 36px;
        background: #e8f5e9;
        border-radius: 6px;
        padding: 2px 5px;
        align-self: flex-end;
      }
      .achieve-card .ach-right .ach-status-icon {
        font-size: 13px;
        line-height: 1.2;
      }
      .achieve-card .ach-right .ach-status-text {
        font-size: 8px;
        font-weight: 500;
        color: #2e7d32;
        line-height: 1.1;
      }
      .achieve-card .ach-right.locked {
        background: #e8e8e8;
      }
      .achieve-card .ach-right.locked .ach-status-text {
        color: #666;
      }
      /* ===== 记录卡片 ===== */
      .record-card {
        background: var(--card);
        border-radius: var(--radius);
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        border: 0.5px solid var(--border);
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s;
        -webkit-touch-callout: none;
      }
      .record-card:active {
        transform: scale(0.995);
      }
      .record-card .record-header {
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 0.5px solid var(--border);
      }
      .record-card .record-header .date-text {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }
      .record-card .record-header .del-btn {
        font-size: 18px;
        cursor: pointer;
        padding: 4px;
        background: none;
        border: none;
        color: var(--text2);
        line-height: 1;
        transition: all 0.2s;
        z-index: 5;
        position: relative;
      }
      .record-card .record-header .del-btn:active {
        transform: scale(0.85);
        color: #ff3b30;
      }
      .record-card .record-body {
        padding: 12px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .record-card .record-body .left {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .record-card .record-body .left .info-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--text);
        flex-wrap: wrap;
      }
      .record-card .record-body .left .info-row .emoji {
        font-size: 16px;
        flex-shrink: 0;
      }
      .record-card .record-body .left .info-row .label {
        color: var(--text2);
        font-weight: 500;
        margin-right: 2px;
      }
      .record-card .record-body .left .info-row .value {
        color: var(--text);
      }
      .record-card .record-body .left .type-items {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 14px;
        color: var(--text);
      }
      .record-card .record-body .left .type-items .type-item {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .record-card .record-body .left .type-items .type-item .check {
        font-size: 16px;

    <script>
      // ============================================================
      // DATA LAYER
      // ============================================================
      const STORAGE_KEY = "love_track_data";
      const PAGE_SIZE = 3;

      function getDefaultAchievements() {
        return [];
      }

      function getDefaultData() {
        return {
          happy: [],
          travel: [],
          menstrual: [],
          love: {
            myName: "",
            herName: "",
            myBirthday: "",
            herBirthday: "",
            startDate: "",
            endDate: "",
            anniversaries: [],
            fights: [],
            breakup: { date: "", reconcileDate: "" },
            loveTree: { level: 1, exp: 0 },
            challenges: [],
            loveLetters: [],
          },
          reminders: [],
          theme: { hue: 340, sat: 70, lit: 55 },
          overviewOrder: [
            "happy_count",
            "travel_count",
            "love_days",
            "last_travel",
            "last_happy",
          ],
          achievements: [],
        };
      }

      let data = loadData();
      let navHistory = ["pageLove"];

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const def = getDefaultData();
            for (let key in def) {
              if (!(key in parsed)) parsed[key] = def[key];
            }
            if (!parsed.love) parsed.love = def.love;
            for (let k in def.love) {
              if (!(k in parsed.love)) parsed.love[k] = def.love[k];
            }
            if (!parsed.love.loveTree)
              parsed.love.loveTree = { level: 1, exp: 0 };
            if (!parsed.love.anniversaries) parsed.love.anniversaries = [];
            if (!parsed.love.fights) parsed.love.fights = [];
            if (!parsed.love.challenges) parsed.love.challenges = [];
            if (!parsed.love.loveLetters) parsed.love.loveLetters = [];
            if (!parsed.overviewOrder) parsed.overviewOrder = def.overviewOrder;
            if (!parsed.achievements) parsed.achievements = [];
            if (!parsed.reminders) parsed.reminders = [];
            parsed.menstrual.forEach((record) => {
              if (!record.dayDetails) {
                record.dayDetails = [];
                if (record.dailySymptoms && record.dailySymptoms.length > 0) {
                  record.dailySymptoms.forEach((s) => {
                    record.dayDetails.push({
                      flow: "中量",
                      symptoms: s
                        ? s.split(/[,，、\s]+/).filter(Boolean)
                        : ["无"],
                    });
                  });
                }
                if (record.dayDetails.length === 0)
                  record.dayDetails = [{ flow: "中量", symptoms: ["无"] }];
                record.days = record.dayDetails.length;
              }
              if (!record.days) record.days = record.dayDetails.length || 1;
            });
            parsed.happy.forEach((h) => {
              if (!h.images) h.images = [];
              if (typeof h.image === "string" && h.image) {
                h.images.push(h.image);
                h.image = undefined;
              }
              if (!h.moods) h.moods = [];
              if (!h.tags) h.tags = [];
            });
            parsed.travel.forEach((t) => {
              if (!t.images) t.images = [];
              if (typeof t.image === "string" && t.image) {
                t.images.push(t.image);
                t.image = undefined;
              }
              if (!t.mood) t.mood = "";
              if (!t.transport) t.transport = "";
            });
            return parsed;
          }
        } catch (e) {
          console.warn("Load error", e);
        }
        return getDefaultData();
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.warn("Save error", e);
        }
      }

      // ============================================================
      // UTILITY
      // ============================================================
      function genId() {
        return (
          Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7)
        );
      }

      function formatDate(d) {
        if (!d) return "-";
        const dt = new Date(d);
        return (
          dt.getFullYear() +
          "年" +
          String(dt.getMonth() + 1).padStart(2, "0") +
          "月" +
          String(dt.getDate()).padStart(2, "0") +
          "日"
        );
      }

      function formatDateShort(d) {
        if (!d) return "-";
        const dt = new Date(d);
        return (
          dt.getFullYear() +
          "-" +
          String(dt.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(dt.getDate()).padStart(2, "0")
        );
      }

      function todayStr() {
        const d = new Date();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }

      function addDays(dateStr, n) {
        const d = new Date(dateStr);
        d.setDate(d.getDate() + n);
        return d.toISOString().slice(0, 10);
      }

      function daysBetween(a, b) {
        const da = new Date(a),
          db = new Date(b);
        return Math.floor(
          (db.getTime() - da.getTime()) / (1000 * 60 * 60 * 24),
        );
      }

      function getSymptomEmoji(s) {
        const map = {
          无: "✅",
          腹痛: "😣",
          腰疼: "🤕",
          情绪波动: "😤",
          腹胀: "🤰",
          疲惫: "😴",
          恶心: "🤢",
          乳房肿胀: "🤱",
        };
        return map[s] || "😶";
      }

      function getFlowEmoji(f) {
        const map = { 少量: "🩸", 中量: "🔴", 大量: "🔴🔴" };
        return map[f] || "🔴";
      }

      function createDeleteParticles(el) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const emojis = [
          "💕",
          "✨",
          "🌸",
          "🌺",
          "💫",
          "❤️",
          "💖",
          "🌈",
          "🎀",
          "💝",
        ];
        for (let i = 0; i < 20; i++) {
          const p = document.createElement("div");
          p.className = "delete-particle";
          p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const angle = Math.random() * 2 * Math.PI;
          const dist = 40 + Math.random() * 80;
          p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          p.style.setProperty("--dy", Math.sin(angle) * dist - 60 + "px");
          p.style.left = cx + "px";
          p.style.top = cy + "px";
          p.style.fontSize = 16 + Math.random() * 20 + "px";
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 900);
        }
      }

      // ===== 彩蛋粒子消散 =====
      function createEggParticles(cx, cy, emojis) {
        const list = emojis || [
          "❤️",
          "✨",
          "💕",
          "🌈",
          "⭐",
          "🌸",
          "🎉",
          "💖",
          "🌺",
          "🎊",
        ];
        for (let i = 0; i < 28; i++) {
          const p = document.createElement("div");
          p.className = "egg-particle";
          p.textContent = list[Math.floor(Math.random() * list.length)];
          const angle = Math.random() * 2 * Math.PI;
          const dist = 60 + Math.random() * 120;
          p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          p.style.setProperty("--ty", Math.sin(angle) * dist - 80 + "px");
          p.style.left = cx + "px";
          p.style.top = cy + "px";
          p.style.fontSize = 18 + Math.random() * 28 + "px";
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1300);
        }
      }

      // ===== iOS风格左滑返回 =====
      let touchStartX = 0,
        touchStartY = 0;
      document.addEventListener(
        "touchstart",
        function (e) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchmove",
        function (e) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (
            touchStartX < 30 &&
            dx > 50 &&
            Math.abs(dx) > Math.abs(dy) * 1.5
          ) {
            e.preventDefault();
            goBack();
            touchStartX = 0;
          }
        },
        { passive: false },
      );

      // ===== 长按 =====
      let longPressTimer = null,
        longPressTarget = null;

      function setupLongPress(element, callback) {
        element.addEventListener("touchstart", function (e) {
          longPressTarget = this;
          longPressTimer = setTimeout(function () {
            if (longPressTarget) {
              e.preventDefault();
              callback(longPressTarget);
              longPressTarget = null;
            }
          }, 600);
        });
        element.addEventListener("touchmove", function () {
          clearTimeout(longPressTimer);
          longPressTarget = null;
        });
        element.addEventListener("touchend", function () {
          clearTimeout(longPressTimer);
          longPressTarget = null;
        });
        element.addEventListener("touchcancel", function () {
          clearTimeout(longPressTimer);
          longPressTarget = null;
        });
      }

      // ============================================================
      // THEME
      // ============================================================
      function setThemeVariables(hue, sat, lit) {
        const primary = `hsl(${hue}, ${sat}%, ${lit}%)`;
        const primaryLight = `hsla(${hue}, ${sat}%, ${lit}%, 0.15)`;
        document.documentElement.style.setProperty("--primary", primary);
        document.documentElement.style.setProperty(
          "--primary-light",
          primaryLight,
        );
        document.getElementById("mainNav").style.background = primary;
        document.querySelectorAll(".fixed-add-btn button").forEach((b) => {
          b.style.background = primary;
          b.style.boxShadow = `0 4px 16px ${primary}4D`;
        });
        document
          .querySelectorAll(".search-btn")
          .forEach((b) => (b.style.background = primary));
        document
          .querySelectorAll(".btn-primary")
          .forEach((b) => (b.style.background = primary));
        document
          .querySelectorAll(".tab-item.active")
          .forEach((el) => (el.style.color = primary));
      }

      function applyTheme(hue, sat, lit) {
        setThemeVariables(hue, sat, lit);
        data.theme = { hue, sat, lit };
        saveData();
      }

      function loadTheme() {
        const t = data.theme || { hue: 340, sat: 70, lit: 55 };
        applyTheme(t.hue, t.sat, t.lit);
      }

      // ============================================================
      // MODAL
      // ============================================================
      let modalCallback = null;

      function showModal(title, html, cb) {
        const overlay = document.getElementById("modalOverlay");
        const titleEl = document.getElementById("modalTitle");
        const bodyEl = document.getElementById("modalBody");
        if (!overlay || !titleEl || !bodyEl) return;
        titleEl.textContent = title || "标题";
        bodyEl.innerHTML = html || "";
        overlay.classList.add("show");
        modalCallback = cb || null;
        if (modalCallback) {
          setTimeout(() => {
            try {
              modalCallback();
            } catch (e) {}
          }, 50);
        }
      }

      function hideModal() {
        document.getElementById("modalOverlay").classList.remove("show");
        modalCallback = null;
      }
      document
        .getElementById("modalClose")
        .addEventListener("click", hideModal);
      document
        .getElementById("modalOverlay")
        .addEventListener("click", function (e) {
          if (e.target === this) hideModal();
        });

      // ============================================================
      // NAVIGATION
      // ============================================================
      function navigateTo(pageId, addHistory = true) {
        document
          .querySelectorAll(".page-container, .form-page")
          .forEach((el) => el.classList.remove("active"));
        const target = document.getElementById(pageId);
        if (target) {
          target.classList.add("active");
          if (addHistory) {
            navHistory.push(pageId);
            if (navHistory.length > 20) navHistory.shift();
          }
        }
      }

      function goBack() {
        if (navHistory.length > 1) {
          navHistory.pop();
          const prev = navHistory[navHistory.length - 1];
          document
            .querySelectorAll(".page-container, .form-page")
            .forEach((el) => el.classList.remove("active"));
          const target = document.getElementById(prev);
          if (target) {
            target.classList.add("active");
            if (prev === "pageAnniversary") renderAnniversary();
            else if (prev === "pageFight") renderFight();
            else if (prev === "pageBreakup") renderBreakup();
            else if (prev === "pageLetter") renderLetter();
            else if (prev === "pageTree") renderTree();
            else if (prev === "pageChallenge") renderChallenge();
            else if (prev === "pageFootprint") renderFootprint();
            else if (prev === "pageYearlyReport") renderYearlyReport();
            else if (prev === "pageArchive") renderArchive();
            else if (prev === "pageLove") renderLove();
            else if (prev === "pageHappy") renderHappy();
            else if (prev === "pageTravel") renderTravel();
            else if (prev === "pageOverview") renderOverview();
            else if (prev === "pageMenstrual") renderMenstrual();
          }
        } else {
          navigateTo("pageLove");
          renderLove();
        }
      }

      // Tab切换
      document.querySelectorAll(".tab-item").forEach((tab) => {
        tab.addEventListener("click", function () {

            .map((ach, idx) => {

              const statusIcon = ach.unlocked ? "🔓" : "🔒";
              const statusText = ach.unlocked ? "已解锁" : "未解锁";

          isBreakup = false,

          if (love.breakup && love.breakup.date) {
            const breakup = new Date(love.breakup.date);
            if (!love.breakup.reconcileDate) {
              days = Math.floor((breakup - start) / (1000 * 60 * 60 * 24));
              isBreakup = true;
              breakupDate = love.breakup.date;

              const reconcile = new Date(love.breakup.reconcileDate);

                (breakup - start) / (1000 * 60 * 60 * 24),

                (today - reconcile) / (1000 * 60 * 60 * 24),

      // ============================================================
      // 快乐 (完整)
      // ============================================================
      let happyPageNum = 1;

      function renderHappy(list) {
        const source = list || data.happy;
        const total = source.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (happyPageNum > totalPages) happyPageNum = totalPages;
        const start = (happyPageNum - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const pageData = source.slice(start, end);
        const stats = document.getElementById("happyStats");
        if (stats) {
          const totalEl = stats.querySelector(".card-stats:first-child .value");
          if (totalEl)
            totalEl.innerHTML = total + ' <span class="unit">次</span>';
          const recentEl = document.getElementById("happyRecent");
          if (recentEl && total > 0) {
            const last = source[source.length - 1];
            recentEl.textContent = last.startDate
              ? formatDate(last.startDate)
              : "-";
          } else if (recentEl) {
            recentEl.textContent = "-";
          }
        }
        const container = document.getElementById("happyList");
        if (!container) return;
        if (pageData.length === 0) {
          container.innerHTML =
            '<div class="empty-state"><span class="empty-emoji">😊</span>还没有快乐记录，快添加一个吧！</div>';
        } else {
          container.innerHTML = pageData
            .map((item) => renderHappyCard(item))
            .join("");
        }
        renderPagination(
          "happyPagination",
          "happyPageInfo",
          "happyPrev",
          "happyNext",
          happyPageNum,
          totalPages,
        );
        document.getElementById("happyPrev").onclick = function () {
          if (happyPageNum > 1) {
            happyPageNum--;
            renderHappy();
          }
        };
        document.getElementById("happyNext").onclick = function () {
          if (happyPageNum < totalPages) {
            happyPageNum++;
            renderHappy();
          }
        };
        container.querySelectorAll(".del-btn").forEach((el) => {
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (id && confirm("确定删除吗？")) {
              const card = this.closest(".record-card");
              if (card) createDeleteParticles(card);
              data.happy = data.happy.filter((item) => item.id !== id);
              saveData();
              setTimeout(() => renderHappy(), 300);
            }
          });
        });
        container.querySelectorAll(".record-card").forEach((el) => {
          setupLongPress(el, function (target) {
            const id = target.dataset.id;
            const item = data.happy.find((d) => d.id === id);
            if (item) showHappyForm(item);
          });
          el.addEventListener("click", function () {
            const id = this.dataset.id;
            const item = data.happy.find((d) => d.id === id);
            if (item) showHappyForm(item);
          });
        });
      }

      function renderHappyCard(item) {
        const startDate = formatDateNoPad(item.startDate);
        const endDate =
          item.endDate && item.endDate !== item.startDate

        let html = `<div class="overview-small-grid" id="overviewGrid">`;
        const order = data.overviewOrder || Object.keys(cards);
        order.forEach((key) => {
          const card = cards[key];
          if (!card) return;
          const isDate =

          html += `
                    <div class="overview-card" draggable="true" data-key="${key}">
                        <div class="ov-title"><span class="ov-emoji">${card.emoji}</span> ${card.label}</div>
                        <div class="ov-value ${isDate ? "small-text" : ""}">${card.value}${card.unit ? ' <span class="unit">' + card.unit + "</span>" : ""}</div>
                    </div>
                `;
        });
        html += "</div>";

        html += `
                <div class="overview-large-card" data-page="pageFootprint">
                    <div class="ov-title"><span class="ov-emoji">👣</span> 足迹</div>
                    <div class="ov-content">探寻每一个牵手经过的地方</div>
                </div>
                <div class="overview-large-card" data-page="pageYearlyReport">
                    <div class="ov-title"><span class="ov-emoji">📈</span> 年度报告</div>

          .querySelectorAll(".overview-large-card[data-page]")

            el.addEventListener("click", function () {
              const pageId = this.dataset.page;
              if (pageId) {
                navigateTo(pageId);

                else if (pageId === "pageYearlyReport") renderYearlyReport();

      // ============================================================
      // 拖拽
      // ============================================================
      let dragItemEl = null,
        dragTypeEl = null;

      function setupDragAndDrop(container) {
        const items = container.querySelectorAll('[draggable="true"]');
        items.forEach((item) => {
          item.removeEventListener("dragstart", handleDragStartEl);
          item.removeEventListener("dragend", handleDragEndEl);
          item.removeEventListener("dragover", handleDragOverEl);
          item.removeEventListener("dragenter", handleDragEnterEl);
          item.removeEventListener("drop", handleDropEl);
          item.addEventListener("dragstart", handleDragStartEl);
          item.addEventListener("dragend", handleDragEndEl);
          item.addEventListener("dragover", handleDragOverEl);
          item.addEventListener("dragenter", handleDragEnterEl);
          item.addEventListener("drop", handleDropEl);
        });
      }

      function handleDragStartEl(e) {
        dragItemEl = this;
        if (this.closest(".menstrual-record-card")) dragTypeEl = "menstrual";
        else dragTypeEl = "overview";
        e.dataTransfer.setData("text/plain", dragTypeEl);
        this.style.opacity = "0.5";
        e.dataTransfer.effectAllowed = "move";
      }

      function handleDragEndEl(e) {
        this.style.opacity = "1";
        document
          .querySelectorAll(".drag-over")
          .forEach((el) => el.classList.remove("drag-over"));
      }

      function handleDragOverEl(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      }

      function handleDragEnterEl(e) {
        e.preventDefault();
        if (this !== dragItemEl) this.classList.add("drag-over");
      }

      function handleDropEl(e) {
        e.preventDefault();
        this.classList.remove("drag-over");
        if (dragItemEl === this) return;
        const parent = this.parentNode;
        const allItems = [...parent.querySelectorAll('[draggable="true"]')];
        const fromIndex = allItems.indexOf(dragItemEl);
        const toIndex = allItems.indexOf(this);
        if (fromIndex < toIndex)
          parent.insertBefore(dragItemEl, this.nextSibling);
        else parent.insertBefore(dragItemEl, this);
        if (dragTypeEl === "menstrual") {
          const items = parent.querySelectorAll(".menstrual-record-card");
          const newOrder = [];
          items.forEach((el) => {
            const id = el.dataset.id;
            const item = data.menstrual.find((d) => d.id === id);
            if (item) newOrder.push(item);
          });
          data.menstrual = newOrder;
          saveData();
        } else if (dragTypeEl === "overview") {
          const items = parent.querySelectorAll(".overview-card");
          const newOrder = [];
          items.forEach((el) => {
            const key = el.dataset.key;
            if (key) newOrder.push(key);
          });
          const allKeys = [
            "happy_count",
            "travel_count",
            "love_days",
            "last_travel",
            "last_happy",
          ];
          const finalOrder = newOrder.filter((k) => allKeys.includes(k));
          allKeys.forEach((k) => {
            if (!finalOrder.includes(k)) finalOrder.push(k);
          });
          data.overviewOrder = finalOrder;
          saveData();
          renderOverview();
        }
        dragItemEl = null;
        dragTypeEl = null;
      }

      // ============================================================
      // 月经 (完整 - 布局按第一张图片)
      // ============================================================
      let menstrualPageNum = 1;

      function renderMenstrual(list) {
        const source = list || data.menstrual;
        const total = source.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (menstrualPageNum > totalPages) menstrualPageNum = totalPages;
        const start = (menstrualPageNum - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const pageData = source.slice(start, end);

        const statsContainer = document.getElementById("menstrualStats");
        if (statsContainer) {
          let avgCycle = 0,
            lastCycle = 0,
            cycles = [];
          if (source.length >= 2) {
            for (let i = 1; i < source.length; i++) {
              const diff = daysBetween(
                source[i - 1].startDate,
                source[i].startDate,
              );
              if (diff > 0) cycles.push(diff);
            }
            if (cycles.length > 0) {
              avgCycle = Math.round(
                cycles.reduce((a, b) => a + b, 0) / cycles.length,
              );
              lastCycle = cycles[cycles.length - 1] || 0;
            }
          }
          let nextDate = "-";
          if (source.length > 0 && avgCycle > 0) {
            const last = new Date(source[source.length - 1].startDate);
            last.setDate(last.getDate() + avgCycle);
            nextDate = formatDate(last);
          }
          const lastRecord =
            source.length > 0 ? source[source.length - 1] : null;
          const lastStart = lastRecord ? formatDate(lastRecord.startDate) : "-";
          const lastEnd =
            lastRecord && lastRecord.endDate
              ? formatDate(lastRecord.endDate)
              : "";
          const lastRange = lastStart + (lastEnd ? " ~ " + lastEnd : "");
          const deviation = lastCycle > 0 ? lastCycle - avgCycle : 0;
          const deviationText =
            deviation > 0
              ? `推迟 ${deviation}天`
              : deviation < 0
                ? `提前 ${Math.abs(deviation)}天`
                : "准时";
          const statItems = [
            { emoji: "📋", label: "总次数", value: total, unit: "次" },
            { emoji: "⏳", label: "预计下次", value: nextDate, unit: "" },
            { emoji: "📅", label: "上次月经时间", value: lastRange, unit: "" },
            { emoji: "📊", label: "偏差", value: deviationText, unit: "" },
            {
              emoji: "📈",
              label: "平均偏差",
              value:
                deviation > 0
                  ? `推迟 ${Math.round(avgCycle ? deviation : 0)}天`
                  : deviation < 0
                    ? `提前 ${Math.round(Math.abs(deviation))}天`
                    : "准时",
              unit: "",
            },
            {
              emoji: "🔄",
              label: "周期",
              value: lastCycle > 0 ? lastCycle + "天" : "-",
              unit: "",
            },
            {
              emoji: "📊",
              label: "平均周期",
              value: avgCycle > 0 ? avgCycle + "天" : "-",
              unit: "",
            },
          ];
          let statsHtml = `<div class="menstrual-stats-grid">`;
          statItems.forEach((item) => {
            statsHtml += `
                        <div class="menstrual-stat-card">
                            <div class="ms-title"><span class="ms-emoji">${item.emoji}</span> ${item.label}</div>
                            <div class="ms-value">${item.value}${item.unit ? ' <span class="unit">' + item.unit + "</span>" : ""}</div>
                        </div>
                    `;
          });
          statsHtml += `</div>`;
          statsContainer.innerHTML = statsHtml;
        }

        const container = document.getElementById("menstrualList");
        if (!container) return;
        if (pageData.length === 0) {
          container.innerHTML =
            '<div class="empty-state"><span class="empty-emoji">🩸</span>还没有月经记录</div>';
        } else {
          container.innerHTML = pageData
            .map((item) => renderMenstrualCard(item))
            .join("");
          container.querySelectorAll(".toggle-btn").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const card = this.closest(".menstrual-record-card");
              const details = card.querySelector(".daily-details");
              const isOpen = details.style.display === "block";
              details.style.display = isOpen ? "none" : "block";
              this.textContent = isOpen ? "👇 展开" : "👆 折叠";
            });
          });
          container.querySelectorAll(".del-btn").forEach((el) => {
            el.addEventListener("click", function (e) {
              e.stopPropagation();
              const id = this.dataset.id;
              if (id && confirm("确定删除吗？")) {
                const card = this.closest(".menstrual-record-card");
                if (card) createDeleteParticles(card);
                data.menstrual = data.menstrual.filter(
                  (item) => item.id !== id,
                );
                saveData();
                setTimeout(() => renderMenstrual(), 300);
              }
            });
          });
          container
            .querySelectorAll(".menstrual-record-card")
            .forEach((card) => {
              setupLongPress(card, function (target) {
                const id = target.dataset.id;
                const item = data.menstrual.find((d) => d.id === id);
                if (item) showMenstrualForm(item);
              });
              card.addEventListener("click", function (e) {
                if (
                  e.target.closest(".del-btn") ||
                  e.target.closest(".toggle-btn")
                )
                  return;
                const id = this.dataset.id;
                const item = data.menstrual.find((d) => d.id === id);
                if (item) showMenstrualForm(item);
              });
            });
          setupDragAndDrop(container);
        }

        renderPagination(
          "menstrualPagination",
          "menstrualPageInfo",
          "menstrualPrev",
          "menstrualNext",
          menstrualPageNum,
          totalPages,
        );
        document.getElementById("menstrualPrev").onclick = function () {
          if (menstrualPageNum > 1) {
            menstrualPageNum--;
            renderMenstrual();
          }
        };
        document.getElementById("menstrualNext").onclick = function () {
          if (menstrualPageNum < totalPages) {
            menstrualPageNum++;
            renderMenstrual();
          }
        };
      }

      function renderMenstrualCard(item) {
        const start = new Date(item.startDate);
        const days = item.days || item.dayDetails?.length || 1;
        const endDate = addDays(item.startDate, days - 1);
        const dateRange =
          formatDateNoPad(item.startDate) +
          " ~ " +
          formatDateNoPad(endDate) +
          "（" +
          days +
          "天）";
        const details = item.dayDetails || [];
        let flowCount = {},
          symptomCount = {};
        let dailyDetailsHtml = "";
        details.forEach((d, idx) => {
          const flow = d.flow || "中量";
          flowCount[flow] = (flowCount[flow] || 0) + 1;
          (d.symptoms || []).forEach((s) => {
            if (s !== "无") symptomCount[s] = (symptomCount[s] || 0) + 1;
          });
          const daySymptoms = (d.symptoms || [])
            .filter((s) => s !== "无")
            .map((s) => getSymptomEmoji(s) + s)
            .join(" ");
          const flowEmoji = getFlowEmoji(flow);
          dailyDetailsHtml += `
                    <div class="day-row">
                        <span class="day-label">Day ${idx + 1}</span>
                        <span class="flow-part">${flowEmoji} ${flow}</span>
                        <span class="symptom-part">${daySymptoms || "✅ 无"}</span>
                    </div>
                `;
        });
        let avgFlow = "中量";
        if (Object.keys(flowCount).length > 0) {
          avgFlow = Object.keys(flowCount).reduce((a, b) =>
            flowCount[a] > flowCount[b] ? a : b,
          );
        }
        const avgFlowEmoji = getFlowEmoji(avgFlow);
        let symptomStr = Object.keys(symptomCount)
          .map((s) => `${getSymptomEmoji(s)} ${s} x${symptomCount[s]}天`)
          .join(" ");
        if (!symptomStr) symptomStr = "✅ 无症状";
        return `
                <div class="menstrual-record-card" draggable="true" data-id="${item.id}">
                    <div class="record-summary">
                        <span class="date-range">${dateRange}</span>
                        <button class="del-btn" data-id="${item.id}">❌</button>
                    </div>
                    <div class="record-body">
                        <div class="flow-info">🌊 平均流量：${avgFlowEmoji} ${avgFlow}</div>
                        <div class="symptom-info">${symptomStr}</div>
                        <div class="daily-details">${dailyDetailsHtml}</div>
                        <button class="toggle-btn">👇 展开</button>
                    </div>
                </div>
            `;
      }

      let menstrualEditId = null;

      // ===== 月经表单 - 按第一张图片布局 (横排) =====
      function showMenstrualForm(editItem) {
        const isEdit = !!editItem;
        menstrualEditId = isEdit ? editItem.id : null;
        const item = isEdit ? editItem : null;
        const startDate = isEdit ? item.startDate : todayStr();
        const days = isEdit ? item.days || item.dayDetails?.length || 1 : 3;
        const dayDetails = isEdit ? item.dayDetails || [] : [];
        while (dayDetails.length < days)
          dayDetails.push({ flow: "中量", symptoms: ["无"] });
        document.getElementById("menstrualFormTitle").textContent = isEdit
          ? "编辑月经记录"
          : "月经记录";

        const flowOptions = ["🩸少量", "🩸🩸中量", "🩸🩸🩸大量"];
        const symptomOptions = [
          "😌无",
          "😣腹痛",
          "😮‍💨疲惫",
          "😤情绪波动",
          "🤱乳房肿胀",
          "🤢恶心",
        ];

        let html = `
                <div class="form-group"><label>开始时间</label><input type="date" id="mfStartDate" value="${startDate}" /></div>
                <div class="form-group"><label>持续天数</label><input type="number" id="mfDays" value="${days}" min="1" max="20" /></div>
                <hr class="form-divider" />
                <div style="font-size:14px;font-weight:500;color:var(--text2);margin-bottom:12px;">📓每天症状与流量（点击标签选择，流量单选，症状可多选）</div>
                <div id="mfDayCards"></div>
                ${isEdit ? `<div class="btn-row"><button class="btn-primary" id="mfSave">💾 更新</button><button class="btn-danger" id="mfDelete">🗑 删除</button></div>` : `<button class="btn-primary" id="mfSave">💾 保存</button>`}
            `;
        document.getElementById("menstrualFormBody").innerHTML = html;
        document.getElementById("pageMenstrual").classList.remove("active");
        document.getElementById("pageMenstrualForm").classList.add("active");
        navHistory.push("pageMenstrualForm");
        if (navHistory.length > 20) navHistory.shift();

        function renderDayCards() {
          const daysVal =
            parseInt(document.getElementById("mfDays").value) || 1;
          const container = document.getElementById("mfDayCards");
          const currentDetails = [];
          const existingCards = container.querySelectorAll(
            ".menstrual-day-card",
          );
          existingCards.forEach((card, idx) => {
            const flow =
              card.querySelector(".flow-opt.active")?.dataset.value || "中量";
            const symptoms = [];
            card
              .querySelectorAll(".symptom-opt.active")
              .forEach((el) => symptoms.push(el.dataset.value));
            if (symptoms.length === 0) symptoms.push("无");
            currentDetails[idx] = { flow, symptoms };
          });
          while (currentDetails.length < daysVal)
            currentDetails.push({ flow: "中量", symptoms: ["无"] });
          const finalDetails = currentDetails.slice(0, daysVal);

          let cardsHtml = "";
          finalDetails.forEach((d, idx) => {
            const dayNum = idx + 1;
            const flow = d.flow || "中量";
            const symptoms = d.symptoms || ["无"];
            cardsHtml += `
                        <div class="menstrual-day-card" data-day="${idx}">
                            <div class="day-title">Day${dayNum}</div>
                            <div class="section-label">流量</div>
                            <div class="flow-options">
                                ${flowOptions
                                  .map(
                                    (f) => `
                                    <span class="flow-opt ${flow === f ? "active" : ""}" data-value="${f}">
                                        <span></span> ${f}
                                    </span>
                                `,
                                  )
                                  .join("")}
                            </div>
                            <div class="section-label" style="margin-top:8px;">症状</div>
                            <div class="symptom-options">
                                ${symptomOptions
                                  .map(
                                    (s) => `
                                    <span class="symptom-opt ${symptoms.includes(s) ? "active" : ""}" data-value="${s}">
                                        <span></span> ${s}
                                    </span>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    `;
          });
          container.innerHTML = cardsHtml;

          container.querySelectorAll(".menstrual-day-card").forEach((card) => {
            card.querySelectorAll(".flow-opt").forEach((opt) => {
              opt.addEventListener("click", function (e) {
                e.stopPropagation();
                const parent = this.closest(".flow-options");
                parent
                  .querySelectorAll(".flow-opt")
                  .forEach((o) => o.classList.remove("active"));
                this.classList.add("active");
              });
            });
            card.querySelectorAll(".symptom-opt").forEach((opt) => {
              opt.addEventListener("click", function (e) {
                e.stopPropagation();
                const isNone = this.dataset.value === "无";
                const parent = this.closest(".symptom-options");
                if (isNone) {
                  parent
                    .querySelectorAll(".symptom-opt")
                    .forEach((o) => o.classList.remove("active"));
                  this.classList.add("active");
                } else {
                  const noneOpt = parent.querySelector(
                    '.symptom-opt[data-value="无"]',
                  );
                  if (noneOpt) noneOpt.classList.remove("active");
                  this.classList.toggle("active");
                }
              });
            });
          });
        }

        renderDayCards();
        document
          .getElementById("mfDays")
          .addEventListener("change", renderDayCards);
        document
          .getElementById("mfDays")
          .addEventListener("input", renderDayCards);

        document
          .getElementById("mfSave")
          .addEventListener("click", function () {
            const startDateVal = document.getElementById("mfStartDate").value;
            const daysVal =
              parseInt(document.getElementById("mfDays").value) || 1;
            const dayDetails = [];
            document.querySelectorAll(".menstrual-day-card").forEach((card) => {
              const flow =
                card.querySelector(".flow-opt.active")?.dataset.value || "中量";
              const symptoms = [];
              card
                .querySelectorAll(".symptom-opt.active")
                .forEach((el) => symptoms.push(el.dataset.value));
              if (symptoms.length === 0) symptoms.push("无");
              if (symptoms.includes("无"))
                dayDetails.push({ flow, symptoms: ["无"] });
              else dayDetails.push({ flow, symptoms });
            });
            if (!startDateVal) {
              alert("请选择开始日期");
              return;
            }
            if (dayDetails.length !== daysVal) {
              alert("请确保每天的流量和症状都已选择");
              return;
            }
            const recordData = {
              id: isEdit ? menstrualEditId : genId(),
              startDate: startDateVal,
              days: daysVal,
              dayDetails: dayDetails,
              createdAt: isEdit
                ? item?.createdAt || new Date().toISOString()
                : new Date().toISOString(),
            };
            if (isEdit) {
              const idx = data.menstrual.findIndex(
                (d) => d.id === menstrualEditId,
              );
              if (idx !== -1) {
                data.menstrual[idx] = { ...data.menstrual[idx], ...recordData };
                saveData();
                goBack();
                renderMenstrual();
              }
            } else {
              data.menstrual.push(recordData);
              data.menstrual.sort(
                (a, b) => new Date(a.startDate) - new Date(b.startDate),
              );
              saveData();
              goBack();
              renderMenstrual();
            }
          });

        const delBtn = document.getElementById("mfDelete");
        if (delBtn) {
          delBtn.addEventListener("click", function () {
            if (confirm("确定删除吗？")) {
              data.menstrual = data.menstrual.filter(
                (d) => d.id !== menstrualEditId,
              );
              saveData();
              goBack();
              renderMenstrual();
            }
          });
        }
      }

      document
        .getElementById("addMenstrualBtn")
        .addEventListener("click", () => showMenstrualForm(null));
      document
        .getElementById("menstrualFormBack")
        .addEventListener("click", goBack);

      // ============================================================
      // 分页
      // ============================================================
      function renderPagination(
        containerId,
        infoId,
        prevId,
        nextId,
        currentPage,
        totalPages,
      ) {
        const info = document.getElementById(infoId);
        const prev = document.getElementById(prevId);
        const next = document.getElementById(nextId);
        if (info)
          info.textContent = currentPage + " / " + Math.max(1, totalPages);
        if (prev) prev.disabled = currentPage <= 1;
        if (next) next.disabled = currentPage >= totalPages;
      }

      // ============================================================
      // 纪念日
      // ============================================================
      let anniversaryPage = 1;

      function renderAnniversary() {
        const items = data.love.anniversaries || [];
        const total = items.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (anniversaryPage > totalPages) anniversaryPage = totalPages;
        const start = (anniversaryPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const pageItems = items.slice(start, end);
        const container = document.getElementById("anniversaryList");

      function checkTreeLevelUp() {
        let tree = data.love.loveTree;
        while (tree.exp >= tree.level * 10) {
          tree.exp -= tree.level * 10;
          tree.level++;
        }
        saveData();
      }

      function addTreeExp(amount) {
        data.love.loveTree.exp += amount;
        checkTreeLevelUp();
        renderTree();
        if (document.getElementById("pageLove").classList.contains("active"))
          renderLove();

      function renderTree() {
        const tree = data.love.loveTree || { level: 1, exp: 0 };
        const expNeeded = tree.level * 10;
        const progress = Math.min(

        );
        const emojis = [
          "🌰", // 1级 - 种子

          "🌿", // 3级 - 幼苗

          "🌳", // 5级 - 大树
          "🌴", // 6级 - 生长中
          "🎄", // 7级 - 成长中
          "🌺", // 8级 - 开花
          "🌸", // 9级 - 盛开
          "🌹", // 10级 - 满级
        ];
        const emoji =
          emojis[Math.min(tree.level - 1, emojis.length - 1)] || "🌳";
        const container = document.getElementById("treeContent");
        const name = data.love.myName || "我";
        const herName = data.love.herName || "她";
        container.innerHTML = `

                challenge.done = !challenge.done;
                saveData();
                renderChallenge();
              }
            });
          });
          container.querySelectorAll(".list-item-card").forEach((el) => {
            setupLongPress(el, function (target) {
              const id = target.dataset.id;
              const item = data.love.challenges.find((c) => c.id === id);
              if (item) showChallengeForm(item);
            });
            el.addEventListener("click", function (e) {
              if (
                e.target.closest(".status-badge") ||
                e.target.closest(".del-btn")
              )
                return;
              const id = this.dataset.id;
              const item = data.love.challenges.find((c) => c.id === id);
              if (item) showChallengeForm(item);
            });
          });
          container.querySelectorAll(".del-btn").forEach((btn) => {

              if (id && confirm("确定删除吗？")) {
                const card = this.closest(".list-item-card");
                if (card) createDeleteParticles(card);
                data.love.challenges = data.love.challenges.filter(
                  (c) => c.id !== id,
                );
                saveData();
                setTimeout(renderChallenge, 300);
              }
            });
          });

      function renderYearlyReport() {
        const container = document.getElementById("yearlyReportContent");
        const happyCount = data.happy.length;
        const travelCount = data.travel.length;
        const anniversaryCount = data.love.anniversaries?.length || 0;
        const letterCount = data.love.loveLetters?.length || 0;
        const challengeCount = data.love.challenges?.length || 0;
        const fightCount = data.love.fights?.length || 0;

        let days = 0;
        if (data.love.startDate) {
          const start = new Date(data.love.startDate);
          const today = new Date();
          if (data.love.breakup && data.love.breakup.date) {
            const breakup = new Date(data.love.breakup.date);
            if (!data.love.breakup.reconcileDate) {
              days = Math.floor((breakup - start) / (1000 * 60 * 60 * 24));
            } else {
              const reconcile = new Date(data.love.breakup.reconcileDate);
              const daysBefore = Math.floor(
                (breakup - start) / (1000 * 60 * 60 * 24),
              );
              const daysAfter = Math.floor(
                (today - reconcile) / (1000 * 60 * 60 * 24),
              );
              days = daysBefore + Math.max(0, daysAfter);
            }
          } else {
            days = Math.floor((today - start) / (1000 * 60 * 60 * 24));
          }
        }

        const monthlyCounts = Array(12).fill(0);
        data.happy.forEach((h) => {
          if (h.startDate) {
            const d = new Date(h.startDate);
            const month = d.getMonth();
            if (month >= 0 && month < 12) monthlyCounts[month]++;
          }
        });
        const maxCount = Math.max(...monthlyCounts, 1);
        const monthNames = [
          "1月",
          "2月",
          "3月",
          "4月",
          "5月",
          "6月",
          "7月",
          "8月",
          "9月",
          "10月",
          "11月",
          "12月",

                            <div class="yr-item"><div class="yr-number">${challengeCount}</div><div class="yr-label">✅ 打卡</div></div>
                            <div class="yr-item"><div class="yr-number">${fightCount}</div><div class="yr-label">💢 吵架</div></div>
                            <div class="yr-item"><div class="yr-number">${data.love.breakup?.date ? "💔" : "💕"}</div><div class="yr-label">${data.love.breakup?.date ? "已分手" : "恋爱中"}</div></div>
                        </div>
                        <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:8px;">📊 月度分布</div>
                        <div class="bar-chart-vertical" style="height:80px;">
            `;
        monthNames.forEach((name, idx) => {
          const count = monthlyCounts[idx];
          const pct = maxCount > 0 ? (count / maxCount) * 100 : 0;
          html += `

                    </div>

        html += `</div></div></div>`;
        container.innerHTML = html;

      function renderArchive() {
        const container = document.getElementById("archiveContent");
        const love = data.love;
        let days = 0,
          isBreakup = false,
          breakupDate = "",
          reconcileDate = "";

        if (love.startDate) {
          const start = new Date(love.startDate);
          const today = new Date();
          if (love.breakup && love.breakup.date) {
            const breakup = new Date(love.breakup.date);
            if (!love.breakup.reconcileDate) {
              days = Math.floor((breakup - start) / (1000 * 60 * 60 * 24));
              isBreakup = true;
              breakupDate = love.breakup.date;
            } else {
              const reconcile = new Date(love.breakup.reconcileDate);
              const daysBefore = Math.floor(
                (breakup - start) / (1000 * 60 * 60 * 24),
              );
              const daysAfter = Math.floor(
                (today - reconcile) / (1000 * 60 * 60 * 24),
              );
              days = daysBefore + Math.max(0, daysAfter);
              reconcileDate = love.breakup.reconcileDate;
              if (today < reconcile) {
                isBreakup = true;
                breakupDate = love.breakup.date;
              }
            }
          } else {
            days = Math.floor((today - start) / (1000 * 60 * 60 * 24));
          }
        }

        let html = `
                <div class="archive-status">
                    <div class="status-title">${love.myName || "我"} 💗 ${love.herName || "她"}</div>
                    <div class="status-detail">${isBreakup ? `💔 已于 ${formatDate(breakupDate)} 分手` : reconcileDate ? `💕 和好于 ${formatDate(reconcileDate)}` : "💕 恋爱中"}</div>
                    <div class="status-days">${isBreakup ? "💔 共同走过" : "💕 在一起"} ${days} 天</div>
                    ${love.startDate ? `<div class="status-detail">📅 始于 ${formatDate(love.startDate)}</div>` : ""}

                <div class="archive-timeline">

        const timeline = [];

          timeline.push({ date: love.startDate, icon: "💕", text: "恋爱开始" });
        }
        if (love.breakup?.date) {
          timeline.push({ date: love.breakup.date, icon: "💔", text: "分手" });
        }
        if (love.breakup?.reconcileDate) {
          timeline.push({
            date: love.breakup.reconcileDate,
            icon: "💕",
            text: "和好",
          });
        }
        (love.anniversaries || []).forEach((a) => {
          timeline.push({ date: a.date, icon: "🎖️", text: a.content });
        });
        if (data.happy.length > 0) {
          const first = data.happy[0];
          timeline.push({
            date: first.startDate,
            icon: "😊",
            text: "第一次快乐: " + (first.location || ""),
          });
        }
        if (data.travel.length > 0) {
          const first = data.travel[0];
          timeline.push({
            date: first.startDate,
            icon: "✈️",
            text: "第一次旅行: " + (first.location || ""),
          });
        }
        if (love.loveLetters && love.loveLetters.length > 0) {
          const first = love.loveLetters[0];
          timeline.push({
            date: first.date,
            icon: "💌",
            text: "第一封情书: " + first.title,

          timeline.push({
            date: first.date,
            icon: "✅",
            text: "第一次打卡: " + first.content,

      function showReminderModal() {
        let listHtml = data.reminders
          .map(
            (r, i) => `
                <div class="reminder-item">
                    <span class="rem-text">${r.text}</span>
                    <button class="rem-del" data-ridx="${i}">❌</button>
                </div>
            `,
          )
          .join("");
        const html = `
                <div class="form-group">
                    <label>添加提醒</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="remInput" placeholder="输入提醒内容" style="flex:1;padding:8px 12px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:15px;">

                </div>
